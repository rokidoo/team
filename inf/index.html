<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Influencer · Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F2EC; --cream2:#EAE7E1; --card:#FFFDF9;
    --ink:#121212; --ink-soft:#4A4A46; --mut:#8A867E;
    --cobalt:#2F5DFF; --cobalt-s:#E4EBFF;
    --green:#22C55E;  --green-s:#DFF6E7;
    --mustard:#FFC53D;--mustard-s:#FFF3D6;
    --red:#E8402A;    --red-s:#FDE4DF;
    --purple:#A855F7; --purple-s:#F1E4FE;
    --orange:#FF8A00; --orange-s:#FFE9D1;
    --gray-s:#ECEAE4;
    --fh:'Space Grotesk','Plus Jakarta Sans',sans-serif;
    --fb:'Plus Jakarta Sans',sans-serif;
    --fm:'JetBrains Mono',monospace;
    --b:3px solid var(--ink); --b2:2px solid var(--ink);
    --sh:6px 6px 0 var(--ink); --sh-sm:4px 4px 0 var(--ink);
    --r:16px; --r-lg:24px;
    --sidew:236px; --sidew-c:74px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    background:var(--cream); color:var(--ink); min-height:100dvh; font-family:var(--fb);
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
  }
  h1,h2,h3{font-family:var(--fh); letter-spacing:-.02em}
  .hidden{display:none!important}
  .mono{font-family:var(--fm)}

  /* ================= SIDEBAR (masaüstü) ================= */
  aside{
    display:none; position:fixed; z-index:50; inset:0 auto 0 0; width:var(--sidew);
    background:var(--card); border-right:var(--b); padding:20px 14px;
    flex-direction:column; gap:6px; transition:width .18s ease;
  }
  aside .brand{
    font-family:var(--fh); font-weight:700; font-size:1.15rem; padding:6px 10px 18px;
    white-space:nowrap; overflow:hidden;
  }
  aside .brand b{color:var(--cobalt)}
  aside .navbtn{
    display:flex; align-items:center; gap:12px; width:100%;
    background:none; border:var(--b2); border-color:transparent; border-radius:12px;
    padding:11px 12px; font-family:var(--fb); font-weight:700; font-size:.9rem;
    color:var(--ink-soft); cursor:pointer; white-space:nowrap; overflow:hidden;
  }
  aside .navbtn .ic{font-size:1.15rem; line-height:1; width:24px; text-align:center; flex-shrink:0}
  aside .navbtn:hover{background:var(--cream2)}
  aside .navbtn.on{
    background:var(--mustard); border:var(--b2); color:var(--ink); box-shadow:var(--sh-sm);
  }
  aside .sp{flex:1}
  aside .user{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-top:var(--b2);
    white-space:nowrap; overflow:hidden;
  }
  aside .user .nm{font-weight:800; font-size:.82rem}
  aside .user .rl{font-size:.68rem; color:var(--mut); font-weight:600}
  aside .collapse{
    position:absolute; top:18px; right:-16px; width:32px; height:32px;
    background:var(--card); border:var(--b2); border-radius:50%; cursor:pointer;
    font-weight:800; font-family:var(--fm); box-shadow:var(--sh-sm); z-index:51;
  }
  @media(min-width:960px){
    aside{display:flex}
    body{padding-left:var(--sidew); padding-bottom:24px}
    nav.bottom{display:none}
    header .mlogo{display:none}
    html.collapsed aside{width:var(--sidew-c)}
    html.collapsed body{padding-left:var(--sidew-c)}
    html.collapsed aside .brand{font-size:0}
    html.collapsed aside .brand::first-letter{font-size:1.15rem}
    html.collapsed aside .navbtn span.lbl, html.collapsed aside .user div{display:none}
  }

  /* ================= TOP BAR ================= */
  header{
    position:sticky; top:0; z-index:40; background:var(--cream);
    border-bottom:var(--b); padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; gap:12px;
  }
  header .mlogo{font-family:var(--fh); font-weight:700; font-size:1.05rem}
  header .mlogo b{color:var(--cobalt)}
  header .sp{flex:1}
  .weekpick{
    background:var(--card); border:var(--b2); color:var(--ink); border-radius:12px;
    padding:9px 12px; font-size:.82rem; font-weight:700; font-family:var(--fb);
    max-width:170px; box-shadow:var(--sh-sm); cursor:pointer;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--mustard);
    border:var(--b2); display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:.85rem; cursor:pointer; box-shadow:var(--sh-sm); flex-shrink:0;
  }

  /* ================= BOTTOM NAV (mobil) ================= */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--card); border-top:var(--b);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--mut); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:.62rem; font-weight:800; padding:6px 2px; border-radius:12px; font-family:var(--fb);
  }
  nav.bottom button .ic{font-size:1.2rem; line-height:1}
  nav.bottom button.on{color:var(--ink); background:var(--mustard); border:var(--b2); box-shadow:var(--sh-sm)}
  @media(min-width:960px){ nav.bottom{display:none} }

  /* ================= GENEL ================= */
  main{padding:20px 16px; max-width:1060px; margin:0 auto}
  @media(min-width:960px){main{padding:28px 32px}}
  h2{font-size:1.35rem; margin-bottom:4px}
  .sub{color:var(--mut); font-size:.82rem; font-weight:600; margin-bottom:18px}
  .sect{margin-bottom:26px}
  .sect h3{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.09em;
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .sect h3 .cnt{
    background:var(--ink); color:var(--card); border-radius:99px; padding:1px 9px;
    font-size:.68rem; font-family:var(--fm);
  }
  .cards{display:grid; gap:14px}
  @media(min-width:1100px){.cards{grid-template-columns:1fr 1fr}}
  .card{
    background:var(--card); border:var(--b); border-radius:var(--r);
    padding:16px; box-shadow:var(--sh);
  }
  .chip{
    display:inline-flex; align-items:center; border-radius:99px;
    padding:4px 11px; font-size:.68rem; font-weight:800; border:var(--b2); color:var(--ink);
    white-space:nowrap;
  }
  .own{
    width:28px;height:28px;border-radius:9px; display:inline-flex; border:var(--b2);
    align-items:center;justify-content:center; font-weight:800; font-size:.8rem; flex-shrink:0;
  }
  .mrow{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px}
  .m{font-size:.78rem; color:var(--ink-soft); font-weight:600}
  .m b{font-family:var(--fm); font-weight:700}
  .empty{
    text-align:center; color:var(--mut); font-size:.85rem; font-weight:600; padding:30px 12px;
    border:2px dashed var(--mut); border-radius:var(--r); background:var(--cream2);
  }
  .cards .empty{grid-column:1/-1}

  /* kreatif kartı */
  .ccard .top{display:flex; gap:12px; align-items:flex-start}
  .ccard .code{font-family:var(--fm); font-size:.72rem; font-weight:700; word-break:break-all; line-height:1.4}
  .ccard .meta{font-size:.72rem; color:var(--mut); font-weight:600; margin-top:4px; display:flex; align-items:center; gap:6px}
  .ccard .thumb{
    width:54px;height:54px;border-radius:12px; background:var(--cream2); border:var(--b2);
    flex-shrink:0; object-fit:cover; display:flex;align-items:center;justify-content:center; font-size:1.35rem;
  }
  .ccard .hook{
    margin-top:12px; font-size:.85rem; font-weight:600; background:var(--card);
    border:var(--b2); border-left-width:6px; padding:9px 11px; border-radius:10px;
  }
  .ccard .reason{margin-top:9px; font-size:.74rem; color:var(--mut); font-weight:600; font-style:italic}

  /* filtre çipleri */
  .filters{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; margin-bottom:10px; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{
    flex-shrink:0; background:var(--card); border:var(--b2); color:var(--ink-soft);
    border-radius:99px; padding:7px 14px; font-size:.75rem; font-weight:800; cursor:pointer; font-family:var(--fb);
  }
  .fchip.on{background:var(--ink); border-color:var(--ink); color:var(--card); box-shadow:var(--sh-sm)}

  /* ekip */
  .trow{display:flex; align-items:center; gap:12px}
  .trow .nm{font-family:var(--fh); font-size:1rem; font-weight:700}
  .trow .bar{flex:1; height:12px; background:var(--cream2); border:var(--b2); border-radius:99px; overflow:hidden}
  .trow .bar i{display:block; height:100%}
  .trow .wn{font-family:var(--fm); font-weight:700; font-size:1.05rem}
  .tstats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
  .tstat{background:var(--cream2); border:var(--b2); border-radius:12px; padding:10px 6px; text-align:center}
  .tstat b{display:block; font-size:1.15rem; font-family:var(--fm)}
  .tstat span{font-size:.62rem; color:var(--ink-soft); font-weight:700}

  /* finans */
  .tblwrap{overflow-x:auto; border:var(--b); border-radius:var(--r); background:var(--card); box-shadow:var(--sh)}
  table{border-collapse:collapse; width:100%; font-size:.78rem; min-width:600px}
  th,td{padding:10px 12px; text-align:right; border-bottom:var(--b2); white-space:nowrap}
  th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--card)}
  th{font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; background:var(--mustard-s)}
  td{font-family:var(--fm); font-weight:500}
  td:first-child{font-family:var(--fb); font-weight:700}
  tr:last-child td{border-bottom:none}
  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px}
  @media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--card); border:var(--b); border-radius:var(--r); padding:14px; box-shadow:var(--sh-sm)}
  .kpi b{display:block; font-size:1.35rem; font-family:var(--fm)}
  .kpi span{font-size:.68rem; color:var(--mut); font-weight:800; text-transform:uppercase; letter-spacing:.05em}

  /* board kanban */
  .board{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 16px; scroll-snap-type:x mandatory; align-items:flex-start; scrollbar-width:thin}
  .bcol{
    flex:0 0 min(86vw, 330px); width:min(86vw, 330px); min-width:0; max-width:min(86vw, 330px);
    scroll-snap-align:start; border:var(--b); border-radius:var(--r);
    background:var(--card); box-shadow:var(--sh); display:flex; flex-direction:column;
  }
  @media(min-width:960px){ .board{scroll-snap-type:none} .bcol{flex-basis:318px; width:318px; max-width:318px} }
  .bcol .bbody{min-width:0}
  .bcol .card{min-width:0; max-width:100%}
  .bcol .bhead{
    display:flex; align-items:center; gap:7px; padding:11px 13px; border-bottom:var(--b);
    border-radius:13px 13px 0 0; font-family:var(--fh); font-weight:700; font-size:.82rem; white-space:nowrap;
  }
  .bcol .bhead .cnt{margin-left:auto; background:var(--ink); color:var(--card); border-radius:99px; padding:1px 9px; font-size:.66rem; font-family:var(--fm)}
  .bcol .bbody{padding:8px; display:flex; flex-direction:column; gap:8px; min-height:100px; flex:1; max-height:66dvh; overflow-y:auto; overscroll-behavior:contain}
  .bcol.dragover{outline:3px dashed var(--ink); outline-offset:-6px}
  .bcol .card{box-shadow:var(--sh-sm)}
  .bcol .empty{padding:14px 8px; font-size:.7rem}

  /* kompakt board kartı */
  .ccard.mini{padding:10px 11px}
  .ccard.mini .top{gap:9px}
  .ccard.mini .thumb{width:36px;height:36px;border-radius:9px;font-size:1rem;border-width:2px}
  .ccard.mini .code{font-size:.64rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; word-break:normal}
  .ccard.mini .meta{font-size:.62rem; margin-top:3px; gap:5px}
  .ccard.mini .own{width:20px;height:20px;font-size:.6rem;border-radius:6px;border-width:2px}
  .ccard.mini .chip{padding:2px 8px; font-size:.56rem; border-width:2px}
  .ccard.mini .editbtn{min-width:24px;height:24px;font-size:.6rem;border-radius:6px}
  .ccard.mini .hook{
    font-size:.7rem; padding:6px 8px; margin-top:8px; border-width:2px; border-left-width:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .ccard.mini .mrow{gap:3px 10px; margin-top:8px}
  .ccard.mini .m{font-size:.64rem}
  .ccard.mini .reason{
    font-size:.62rem; margin-top:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .addbtn{
    background:none; border:2px dashed var(--mut); color:var(--ink-soft); border-radius:10px;
    padding:9px; font-weight:800; cursor:pointer; font-family:var(--fb); font-size:.75rem;
  }
  .editbtn{
    background:var(--cream2); border:var(--b2); border-radius:8px; min-width:28px; height:28px;
    cursor:pointer; font-size:.75rem; flex-shrink:0; font-family:inherit;
  }
  [draggable="true"]{cursor:grab}

  /* üretim panosu — tam genişlik, ince kolonlar */
  main.wide{max-width:none}
  @media(min-width:960px){
    .pboard{gap:10px}
    .pboard .bcol{flex:1 1 0; width:auto; min-width:150px; max-width:none}
    .pboard .bhead{font-size:.6rem; padding:9px 8px; gap:5px; letter-spacing:0}
    .pboard .bhead .cnt{font-size:.58rem; padding:1px 7px}
    .pboard .bbody{padding:6px; gap:6px; max-height:70dvh}
    .pboard .addbtn{font-size:.62rem; padding:6px}
    .pboard .pcard{padding:8px 9px}
  }

  /* modal */
  .modal{position:fixed; inset:0; z-index:80; background:rgba(18,18,18,.55); display:flex; align-items:flex-end; justify-content:center}
  @media(min-width:640px){.modal{align-items:center; padding:20px}}
  .modal .box{
    background:var(--card); border:var(--b); width:100%; max-width:540px; box-shadow:var(--sh);
    border-radius:20px 20px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:88dvh; overflow:auto;
  }
  @media(min-width:640px){.modal .box{border-radius:20px}}
  .modal h3{font-size:1.05rem; margin-bottom:14px}
  .frow{display:grid; grid-template-columns:1fr 1fr; gap:0 10px}
  .flabel{font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:2px 0 4px}
  .btn.danger{background:var(--red)}
  .btn.ghost{background:var(--card); color:var(--ink)}
  .btnrow{display:flex; gap:10px; margin-top:8px}

  /* form / giriş */
  .auth{max-width:400px; margin:8vh auto 0; padding:0 20px}
  .authcard{background:var(--card); border:var(--b); border-radius:var(--r-lg); padding:26px 22px; box-shadow:var(--sh)}
  .auth .logo{font-family:var(--fh); font-size:1.45rem; font-weight:700; text-align:center; margin-bottom:4px}
  .auth .logo b{color:var(--cobalt)}
  .auth p{color:var(--mut); text-align:center; font-size:.85rem; font-weight:600; margin-bottom:22px}
  input,textarea,select{
    width:100%; background:var(--card); border:var(--b2); color:var(--ink);
    border-radius:12px; padding:13px 14px; font-size:.95rem; margin-bottom:12px; font-family:var(--fb); font-weight:600;
  }
  input:focus,textarea:focus{outline:none; border-color:var(--cobalt); box-shadow:var(--sh-sm)}
  .btn{
    width:100%; background:var(--cobalt); color:#fff; border:var(--b2); border-radius:12px;
    padding:14px; font-size:.95rem; font-weight:800; cursor:pointer; font-family:var(--fb); box-shadow:var(--sh-sm);
  }
  .btn:active{transform:translate(2px,2px); box-shadow:none}
  .btn:disabled{opacity:.5}
  .authmsg{font-size:.8rem; font-weight:700; text-align:center; margin-top:12px; color:var(--mut)}
  .authmsg.err{color:var(--red)}
  .switch{text-align:center; margin-top:16px; font-size:.82rem; font-weight:600; color:var(--mut)}
  .switch a{color:var(--cobalt); font-weight:800; cursor:pointer; text-decoration:none}

  /* import */
  textarea.json{min-height:230px; font-family:var(--fm); font-size:.74rem; font-weight:500}
  .implog{
    font-family:var(--fm); font-size:.72rem; background:var(--ink); color:#DFF6E7;
    border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; max-height:240px; overflow:auto;
  }

  /* demo bar */
  .demo{
    background:var(--mustard-s); border:var(--b2); font-size:.74rem; font-weight:700;
    padding:9px 13px; border-radius:12px; margin-bottom:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .demo select{width:auto; margin:0; padding:5px 9px; font-size:.74rem; border-radius:9px}
  /* ================= OPERASYON EKLERİ ================= */
  nav.bottom{overflow-x:auto; scrollbar-width:none} nav.bottom::-webkit-scrollbar{display:none}
  nav.bottom button{min-width:50px}
  .fgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 10px}
  @media(min-width:700px){.fgrid{grid-template-columns:repeat(4,1fr)} .fgrid.c3{grid-template-columns:repeat(3,1fr)} .fgrid.c2{grid-template-columns:repeat(2,1fr)}}
  .fgrid input,.fgrid select{margin-bottom:10px}
  .dayrow{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
  .dayrow input[type=date],.dayrow select{width:auto; margin:0; padding:9px 12px; font-size:.85rem}
  .dayrow .nb{background:var(--card); border:var(--b2); border-radius:10px; width:38px; height:38px; cursor:pointer; font-weight:800; font-family:var(--fm); box-shadow:var(--sh-sm)}
  .dayrow .dl{font-family:var(--fh); font-weight:700; font-size:1rem}
  .who{display:flex; flex-wrap:wrap; gap:8px}
  .who .w{display:inline-flex; align-items:center; gap:6px; border:var(--b2); border-radius:99px; padding:6px 12px; font-size:.74rem; font-weight:800; background:var(--card)}
  .who .w.ok{background:var(--green-s)} .who .w.no{background:var(--red-s)}
  .scrow{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
  .scbtn{width:32px; height:32px; border:var(--b2); border-radius:9px; background:var(--card); font-family:var(--fm); font-weight:700; cursor:pointer; font-size:.8rem; padding:0}
  .scbtn.on{background:var(--ink); color:var(--card); box-shadow:var(--sh-sm)}
  .chk{display:flex; align-items:center; gap:12px; padding:10px 12px; border:var(--b2); border-radius:12px; background:var(--card); margin-bottom:8px; cursor:pointer; user-select:none}
  .chk .bx{width:26px;height:26px;border:var(--b2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;background:var(--cream2);color:#fff}
  .chk.on{background:var(--green-s)} .chk.on .bx{background:var(--green)}
  .chk .lbl{font-weight:700; font-size:.88rem; flex:1}
  .chk .by{font-size:.64rem; color:var(--mut); font-weight:700; font-family:var(--fm); white-space:nowrap}
  .pill{display:inline-block; border:var(--b2); border-radius:8px; padding:2px 8px; font-size:.66rem; font-weight:800; background:var(--card)}
  .disc{display:grid; gap:4px; overflow-x:auto}
  .disc .r{display:grid; grid-template-columns:110px repeat(var(--n),minmax(18px,1fr)); gap:3px; align-items:center; font-size:.7rem; font-weight:700}
  .disc .c{height:22px; border:2px solid var(--ink); border-radius:6px; background:var(--red-s)} .disc .c.ok{background:var(--green)} .disc .c.na{background:var(--gray-s); border-style:dashed; border-color:var(--mut)}
  .disc .h{font-size:.58rem; text-align:center; color:var(--mut); font-family:var(--fm)}
  .bar{height:10px; background:var(--cream2); border:var(--b2); border-radius:99px; overflow:hidden; min-width:60px} .bar i{display:block;height:100%;background:var(--cobalt)}
  .vtext{font-size:.9rem; font-weight:600; margin:8px 0; white-space:pre-wrap}
  .tagc{display:inline-flex; gap:6px; flex-wrap:wrap}
  .tagc .fchip{padding:5px 11px; font-size:.68rem}
  .note{font-size:.74rem; color:var(--mut); font-weight:600; margin-top:8px}
  .stk .row{display:grid; grid-template-columns:1fr 90px 110px; gap:8px; align-items:center; padding:6px 0; border-bottom:2px solid var(--cream2)}
  .stk .row:last-child{border-bottom:none}

<script type="module">

   + yöneticinin ayrıca erişim verdiği hesaplar (shared_settings.inf_access = [kullanıcı id]).
   Veriler inf_ tablolarında (schema-v3.3). Ürün listesi ve kişi bilgileri kodda DEĞİL, veritabanında. */

/* ---------- yardımcılar ---------- */
const $ = id=>document.getElementById(id);
const esc = s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pad = n=>String(n).padStart(2,"0");
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const trToday = ()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Istanbul"});
const dayOf = ts=>ts?new Date(ts).toLocaleDateString("sv-SE",{timeZone:"Europe/Istanbul"}):null;
const addDays = (s,n)=>{ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const dayDiff = (a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const trShort = s=>s?new Date(s+"T00:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short"}):"";
const monday = s=>{ const d=new Date(s+"T00:00:00"); return addDays(s,-((d.getDay()+6)%7)); };
const nowIso = ()=>new Date().toISOString();
const TL = n=>n==null||n===""?"—":new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(+n||0);
const trNorm = s=>String(s||"").toLocaleLowerCase("tr").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u");
const isUrl = u=>/^https?:\/\/\S+$/i.test(String(u||"").trim());
const digits = s=>String(s||"").replace(/\D/g,"");
function normPhone(v){ let d=digits(v); if(!d) return null; if(d.length===12&&d.startsWith("90")) d=d.slice(2); if(d.length===10) d="0"+d;
  return d.length===11&&d[0]==="0" ? `${d.slice(0,4)} ${d.slice(4,7)} ${d.slice(7,9)} ${d.slice(9)}` : String(v).trim(); }
const waLink = p=>{ let d=digits(p); if(d.length===11&&d[0]==="0") d="90"+d.slice(1); else if(d.length===10) d="90"+d; return d.length>=11?`https://wa.me/${d}`:null; };
// instagram linkinden kullanıcı adı ("@ad" ya da düz "ad" da olur)
function userOf(v){ const s=String(v||"").trim(); const m=s.match(/instagram\.com\/([^/?#\s]+)/i);
  if(m){ const u=m[1].toLowerCase(); return ["direct","reel","reels","p","stories","explore"].includes(u)?null:u; }
  const a=s.replace(/^@/,""); return /^[a-z0-9._]{2,30}$/i.test(a)?a.toLowerCase():null; }
let toastT=null;
function toast(msg){ $("toastHost").innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>$("toastHost").innerHTML="",2600); }
function closeModal(){ $("modalHost").innerHTML=""; }
function modal(html){ $("modalHost").innerHTML=`<div class="modal" id="mBack"><div class="box">${html}</div></div>`; $("mBack").addEventListener("click",e=>{ if(e.target.id==="mBack") closeModal(); }); }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast("Kopyalandı ✓"); }catch(e){ modal(`<h3>Kopyala</h3><textarea rows="8" id="cpT">${esc(t)}</textarea><button class="btn" onclick="document.getElementById('modalHost').innerHTML=''">Kapat</button>`); $("cpT").select(); } }

/* ---------- aşamalar ---------- */
const STAGES=[
  {k:"bulundu",   l:"Bulundu",                 i:"🔎"},
  {k:"iletisim",  l:"Mesaj atıldı / arandı",   s:"İletişim",   i:"💬"},
  {k:"bekleniyor",l:"Dönüş / fiyat bekleniyor",s:"Bekleniyor", i:"⏳"},
  {k:"anlasildi", l:"Anlaşıldı",               i:"🤝"},
  {k:"brief",     l:"Brief verildi",           s:"Brief",      i:"📝"},
  {k:"gonderildi",l:"Ürün gönderildi",         s:"Gönderildi", i:"📦"},
  {k:"teslim",    l:"Teslim edildi",           s:"Teslim",     i:"✅"},
  {k:"cekiyor",   l:"Çekiyor",                 i:"🎬"},
  {k:"video",     l:"Video geldi",             i:"📥"},
  {k:"onay",      l:"Video onaylandı",         s:"Onaylandı",  i:"👍"},
  {k:"yayin",     l:"Yayınlandı",              i:"📱"},
];
const SIDE=[{k:"sonra",l:"Sonra / beklemede",s:"Sonra",i:"⏸"},{k:"olumsuz",l:"Olumsuz / vazgeçti",s:"Olumsuz",i:"❌"},{k:"kacti",l:"Kaçtı (video gelmedi)",s:"Kaçtı",i:"🚫"}];
const ALLST=[...STAGES,...SIDE];
const stOf = k=>ALLST.find(x=>x.k===k)||STAGES[0];
const rank = k=>STAGES.findIndex(x=>x.k===k);
const DEALS=[["barter","Barter (ürün karşılığı)"],["ucretli","Ücretli"],["barter_ucret","Barter + ücret"],["collab","Collab"],["diger","Diğer"]];
const dealL = k=>(DEALS.find(d=>d[0]===k)||[,"Belirsiz"])[1];
const KINDS=["Anne / aile","UGC içerik üreticisi","Fenomen / blogger","Sağlık / uzman","Diğer"];
const paidDeal = p=>["ucretli","barter_ucret","collab"].includes(p.deal) && +p.fee>0;

/* ---------- varsayılan ayarlar (Ayarlar'dan değişir) ---------- */
const DEF_PRODUCTS=[{k:"uz-multi", l:"Uzbionik Multivitamin"}];
const DEF_REM={cevap:3, gonder:2, kargo:4, video:7, onay:2, yayin:2};
const DEF_TPL=[
  {k:"ilk", l:"İlk mesaj", t:"Merhaba {isim} 🌸 Paylaşımlarınızı çok beğeniyoruz. {urun} için sizinle bir iş birliği yapmak isteriz. Uygunsanız detayları paylaşabilir miyim?"},
  {k:"fiyat", l:"Fiyat sor", t:"Merhaba {isim}, iş birliği için reels / UGC video ücretinizi ve teslim sürenizi paylaşabilir misiniz? Ürün karşılığı (barter) çalışıyorsanız onu da belirtirseniz sevinirim 🌸"},
  {k:"adres", l:"Adres iste", t:"Harika, çok sevindik 🌸 Ürünü göndermemiz için ad soyad, açık adres ve telefon numaranızı yazabilir misiniz?"},
  {k:"kargo", l:"Kargo bilgisi", t:"Ürününüz kargoya verildi 📦 Takip linki: {kargo}\nUlaştığında haber verirseniz çok seviniriz."},
  {k:"brief", l:"Brief", t:"Merhaba {isim}, {urun} videosu için kısa notlarımız:\n• Video dikey, 30–60 sn, doğal ve samimi olsun.\n• Ürün hakkında yalnızca size ilettiğimiz onaylı cümleleri kullanın; \"tedavi eder, iyileştirir, boy uzatır, iştah açar\" gibi iddialar kullanmayın.\n• Ürünü kullanım anında gösterin, fiyat ve indirim söylemeyin.\n• Videoyu paylaşmadan önce bize iletin.\nTeslim için hedef tarih: {tarih}"},
  {k:"hatirlat", l:"Hatırlat", t:"Merhaba {isim} 🌸 Ürün size ulaştı mı? Video için tahmini bir tarih paylaşabilir misiniz?"},
  {k:"yayin", l:"Yayın iste", t:"Videonuz için çok teşekkür ederiz, çok beğendik 🙏 Paylaştığınızda linkini bizimle paylaşabilir misiniz?"},
];

/* ---------- durum ---------- */
const S = { me:null, profile:null, mgr:false, tab:"bugun", prod:"*", P:[], L:[], set:{}, q:"", fSt:"", fDeal:"", fFlag:"", team:[], access:[] };
const products = ()=>{ const v=S.set.products; return Array.isArray(v)&&v.length?v:DEF_PRODUCTS; };
const prodL = k=>k?(products().find(p=>p.k===k)?.l||k):"Ürün seçilmedi";
const rem = ()=>({...DEF_REM, ...(S.set.reminders||{})});
const tpls = ()=>{ const v=S.set.templates; return Array.isArray(v)&&v.length?v:DEF_TPL; };
const inProd = p=>S.prod==="*" || (S.prod===""?!p.product:p.product===S.prod);
const age = p=>dayDiff(dayOf(p.stage_at)||trToday(), trToday());

/* ---------- veri ---------- */
async function fetchAll(table, build){
  let out=[], from=0;
  while(true){ let q=sb.from(table).select("*"); if(build) q=build(q); const {data,error}=await q.range(from,from+999); if(error) throw error; out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return out;
}
async function loadAll(){
  if(DEMO) return;
  const [p,l,st]=await Promise.all([
    fetchAll("inf_people", q=>q.order("updated_at",{ascending:false})),
    fetchAll("inf_log", q=>q.gte("at", addDays(trToday(),-120)).order("at",{ascending:false})),
    fetchAll("inf_settings"),
  ]);
  S.P=p; S.L=l; S.set=Object.fromEntries(st.map(x=>[x.key,x.value]));
}
async function saveSetting(key, value){
  if(!DEMO){ const {error}=await sb.from("inf_settings").upsert({key, value, updated_at:nowIso(), updated_by_name:S.profile?.name||null},{onConflict:"key"}); if(error) throw error; }
  S.set[key]=value;
}
// kaydet: değişen alanlar + aşama değiştiyse geçmişe yaz
async function savePerson(p, patch){
  const from=p?.stage||null, to=patch.stage??from;
  const row={...patch, updated_at:nowIso(), updated_by_name:S.profile?.name||null};
  if(p && to!==from) row.stage_at=nowIso();
  if(!p){ row.stage=row.stage||"bulundu"; row.stage_at=nowIso(); row.created_by=S.me?.id||null; row.created_by_name=S.profile?.name||null; }
  let data;
  if(DEMO){ data=p?{...p,...row}:{id:"d"+Math.random().toString(36).slice(2,9), created_at:nowIso(), ...row}; }
  else if(p){ const r=await sb.from("inf_people").update(row).eq("id",p.id).select().single(); if(r.error) throw r.error; data=r.data; }
  else{ const r=await sb.from("inf_people").insert(row).select().single(); if(r.error) throw r.error; data=r.data; }
  if(p) Object.assign(p,data); else S.P.unshift(data);
  if(!p || to!==from){ const lg={person_id:data.id, from_stage:p?from:null, to_stage:to, by_name:S.profile?.name||null, at:nowIso()};
    try{ if(!DEMO){ const r=await sb.from("inf_log").insert(lg).select().single(); if(!r.error) S.L.unshift(r.data); } else S.L.unshift({id:"l"+Math.random(),...lg}); }catch(e){} }
  return p||data;
}
// aşamaya geçerken ilgili tarihi (boşsa) bugüne yaz
function stagePatch(p, k){
  const t=trToday(), x={stage:k};
  const setIf=(f)=>{ if(!p?.[f]) x[f]=t; };
  if(rank(k)>=rank("brief")&&k!=="sonra") { if(k==="brief") setIf("brief_at"); }
  if(k==="gonderildi") setIf("sent_at");
  if(k==="teslim") { setIf("delivered_at"); if(!p?.sent_at) x.sent_at=t; }
  if(k==="video") setIf("video_at");
  if(k==="onay") { setIf("approved_at"); if(!p?.video_at) x.video_at=t; }
  return x;
}
async function moveStage(p, k){
  if(!p||p.stage===k) return;
  try{ await savePerson(p, stagePatch(p,k)); toast(`${p.name||"@"+(p.username||"")} → ${stOf(k).l} ✓`); render(); }catch(e){ fail(e); }
}
function fail(e){ const m=e?.message||String(e); toast(/inf_/.test(m)?"Supabase'de v3.3 SQL'i (influencer tabloları) çalıştırılmamış olabilir.":"Kaydedilemedi: "+m); }

/* ---------- hatırlatmalar ---------- */
function reminders(){
  const R=rem(), t=trToday(), out=[];
  const push=(g,p,why,sev)=>out.push({g,p,why,sev});
  S.P.filter(inProd).forEach(p=>{
    if(p.snooze_until && p.snooze_until>t) return;
    const a=age(p);
    if(p.next_at && p.next_at<=t) push("takip",p,`📌 Takip tarihi ${p.next_at===t?"bugün":trShort(p.next_at)+" idi"}${p.next_note?": "+p.next_note:""}`,1);
    if(["iletisim","bekleniyor"].includes(p.stage) && a>=R.cevap) push("cevap",p,`${a} gündür ${p.stage==="iletisim"?"cevap yok":"dönüş bekleniyor"} — hatırlat`,2);
    if(["anlasildi","brief"].includes(p.stage) && !p.sent_at && a>=R.gonder) push("gonder",p,`Anlaşılalı ${a} gün oldu, ürün gönderilmedi`,1);
    if(p.stage==="gonderildi" && a>=R.kargo) push("kargo",p,`Gönderileli ${a} gün — teslim edildi mi? Kargoyu kontrol et`,3);
    if(["teslim","cekiyor"].includes(p.stage)){ const d=dayDiff(p.delivered_at||dayOf(p.stage_at)||t,t); if(d>=R.video) push("video",p,`Teslim edileli ${d} gün, video gelmedi`,1); }
    if(p.stage==="video" && a>=R.onay) push("onay",p,`Video ${a} gündür onay bekliyor`,2);
    if(["onay","yayin"].includes(p.stage) && !p.ig_done){ const d=dayDiff(p.approved_at||dayOf(p.stage_at)||t,t); if(d>=R.yayin) push("ig",p,`Onaylı video ${d} gündür Instagram'da yayınlanmadı`,2); }
    if(paidDeal(p) && rank(p.stage)>=rank("video") && !p.paid) push("odeme",p,`Ödeme bekliyor: ${TL(p.fee)}`,2);
  });
  return out;
}
const RGRP=[["takip","📌 Takip tarihi gelenler"],["gonder","📦 Anlaşıldı, ürün gönderilmedi"],["video","🎬 Video gelmedi"],["cevap","💬 Cevap / dönüş bekleniyor"],["onay","👍 Video onay bekliyor"],["ig","📱 Instagram'da yayınlanmadı"],["odeme","💸 Ödeme bekliyor"],["kargo","🚚 Kargo teslim kontrolü"]];

/* ---------- ekran ---------- */
const TABS=[["bugun","⏰ Bugün"],["pano","📋 Pano"],["liste","📑 Liste"],["ozet","📊 Özet"],["ayar","⚙️ Ayarlar"]];
function render(){
  const n=reminders().length;
  $("main").innerHTML=`<div class="tabs2">${TABS.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?"on":""}">${l}${k==="bugun"&&n?` (${n})`:""}</button>`).join("")}</div>
    ${S.tab!=="ayar"?`<div class="pbar">${[["*","Tüm ürünler"],...products().map(p=>[p.k,p.k]),...(S.P.some(p=>!p.product)?[["","Ürün seçilmedi"]]:[])].map(([k,l])=>`<button data-prod="${esc(k)}" class="${S.prod===k?"on":""}" title="${esc(k==="*"?"":prodL(k))}">${esc(l)} <small>${S.P.filter(p=>k==="*"||(k===""?!p.product:p.product===k)).length}</small></button>`).join("")}</div>`:""}
    <div id="body"></div>`;
  $("main").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; render(); window.scrollTo(0,0); });
  $("main").querySelectorAll("[data-prod]").forEach(b=>b.onclick=()=>{ S.prod=b.dataset.prod; render(); });
  ({bugun:renderBugun, pano:renderPano, liste:renderListe, ozet:renderOzet, ayar:renderAyar})[S.tab]();
}
const who = p=>`<div class="nm">${esc(p.name||(p.username?"@"+p.username:"(isimsiz)"))}</div><div class="us">${p.username?"@"+esc(p.username):""}${p.username&&p.phone?" · ":""}${esc(p.phone||"")}</div>`;
const pchip = p=>`<span class="pc ${p.product?"":"none"}" title="${esc(prodL(p.product))}">${esc(p.product||"ürün?")}</span>`;
const flags = p=>`${p.ig_done?`<span class="tg g">📱 IG</span>`:""}${p.ad_done?`<span class="tg b">📣 Reklam</span>`:""}${paidDeal(p)?(p.paid?`<span class="tg g">💸 ödendi</span>`:`<span class="tg w">💸 ${esc(TL(p.fee))}</span>`):""}`;

/* ---- ⏰ Bugün ---- */
function renderBugun(){
  const el=$("body"), R=reminders();
  const by={}; R.forEach(r=>(by[r.g] ||= []).push(r));
  const t=trToday(), wk=monday(t);
  const mine=S.L.filter(l=>dayOf(l.at)>=wk);
  const cnt=k=>mine.filter(l=>l.to_stage===k).length;
  el.innerHTML=`<div class="acts"><button class="btn sm" id="addNew">+ Yeni influencer</button><span class="note" style="margin:0">Bu hafta: 🔎 ${mine.filter(l=>!l.from_stage).length} yeni · 💬 ${cnt("iletisim")} mesaj · 🤝 ${cnt("anlasildi")} anlaşma · 📦 ${cnt("gonderildi")} gönderim · 📥 ${cnt("video")} video · 📱 ${cnt("yayin")} yayın</span></div>
    ${R.length?RGRP.filter(([g])=>by[g]).map(([g,l])=>`<div class="rg"><h4>${l} <span class="cnt">${by[g].length}</span></h4>
      ${by[g].slice(0,60).map(r=>remRow(r)).join("")}${by[g].length>60?`<div class="note">+ ${by[g].length-60} kişi daha (Liste sekmesinden filtreleyebilirsin)</div>`:""}</div>`).join("")
      :`<div class="empty">Bugün takip edilmesi gereken kimse yok 🎉<br><small>Yeni influencer bulursan “+ Yeni influencer” ile ekle.</small></div>`}
    <div class="note">Hatırlatma süreleri Ayarlar'dan değişir. “2 gün ertele” o kişiyi 2 gün bu listeden gizler.</div>`;
  $("addNew").onclick=()=>openPerson(null);
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openPerson(S.P.find(x=>x.id===b.dataset.open)));
  el.querySelectorAll("[data-snz]").forEach(b=>b.onclick=async ev=>{ ev.stopPropagation(); const p=S.P.find(x=>x.id===b.dataset.snz); try{ await savePerson(p,{snooze_until:addDays(trToday(),2)}); toast("2 gün ertelendi"); render(); }catch(e){ fail(e); } });
  el.querySelectorAll("[data-next]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const p=S.P.find(x=>x.id===b.dataset.next); const i=rank(p.stage); if(i>=0&&i<STAGES.length-1) moveStage(p,STAGES[i+1].k); });
  el.querySelectorAll("[data-tp]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const [id,k]=b.dataset.tp.split("|"); const p=S.P.find(x=>x.id===id); const tp=tpls().find(x=>x.k===k); if(p&&tp) copyText(fillTpl(tp.t,p)); });
}
function remRow(r){
  const p=r.p, i=rank(p.stage), nx=i>=0&&i<STAGES.length-1?STAGES[i+1]:null, wa=waLink(p.phone);
  const tk={cevap:"hatirlat",video:"hatirlat",ig:"yayin",gonder:"adres"}[r.g];
  return `<div class="rm"><div class="tx" data-open="${p.id}">${who(p)}<div class="why">${esc(r.why)}</div><div>${pchip(p)} <span class="tg">${stOf(p.stage).i} ${esc(stOf(p.stage).s||stOf(p.stage).l)}</span>${flags(p)}</div></div>
    <div class="bt">${tk&&tpls().some(x=>x.k===tk)?`<button data-tp="${p.id}|${tk}">📋 Mesajı kopyala</button>`:""}${wa?`<a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}${p.ig_url&&isUrl(p.ig_url)?`<a href="${esc(p.ig_url)}" target="_blank" rel="noopener">Instagram</a>`:""}${nx&&r.g!=="odeme"&&r.g!=="ig"?`<button data-next="${p.id}">→ ${esc(nx.s||nx.l)}</button>`:""}<button data-snz="${p.id}">2 gün ertele</button></div></div>`;
}

/* ---- 📋 Pano ---- */

  const col=s=>{ const L=P.filter(p=>p.stage===s.k).sort((a,b)=>(a.stage_at||"")<(b.stage_at||"")?-1:1);
    return `<div class="bcol" data-col="${s.k}"><div class="bhead" style="background:${SIDE.includes(s)?"var(--gray-s)":"var(--mustard-s)"}">${s.i} ${esc(s.s||s.l)}<span class="cnt">${L.length}</span></div>
      <div class="bbody">${L.slice(0,150).map(p=>`<div class="kc" draggable="true" data-kc="${p.id}">${who(p)}<div>${pchip(p)} <span class="tg">${esc(dealL(p.deal))}${+p.fee?" · "+esc(TL(p.fee)):""}</span>${flags(p)}</div><div class="us" style="margin-top:3px">${age(p)} gündür burada</div></div>`).join("")||`<div class="empty">—</div>`}${L.length>150?`<div class="note">+ ${L.length-150} kişi (Liste'de gör)</div>`:""}</div></div>`; };
  el.innerHTML=`<div class="acts"><button class="btn sm" id="addNew">+ Yeni influencer</button><span class="note" style="margin:0">Kartı sürükleyip başka sütuna bırakabilir ya da açıp aşamayı seçebilirsin.</span></div>
    <div class="board">${ALLST.map(col).join("")}</div>`;
  $("addNew").onclick=()=>openPerson(null);
  el.querySelectorAll("[data-kc]").forEach(c=>{ c.onclick=()=>openPerson(S.P.find(x=>x.id===c.dataset.kc));
    c.ondragstart=e=>{ e.dataTransfer.setData("text/plain",c.dataset.kc); c.classList.add("dragging"); }; c.ondragend=()=>c.classList.remove("dragging"); });
  el.querySelectorAll("[data-col]").forEach(cl=>{ cl.ondragover=e=>{ e.preventDefault(); cl.classList.add("over"); }; cl.ondragleave=()=>cl.classList.remove("over");

/* ---- 📑 Liste ---- */
const FLAGS=[["","Tümü"],["noig","Video var, Instagram'da yok"],["noad","Yayında, reklamda yok"],["unpaid","Ödeme bekleyen"],["paid","Ödenen"],["nophone","Telefonu yok"],["noaddr","Adresi yok (anlaşılan)"]];
function filtered(){
  const q=trNorm(S.q.trim());
  return S.P.filter(inProd).filter(p=>{
    if(S.fSt && p.stage!==S.fSt) return false;
    if(S.fDeal && (p.deal||"")!==(S.fDeal==="none"?"":S.fDeal)) return false;
    if(S.fFlag==="noig" && !(rank(p.stage)>=rank("video") && !p.ig_done)) return false;
    if(S.fFlag==="noad" && !(p.ig_done && !p.ad_done)) return false;
    if(S.fFlag==="unpaid" && !(paidDeal(p) && !p.paid)) return false;
    if(S.fFlag==="paid" && !p.paid) return false;
    if(S.fFlag==="nophone" && p.phone) return false;
    if(S.fFlag==="noaddr" && !(rank(p.stage)>=rank("anlasildi") && !p.address)) return false;
    if(q && !trNorm([p.name,p.username,p.phone,p.address,p.note,p.city].join(" ")).includes(q) && !(digits(q).length>=4 && digits(p.phone).includes(digits(q)))) return false;
    return true; }).sort((a,b)=>(a.updated_at||"")<(b.updated_at||"")?1:-1);
}
function renderListe(){
  const el=$("body"), L=filtered();
  el.innerHTML=`<div class="acts"><button class="btn sm" id="addNew">+ Yeni influencer</button><input type="search" id="lq" placeholder="Ara: isim, @kullanıcı, telefon, şehir…" value="${esc(S.q)}"><button class="btn ghost sm" id="csv">⬇ Excel</button></div>
    <div class="acts"><select id="fSt"><option value="">Tüm aşamalar</option>${ALLST.map(s=>`<option value="${s.k}" ${S.fSt===s.k?"selected":""}>${s.i} ${esc(s.l)}</option>`).join("")}</select>
      <select id="fDeal"><option value="">Tüm anlaşmalar</option>${DEALS.map(([k,l])=>`<option value="${k}" ${S.fDeal===k?"selected":""}>${esc(l)}</option>`).join("")}<option value="none" ${S.fDeal==="none"?"selected":""}>Belirsiz</option></select>
      <select id="fFlag">${FLAGS.map(([k,l])=>`<option value="${k}" ${S.fFlag===k?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
    <div class="note" style="margin:0 0 10px">${L.length} kişi</div>
    ${L.slice(0,300).map(p=>`<div class="ir" data-open="${p.id}"><div>${who(p)}</div>
      <div class="mid"><div class="st">${stOf(p.stage).i} ${esc(stOf(p.stage).l)}</div><div>${pchip(p)} <span class="tg">${esc(dealL(p.deal))}${+p.fee?" · "+esc(TL(p.fee)):""}</span>${flags(p)}</div></div>
      <div class="ag">${age(p)} gün<br>${esc(p.updated_by_name||"")}</div></div>`).join("")||`<div class="empty">Bu filtreye uyan kimse yok.</div>`}
    ${L.length>300?`<div class="note">İlk 300 kişi gösteriliyor; aramayı daralt.</div>`:""}`;
  $("addNew").onclick=()=>openPerson(null);
  const lq=$("lq"); lq.oninput=()=>{ S.q=lq.value; clearTimeout(lq._t); lq._t=setTimeout(()=>{ renderListe(); const n=$("lq"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); };
  $("fSt").onchange=e=>{ S.fSt=e.target.value; renderListe(); };
  $("fDeal").onchange=e=>{ S.fDeal=e.target.value; renderListe(); };
  $("fFlag").onchange=e=>{ S.fFlag=e.target.value; renderListe(); };
  $("csv").onclick=()=>exportCsv(L);
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openPerson(S.P.find(x=>x.id===b.dataset.open)));
}
function exportCsv(L){
  const q=v=>{ const s=String(v??""); return /[";\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const H=["Ad","Kullanıcı adı","Instagram","Telefon","Adres","Şehir","Takipçi","Tür","Ürün","Aşama","Aşamada (gün)","Anlaşma","Ücret","Ücret notu","Kutu","Kargo","Gönderim","Teslim","Video geldi","Video linki","Onay","Instagram'da","IG linki","Reklamda","Reklam notu","Ödendi","Not"];
  const R=L.map(p=>[p.name,p.username,p.ig_url,p.phone,p.address,p.city,p.followers,p.kind,p.product,stOf(p.stage).l,age(p),dealL(p.deal),p.fee,p.fee_note,p.boxes,p.cargo_url,p.sent_at,p.delivered_at,p.video_at,p.video_url,p.approved_at,p.ig_done?(p.ig_at||"evet"):"",p.ig_url_post,p.ad_done?(p.ad_at||"evet"):"",p.ad_note,p.paid?(p.paid_at||"evet"):"",p.note]);
  const csv="\ufeff"+[H,...R].map(r=>r.map(q).join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download=`influencer-${trToday()}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* ---- kart (ekle / düzenle) ---- */
function fillTpl(t,p){
  const pr=products().find(x=>x.k===p.product);
  return String(t).replaceAll("{isim}",(p.name||"").split(" ")[0]||"").replaceAll("{urun}",pr?.l||"ürünümüz").replaceAll("{kargo}",p.cargo_url||"").replaceAll("{tarih}",trShort(addDays(trToday(),7)));
}
function dupOf(u, ph, exceptId){
  const d=digits(ph).slice(-10);
  return S.P.filter(x=>x.id!==exceptId && ((u&&x.username===u) || (d.length===10&&digits(x.phone).slice(-10)===d)));
}

      next_at:$("pNext").value||null, next_note:$("pNextN").value.trim()||null, note:$("pNote").value.trim()||null };
    if(!row.name && !row.username){ toast("Instagram linki ya da ad soyad yaz."); return; }
    // aşama: yayın işaretlendiyse ve daha gerideyse "Yayınlandı"ya geçir; seçilen aşamanın tarihlerini doldur
    let st=stage; if((row.ig_done||row.ad_done) && rank(st)>=0 && rank(st)<rank("yayin")) st="yayin";
    Object.assign(row, Object.fromEntries(Object.entries(stagePatch({...x,...row},st)).filter(([k])=>k==="stage"||!row[k])));
    row.stage=st; if(!p && x.stage!==st) row.stage=st;

    $("pSave").disabled=true;
    try{ await savePerson(p,row); closeModal(); toast("Kaydedildi ✓"); render(); }catch(e){ fail(e); $("pSave").disabled=false; }
  };
  const d=$("pDel"); if(d) d.onclick=async ()=>{ if(!confirm("Bu influencer kaydı silinsin mi? (Geri alınamaz. Olumsuz aşamasına almak genelde daha iyidir.)")) return;

}

  try{ const m = location.pathname.match(/^\/(yonetim|operasyon|kreatif|reklam|erdem|cagdas|muhasebe|yasin|inf)\//); if(m) localStorage.setItem("remaks_last", "/"+m[1]+"/"); }catch(e){}
  const mq = matchMedia("(max-width:959px)"), MAX = 5;
  const EMO = /^\s*((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍\p{Extended_Pictographic})*)\s*/u;
  const obs = new MutationObserver(run);
  const watch = () => obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:["class"]});

  // "📝 Günlük" → <span class="ic">📝</span><span class="lb">Günlük</span>
  function split(b){
    if(b.dataset.mobSplit || b.querySelector(".ic")) return;
    const t = b.textContent, m = t.match(EMO);
    if(!m) return;
    b.dataset.mobSplit = 1;
    const lb = b.dataset.s || t.slice(m[0].length);
    b.innerHTML = `<span class="ic">${m[1]}</span><span class="lb"></span>`;
    b.querySelector(".lb").textContent = lb;
    if(b.dataset.s) b.title = t.slice(m[0].length);
  }
  function label(b){ return (b.querySelector(".lb")?.textContent || b.textContent.replace(EMO,"")).trim(); }
  function icon(b){ return b.querySelector(".ic")?.textContent || (b.textContent.match(EMO)||[])[1] || "•"; }

  function closeSheet(){ document.querySelector(".mob-sheet")?.remove(); }
  function openSheet(nav, items){
    closeSheet();
    const d = document.createElement("div"); d.className = "mob-sheet";
    d.innerHTML = `<div class="in"><div class="hd"><span>Diğer sekmeler</span><button type="button" aria-label="Kapat">✕</button></div><div class="gr"></div></div>`;
    const gr = d.querySelector(".gr");
    let sep = false;
    items.forEach(b=>{
      const ext = !b.dataset.tab && !b.dataset.t && !b.dataset.main;   // başka panele geçiş
      if(ext && !sep){ sep = true; gr.insertAdjacentHTML("beforeend", `<div class="sep">Diğer paneller</div>`); }
      const x = document.createElement("button"); x.type = "button";
      if(b.classList.contains("on") || b.classList.contains("active")) x.className = "on";
      x.innerHTML = `<span class="ic"></span><span></span>`;
      x.firstChild.textContent = icon(b); x.lastChild.textContent = label(b);
      x.onclick = ()=>{ closeSheet(); b.click(); };
      gr.appendChild(x);
    });
    d.onclick = e=>{ if(e.target === d || e.target.closest(".hd button")) closeSheet(); };
    document.body.appendChild(d);
  }

  function fix(nav){
    const btns = [...nav.children].filter(b=>/^(BUTTON|A)$/.test(b.tagName) && !b.dataset.mobMore);
    // değişiklik yoksa dokunma (sayfa başka yerde güncellenince buton yeniden oluşmasın, dokunuş kaçmasın)
    const sig = mq.matches + "|" + btns.length + "|" + btns.map(b=>b.className.replace(/\s*mob-hid/,"")+b.textContent).join(",");
    if(nav.__mobSig === sig && (!mq.matches || btns.length <= MAX || nav.querySelector(":scope > [data-mob-more]"))) return;
    nav.__mobSig = sig;
    nav.querySelectorAll(":scope > [data-mob-more]").forEach(x=>x.remove());
    btns.forEach(b=>{ b.classList.remove("mob-hid"); if(nav.classList.contains("tabs2") || nav.id==="mainTabs") split(b); });
    if(!mq.matches || btns.length <= MAX) return;
    const keep = MAX - 1;
    const onIx = btns.findIndex(b=>b.classList.contains("on") || b.classList.contains("active"));
    btns.forEach((b,i)=>{ if(i >= keep) b.classList.add("mob-hid"); });
    const more = document.createElement("button");
    more.type = "button"; more.dataset.mobMore = 1;
    const act = onIx >= keep ? btns[onIx] : null;
    more.innerHTML = `<span class="ic"></span><span class="lb"></span>`;
    more.firstChild.textContent = act ? icon(act) : "☰";
    more.lastChild.textContent = act ? label(act) : "Daha";
    if(act) more.classList.add(nav.id==="mainTabs" ? "active" : "on");
    more.onclick = e=>{ e.stopPropagation(); openSheet(nav, btns.slice(keep)); };
    nav.appendChild(more);
  }
  function run(){
    obs.disconnect();
    try{ document.querySelectorAll("nav.bottom, .tabs2, #mainTabs").forEach(fix); }
    finally{ watch(); }
  }
  mq.addEventListener ? mq.addEventListener("change", run) : mq.addListener(run);
  addEventListener("keydown", e=>{ if(e.key === "Escape") closeSheet(); });
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
})();
</script>
<!--/MOBJS-->
</body>
</html>
