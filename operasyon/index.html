<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EC">
<title>uzbionik · Operasyon Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F2EC; --cream2:#EAE7E1; --card:#FFFDF9;
    --ink:#121212; --ink-soft:#4A4A46; --mut:#8A867E;
    --cobalt:#2F5DFF; --cobalt-s:#E4EBFF;
    --green:#22C55E;  --green-s:#DFF6E7;
    --mustard:#FFC53D;--mustard-s:#FFF3D6;
    --red:#E8402A;    --red-s:#FDE4DF;
    --purple:#A855F7; --purple-s:#F1E4FE;
    --orange:#FF8A00; --orange-s:#FFE9D1;
    --gray-s:#ECEAE4;
    --fh:'Space Grotesk','Plus Jakarta Sans',sans-serif;
    --fb:'Plus Jakarta Sans',sans-serif;
    --fm:'JetBrains Mono',monospace;
    --b:3px solid var(--ink); --b2:2px solid var(--ink);
    --sh:6px 6px 0 var(--ink); --sh-sm:4px 4px 0 var(--ink);
    --r:16px; --r-lg:24px;
    --sidew:236px; --sidew-c:74px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    background:var(--cream); color:var(--ink); min-height:100dvh; font-family:var(--fb);
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
  }
  h1,h2,h3{font-family:var(--fh); letter-spacing:-.02em}
  .hidden{display:none!important}
  .mono{font-family:var(--fm)}

  /* ================= SIDEBAR (masaüstü) ================= */
  aside{
    display:none; position:fixed; z-index:50; inset:0 auto 0 0; width:var(--sidew);
    background:var(--card); border-right:var(--b); padding:20px 14px;
    flex-direction:column; gap:6px; transition:width .18s ease;
  }
  aside .brand{
    font-family:var(--fh); font-weight:700; font-size:1.15rem; padding:6px 10px 18px;
    white-space:nowrap; overflow:hidden;
  }
  aside .brand b{color:var(--cobalt)}
  aside .navbtn{
    display:flex; align-items:center; gap:12px; width:100%;
    background:none; border:var(--b2); border-color:transparent; border-radius:12px;
    padding:11px 12px; font-family:var(--fb); font-weight:700; font-size:.9rem;
    color:var(--ink-soft); cursor:pointer; white-space:nowrap; overflow:hidden;
  }
  aside .navbtn .ic{font-size:1.15rem; line-height:1; width:24px; text-align:center; flex-shrink:0}
  aside .navbtn:hover{background:var(--cream2)}
  aside .navbtn.on{
    background:var(--mustard); border:var(--b2); color:var(--ink); box-shadow:var(--sh-sm);
  }
  aside .sp{flex:1}
  aside .user{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-top:var(--b2);
    white-space:nowrap; overflow:hidden;
  }
  aside .user .nm{font-weight:800; font-size:.82rem}
  aside .user .rl{font-size:.68rem; color:var(--mut); font-weight:600}
  aside .collapse{
    position:absolute; top:18px; right:-16px; width:32px; height:32px;
    background:var(--card); border:var(--b2); border-radius:50%; cursor:pointer;
    font-weight:800; font-family:var(--fm); box-shadow:var(--sh-sm); z-index:51;
  }
  @media(min-width:960px){
    aside{display:flex}
    body{padding-left:var(--sidew); padding-bottom:24px}
    nav.bottom{display:none}
    header .mlogo{display:none}
    html.collapsed aside{width:var(--sidew-c)}
    html.collapsed body{padding-left:var(--sidew-c)}
    html.collapsed aside .brand{font-size:0}
    html.collapsed aside .brand::first-letter{font-size:1.15rem}
    html.collapsed aside .navbtn span.lbl, html.collapsed aside .user div{display:none}
  }

  /* ================= TOP BAR ================= */
  header{
    position:sticky; top:0; z-index:40; background:var(--cream);
    border-bottom:var(--b); padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; gap:12px;
  }
  header .mlogo{font-family:var(--fh); font-weight:700; font-size:1.05rem}
  header .mlogo b{color:var(--cobalt)}
  header .sp{flex:1}
  .weekpick{
    background:var(--card); border:var(--b2); color:var(--ink); border-radius:12px;
    padding:9px 12px; font-size:.82rem; font-weight:700; font-family:var(--fb);
    max-width:170px; box-shadow:var(--sh-sm); cursor:pointer;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--mustard);
    border:var(--b2); display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:.85rem; cursor:pointer; box-shadow:var(--sh-sm); flex-shrink:0;
  }

  /* ================= BOTTOM NAV (mobil) ================= */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--card); border-top:var(--b);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--mut); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:.62rem; font-weight:800; padding:6px 2px; border-radius:12px; font-family:var(--fb);
  }
  nav.bottom button .ic{font-size:1.2rem; line-height:1}
  nav.bottom button.on{color:var(--ink); background:var(--mustard); border:var(--b2); box-shadow:var(--sh-sm)}
  @media(min-width:960px){ nav.bottom{display:none} }

  /* ================= GENEL ================= */
  main{padding:20px 16px; max-width:1060px; margin:0 auto}
  @media(min-width:960px){main{padding:28px 32px}}
  h2{font-size:1.35rem; margin-bottom:4px}
  .sub{color:var(--mut); font-size:.82rem; font-weight:600; margin-bottom:18px}
  .sect{margin-bottom:26px}
  .sect h3{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.09em;
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .sect h3 .cnt{
    background:var(--ink); color:var(--card); border-radius:99px; padding:1px 9px;
    font-size:.68rem; font-family:var(--fm);
  }
  .cards{display:grid; gap:14px}
  @media(min-width:1100px){.cards{grid-template-columns:1fr 1fr}}
  .card{
    background:var(--card); border:var(--b); border-radius:var(--r);
    padding:16px; box-shadow:var(--sh);
  }
  .chip{
    display:inline-flex; align-items:center; border-radius:99px;
    padding:4px 11px; font-size:.68rem; font-weight:800; border:var(--b2); color:var(--ink);
    white-space:nowrap;
  }
  .own{
    width:28px;height:28px;border-radius:9px; display:inline-flex; border:var(--b2);
    align-items:center;justify-content:center; font-weight:800; font-size:.8rem; flex-shrink:0;
  }
  .mrow{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px}
  .m{font-size:.78rem; color:var(--ink-soft); font-weight:600}
  .m b{font-family:var(--fm); font-weight:700}
  .empty{
    text-align:center; color:var(--mut); font-size:.85rem; font-weight:600; padding:30px 12px;
    border:2px dashed var(--mut); border-radius:var(--r); background:var(--cream2);
  }
  .cards .empty{grid-column:1/-1}

  /* kreatif kartı */
  .ccard .top{display:flex; gap:12px; align-items:flex-start}
  .ccard .code{font-family:var(--fm); font-size:.72rem; font-weight:700; word-break:break-all; line-height:1.4}
  .ccard .meta{font-size:.72rem; color:var(--mut); font-weight:600; margin-top:4px; display:flex; align-items:center; gap:6px}
  .ccard .thumb{
    width:54px;height:54px;border-radius:12px; background:var(--cream2); border:var(--b2);
    flex-shrink:0; object-fit:cover; display:flex;align-items:center;justify-content:center; font-size:1.35rem;
  }
  .ccard .hook{
    margin-top:12px; font-size:.85rem; font-weight:600; background:var(--card);
    border:var(--b2); border-left-width:6px; padding:9px 11px; border-radius:10px;
  }
  .ccard .reason{margin-top:9px; font-size:.74rem; color:var(--mut); font-weight:600; font-style:italic}

  /* filtre çipleri */
  .filters{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; margin-bottom:10px; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{
    flex-shrink:0; background:var(--card); border:var(--b2); color:var(--ink-soft);
    border-radius:99px; padding:7px 14px; font-size:.75rem; font-weight:800; cursor:pointer; font-family:var(--fb);
  }
  .fchip.on{background:var(--ink); border-color:var(--ink); color:var(--card); box-shadow:var(--sh-sm)}

  /* ekip */
  .trow{display:flex; align-items:center; gap:12px}
  .trow .nm{font-family:var(--fh); font-size:1rem; font-weight:700}
  .trow .bar{flex:1; height:12px; background:var(--cream2); border:var(--b2); border-radius:99px; overflow:hidden}
  .trow .bar i{display:block; height:100%}
  .trow .wn{font-family:var(--fm); font-weight:700; font-size:1.05rem}
  .tstats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
  .tstat{background:var(--cream2); border:var(--b2); border-radius:12px; padding:10px 6px; text-align:center}
  .tstat b{display:block; font-size:1.15rem; font-family:var(--fm)}
  .tstat span{font-size:.62rem; color:var(--ink-soft); font-weight:700}

  /* finans */
  .tblwrap{overflow-x:auto; border:var(--b); border-radius:var(--r); background:var(--card); box-shadow:var(--sh)}
  table{border-collapse:collapse; width:100%; font-size:.78rem; min-width:600px}
  th,td{padding:10px 12px; text-align:right; border-bottom:var(--b2); white-space:nowrap}
  th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--card)}
  th{font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; background:var(--mustard-s)}
  td{font-family:var(--fm); font-weight:500}
  td:first-child{font-family:var(--fb); font-weight:700}
  tr:last-child td{border-bottom:none}
  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px}
  @media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--card); border:var(--b); border-radius:var(--r); padding:14px; box-shadow:var(--sh-sm)}
  .kpi b{display:block; font-size:1.35rem; font-family:var(--fm)}
  .kpi span{font-size:.68rem; color:var(--mut); font-weight:800; text-transform:uppercase; letter-spacing:.05em}

  /* board kanban */
  .board{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 16px; scroll-snap-type:x mandatory; align-items:flex-start; scrollbar-width:thin}
  .bcol{
    flex:0 0 min(86vw, 330px); width:min(86vw, 330px); min-width:0; max-width:min(86vw, 330px);
    scroll-snap-align:start; border:var(--b); border-radius:var(--r);
    background:var(--card); box-shadow:var(--sh); display:flex; flex-direction:column;
  }
  @media(min-width:960px){ .board{scroll-snap-type:none} .bcol{flex-basis:318px; width:318px; max-width:318px} }
  .bcol .bbody{min-width:0}
  .bcol .card{min-width:0; max-width:100%}
  .bcol .bhead{
    display:flex; align-items:center; gap:7px; padding:11px 13px; border-bottom:var(--b);
    border-radius:13px 13px 0 0; font-family:var(--fh); font-weight:700; font-size:.82rem; white-space:nowrap;
  }
  .bcol .bhead .cnt{margin-left:auto; background:var(--ink); color:var(--card); border-radius:99px; padding:1px 9px; font-size:.66rem; font-family:var(--fm)}
  .bcol .bbody{padding:8px; display:flex; flex-direction:column; gap:8px; min-height:100px; flex:1; max-height:66dvh; overflow-y:auto; overscroll-behavior:contain}
  .bcol.dragover{outline:3px dashed var(--ink); outline-offset:-6px}
  .bcol .card{box-shadow:var(--sh-sm)}
  .bcol .empty{padding:14px 8px; font-size:.7rem}

  /* kompakt board kartı */
  .ccard.mini{padding:10px 11px}
  .ccard.mini .top{gap:9px}
  .ccard.mini .thumb{width:36px;height:36px;border-radius:9px;font-size:1rem;border-width:2px}
  .ccard.mini .code{font-size:.64rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; word-break:normal}
  .ccard.mini .meta{font-size:.62rem; margin-top:3px; gap:5px}
  .ccard.mini .own{width:20px;height:20px;font-size:.6rem;border-radius:6px;border-width:2px}
  .ccard.mini .chip{padding:2px 8px; font-size:.56rem; border-width:2px}
  .ccard.mini .editbtn{min-width:24px;height:24px;font-size:.6rem;border-radius:6px}
  .ccard.mini .hook{
    font-size:.7rem; padding:6px 8px; margin-top:8px; border-width:2px; border-left-width:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .ccard.mini .mrow{gap:3px 10px; margin-top:8px}
  .ccard.mini .m{font-size:.64rem}
  .ccard.mini .reason{
    font-size:.62rem; margin-top:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .addbtn{
    background:none; border:2px dashed var(--mut); color:var(--ink-soft); border-radius:10px;
    padding:9px; font-weight:800; cursor:pointer; font-family:var(--fb); font-size:.75rem;
  }
  .editbtn{
    background:var(--cream2); border:var(--b2); border-radius:8px; min-width:28px; height:28px;
    cursor:pointer; font-size:.75rem; flex-shrink:0; font-family:inherit;
  }
  [draggable="true"]{cursor:grab}

  /* üretim panosu — tam genişlik, ince kolonlar */
  main.wide{max-width:none}
  @media(min-width:960px){
    .pboard{gap:10px}
    .pboard .bcol{flex:1 1 0; width:auto; min-width:150px; max-width:none}
    .pboard .bhead{font-size:.6rem; padding:9px 8px; gap:5px; letter-spacing:0}
    .pboard .bhead .cnt{font-size:.58rem; padding:1px 7px}
    .pboard .bbody{padding:6px; gap:6px; max-height:70dvh}
    .pboard .addbtn{font-size:.62rem; padding:6px}
    .pboard .pcard{padding:8px 9px}
  }

  /* modal */
  .modal{position:fixed; inset:0; z-index:80; background:rgba(18,18,18,.55); display:flex; align-items:flex-end; justify-content:center}
  @media(min-width:640px){.modal{align-items:center; padding:20px}}
  .modal .box{
    background:var(--card); border:var(--b); width:100%; max-width:540px; box-shadow:var(--sh);
    border-radius:20px 20px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:88dvh; overflow:auto;
  }
  @media(min-width:640px){.modal .box{border-radius:20px}}
  .modal h3{font-size:1.05rem; margin-bottom:14px}
  .frow{display:grid; grid-template-columns:1fr 1fr; gap:0 10px}
  .flabel{font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:2px 0 4px}
  .btn.danger{background:var(--red)}
  .btn.ghost{background:var(--card); color:var(--ink)}
  .btnrow{display:flex; gap:10px; margin-top:8px}

  /* form / giriş */
  .auth{max-width:400px; margin:8vh auto 0; padding:0 20px}
  .authcard{background:var(--card); border:var(--b); border-radius:var(--r-lg); padding:26px 22px; box-shadow:var(--sh)}
  .auth .logo{font-family:var(--fh); font-size:1.45rem; font-weight:700; text-align:center; margin-bottom:4px}
  .auth .logo b{color:var(--cobalt)}
  .auth p{color:var(--mut); text-align:center; font-size:.85rem; font-weight:600; margin-bottom:22px}
  input,textarea,select{
    width:100%; background:var(--card); border:var(--b2); color:var(--ink);
    border-radius:12px; padding:13px 14px; font-size:.95rem; margin-bottom:12px; font-family:var(--fb); font-weight:600;
  }
  input:focus,textarea:focus{outline:none; border-color:var(--cobalt); box-shadow:var(--sh-sm)}
  .btn{
    width:100%; background:var(--cobalt); color:#fff; border:var(--b2); border-radius:12px;
    padding:14px; font-size:.95rem; font-weight:800; cursor:pointer; font-family:var(--fb); box-shadow:var(--sh-sm);
  }
  .btn:active{transform:translate(2px,2px); box-shadow:none}
  .btn:disabled{opacity:.5}
  .authmsg{font-size:.8rem; font-weight:700; text-align:center; margin-top:12px; color:var(--mut)}
  .authmsg.err{color:var(--red)}
  .switch{text-align:center; margin-top:16px; font-size:.82rem; font-weight:600; color:var(--mut)}
  .switch a{color:var(--cobalt); font-weight:800; cursor:pointer; text-decoration:none}

  /* import */
  textarea.json{min-height:230px; font-family:var(--fm); font-size:.74rem; font-weight:500}
  .implog{
    font-family:var(--fm); font-size:.72rem; background:var(--ink); color:#DFF6E7;
    border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; max-height:240px; overflow:auto;
  }

  /* demo bar */
  .demo{
    background:var(--mustard-s); border:var(--b2); font-size:.74rem; font-weight:700;
    padding:9px 13px; border-radius:12px; margin-bottom:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .demo select{width:auto; margin:0; padding:5px 9px; font-size:.74rem; border-radius:9px}
  /* ================= OPERASYON EKLERİ ================= */
  nav.bottom{overflow-x:auto; scrollbar-width:none} nav.bottom::-webkit-scrollbar{display:none}
  nav.bottom button{min-width:50px}
  .fgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 10px}
  @media(min-width:700px){.fgrid{grid-template-columns:repeat(4,1fr)} .fgrid.c3{grid-template-columns:repeat(3,1fr)} .fgrid.c2{grid-template-columns:repeat(2,1fr)}}
  .fgrid input,.fgrid select{margin-bottom:10px}
  .dayrow{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
  .dayrow input[type=date],.dayrow select{width:auto; margin:0; padding:9px 12px; font-size:.85rem}
  .dayrow .nb{background:var(--card); border:var(--b2); border-radius:10px; width:38px; height:38px; cursor:pointer; font-weight:800; font-family:var(--fm); box-shadow:var(--sh-sm)}
  .dayrow .dl{font-family:var(--fh); font-weight:700; font-size:1rem}
  .who{display:flex; flex-wrap:wrap; gap:8px}
  .who .w{display:inline-flex; align-items:center; gap:6px; border:var(--b2); border-radius:99px; padding:6px 12px; font-size:.74rem; font-weight:800; background:var(--card)}
  .who .w.ok{background:var(--green-s)} .who .w.no{background:var(--red-s)}
  .scrow{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
  .scbtn{width:32px; height:32px; border:var(--b2); border-radius:9px; background:var(--card); font-family:var(--fm); font-weight:700; cursor:pointer; font-size:.8rem; padding:0}
  .scbtn.on{background:var(--ink); color:var(--card); box-shadow:var(--sh-sm)}
  .chk{display:flex; align-items:center; gap:12px; padding:10px 12px; border:var(--b2); border-radius:12px; background:var(--card); margin-bottom:8px; cursor:pointer; user-select:none}
  .chk .bx{width:26px;height:26px;border:var(--b2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;background:var(--cream2);color:#fff}
  .chk.on{background:var(--green-s)} .chk.on .bx{background:var(--green)}
  .chk .lbl{font-weight:700; font-size:.88rem; flex:1}
  .chk .by{font-size:.64rem; color:var(--mut); font-weight:700; font-family:var(--fm); white-space:nowrap}
  .pill{display:inline-block; border:var(--b2); border-radius:8px; padding:2px 8px; font-size:.66rem; font-weight:800; background:var(--card)}
  .disc{display:grid; gap:4px; overflow-x:auto}
  .disc .r{display:grid; grid-template-columns:110px repeat(var(--n),minmax(18px,1fr)); gap:3px; align-items:center; font-size:.7rem; font-weight:700}
  .disc .c{height:22px; border:2px solid var(--ink); border-radius:6px; background:var(--red-s)} .disc .c.ok{background:var(--green)} .disc .c.na{background:var(--gray-s); border-style:dashed; border-color:var(--mut)}
  .disc .h{font-size:.58rem; text-align:center; color:var(--mut); font-family:var(--fm)}
  .bar{height:10px; background:var(--cream2); border:var(--b2); border-radius:99px; overflow:hidden; min-width:60px} .bar i{display:block;height:100%;background:var(--cobalt)}
  .vtext{font-size:.9rem; font-weight:600; margin:8px 0; white-space:pre-wrap}
  .tagc{display:inline-flex; gap:6px; flex-wrap:wrap}
  .tagc .fchip{padding:5px 11px; font-size:.68rem}
  .note{font-size:.74rem; color:var(--mut); font-weight:600; margin-top:8px}
  .stk .row{display:grid; grid-template-columns:1fr 90px 110px; gap:8px; align-items:center; padding:6px 0; border-bottom:2px solid var(--cream2)}
  .stk .row:last-child{border-bottom:none}

async function fetchAll(table, build){
  let out=[], from=0;
  while(true){
    let q = sb.from(table).select("*");
    if(build) q = build(q);
    const {data,error} = await q.range(from, from+999);
    if(error) throw error;
    out.push(...(data||[]));
    if(!data || data.length<1000) break;
    from+=1000;
  }
  return out;
}
async function upsert(table, rows, onConflict, ignoreDup=false){
  if(!rows.length) return;
  if(DEMO) return;
  for(let i=0;i<rows.length;i+=400){
    const {error} = await sb.from(table).upsert(rows.slice(i,i+400), {onConflict, ignoreDuplicates:ignoreDup});
    if(error) throw error;
  }
}

/* ================= MESAİ (iki panelde aynı kod) =================
   Mesai günü 09:00–18:00 (pzt–cmt). 09:00'dan önce gelmek mesai sayılmaz.
   Günlük mesai = 18:00 sonrası kalınan − geç gelme − erken çıkma − saate yansımayan izin.
   İzin geç gelme/erken çıkmayı anlatıyorsa bir kez düşülür. Pazar: çalışılan tüm süre, ×1,5.
   Ay içindeki günler birbirini götürür. Ücret = saatlik × (normal + pazar × 1,5). */
const WORK_START=9*60, WORK_END=18*60, SUNDAY_X=1.5;
function otCalc(r){
  const i=mins(r?.in_time), o=mins(r?.out_time), lv=Math.max(0,+(r?.leave_min)||0);
  const z={late:0,early:0,extra:0,leave:0};
  if(i==null||o==null) return {kind:"eksik",min:0,...z};
  if(o-i<60) return {kind:"hata",min:0,...z};   // çıkış girişten önce ya da 1 saatten kısa gün: büyük ihtimalle yanlış girilmiş
  if(dow(r.day)===0) return {kind:"pazar",min:o-i,...z,extra:o-i};
  const late=Math.max(0,i-WORK_START), early=Math.max(0,WORK_END-o);
  const extra=Math.max(0,o-Math.max(WORK_END,i));
  const leave=Math.max(0,lv-(late+early));
  return {kind:"normal",min:extra-late-early-leave,late,early,extra,leave};
}
const otTxt=m=>{ m=Math.round(m||0); if(!m) return "0"; const s=m<0?"−":"+"; m=Math.abs(m); const h=Math.floor(m/60), k=m%60; return s+[h?h+" sa":"", k?k+" dk":""].filter(Boolean).join(" "); };
const otHrs=m=>{ m=Math.round(m||0); const s=m<0?"−":""; m=Math.abs(m); const h=Math.floor(m/60), k=m%60; return s+(h?h+" sa":"")+(h&&k?" ":"")+(k||!h?k+" dk":""); };
const otCls=m=>m>0?"otp":m<0?"otn":"";
const otTl=v=>v==null?"—":(v<0?"−":"")+nf.format(Math.abs(Math.round(v)))+" ₺";
// eksi ayda ek ödeme 0; eksik tutar bilgi olarak altında (kesinti kararı yönetimin)
const payCell=x=>x==null?"<b>—</b>":x>=0?`<b class="${otCls(x)}">${otTl(x)}</b>`:`<b>0 ₺</b><small class="otn" style="display:block">eksik ${otTl(-x)}</small>`;
const otDayLbl=s=>new Date(s+"T00:00:00").toLocaleDateString("tr-TR",{day:"2-digit",month:"short",weekday:"short"});
function otSum(rows){
  const o={normal:0,pazar:0,days:0,pzDays:0,bad:[],miss:[]};
  rows.forEach(r=>{ const c=otCalc(r);
    if(c.kind==="normal"){ o.normal+=c.min; o.days++; }
    else if(c.kind==="pazar"){ o.pazar+=c.min; o.pzDays++; }
    else if(c.kind==="hata") o.bad.push(r); else o.miss.push(r); });
  o.weighted=o.normal+o.pazar*SUNDAY_X; return o;
}
function rateFor(key, monthFirst){
  const xs=(S.rates||[]).filter(r=>r.person===key && r.month<=monthFirst).sort((a,b)=>a.month<b.month?1:-1);
  return xs.length? +xs[0].hourly : null;
}
function otWhy(c){
  if(c.kind==="pazar") return "Pazar — tümü mesai (×1,5)";
  if(c.kind==="hata") return "⚠ Saatler hatalı görünüyor (çıkış girişten önce ya da 1 saatten kısa) — düzeltilmeli";
  if(c.kind==="eksik") return "Giriş/çıkış saati girilmemiş — hesaba katılmadı";
  const p=[]; if(c.late) p.push(`geç geldi ${otHrs(c.late)}`); if(c.early) p.push(`erken çıktı ${otHrs(c.early)}`);
  if(c.leave) p.push(`izin ${otHrs(c.leave)}`); if(c.extra) p.push(`18:00 sonrası ${otHrs(c.extra)}`);
  return p.join(" · ") || "tam saat";
}
function otDays(rows, canJump){
  const xs=[...rows].sort((a,b)=>a.day<b.day?-1:1);
  if(!xs.length) return `<div class="empty">Bu ay kayıt yok.</div>`;
  return `<div class="tblwrap"><table class="compact ottbl"><tr><th>Gün</th><th>Giriş</th><th>Çıkış</th><th>İzin</th><th>Hesap</th><th>Mesai</th></tr>
    ${xs.map(r=>{ const c=otCalc(r); const warn=c.kind==="hata"||c.kind==="eksik";
      return `<tr class="${c.kind==="pazar"?"otsun":""}${warn?" otwarn":""}"><td>${canJump?`<a href="#" data-otjump="${r.day}">${otDayLbl(r.day)}</a>`:otDayLbl(r.day)}</td><td>${esc(r.in_time||"—")}</td><td>${esc(r.out_time||"—")}</td><td>${r.leave_min?r.leave_min+" dk":"—"}</td><td class="otwhy">${esc(otWhy(c))}</td><td class="${otCls(c.min)}"><b>${warn?"—":otTxt(c.min)}</b></td></tr>`; }).join("")}
  </table></div>`;
}
function otRule(){
  return `<details class="otrule"><summary>Mesai nasıl hesaplanıyor?</summary><ul>
    <li>Mesai günü <b>09:00–18:00</b> (pazartesi–cumartesi). 09:00'dan önce gelmek mesai sayılmaz.</li>
    <li>Günlük mesai = <b>18:00 sonrası kalınan süre − geç gelme − erken çıkma − izin</b>. 09:30'da gelip 18:30'da çıkan için sonuç 0.</li>
    <li>İzin zaten geç gelmeyi ya da erken çıkmayı anlatıyorsa bir kez düşülür (11:00'de gelip 120 dk izin yazan için −2 sa).</li>
    <li><b>Pazar</b> çalışılan tüm süre mesaidir ve ücrette <b>×1,5</b> sayılır.</li>
    <li>Ay içindeki günler birbirini götürür; ay sonundaki toplam esas alınır.</li></ul></details>`;
}

  if(!S.otPerson || !list.find(p=>p.key===S.otPerson)) S.otPerson=list[0]?.key||null;

  el.innerHTML=head+noTable+`

        <td class="${otCls(p.s.weighted)}"><b>${otTxt(p.s.weighted)}</b></td>
        <td><input type="number" inputmode="decimal" min="0" step="0.01" class="otrate" data-rate="${esc(p.key)}" value="${p.rate??""}" placeholder="—"></td>
        <td data-pay="${esc(p.key)}">${payCell(pay(p))}</td></tr>`).join("")}
      <tr class="ottot"><td colspan="6">Toplam ek ödeme</td><td id="otTotal"><b>${otTl(tot)}</b></td></tr>
    </table></div>
    <div class="note">Ücrete esas = normal + pazar × 1,5. Girdiğin saatlik ücret <b>${trMonth(mF)}</b> ayından itibaren geçerli olur; sonraki aylar yeni ücret girilene kadar bunu kullanır. Ekip ücretleri görmez, sadece kendi saatlerini görür.</div>
    <button class="btn" id="otSave">💾 Ücretleri kaydet</button>
    ${sel?`<div class="sect" style="margin-top:18px"><h3>📅 ${esc(sel.name)} · ${trMonth(mF)}</h3>${warnHtml(sel.s)}${otDays(sel.rows,true)}<div class="note">Güne tıklayınca o günün kaydı açılır; saati oradan düzeltebilirsin.</div></div>`:""}`;

  el.querySelectorAll("[data-otp]").forEach(a=>a.onclick=e=>{ e.preventDefault(); S.otPerson=a.dataset.otp; renderMesaiView(el,cfg); });
  const recalc=()=>{ let t=0; list.forEach(p=>{ const v=el.querySelector(`[data-rate="${CSS.escape(p.key)}"]`).value; const r=v===""?null:+v; const x=r==null?null:r/60*p.s.weighted; t+=Math.max(0,x||0);

  };

/* ================= TUVALET TEMİZLİĞİ SIRASI (operasyon + kreatif ortak) =================
   Her cumartesi tek kişi; sıra shared_settings.wc_rotation = {start:"YYYY-MM-DD" (cumartesi), names:[...]}.
   İsim, kişinin tam adındaki bir kelimeyle eşleşir ("Kemal" → Mustafa Kemal, "İbrahim" → Halil İbrahim). */
const WC = (()=>{
  const DEF = {start:"2026-09-26", names:["Rabia","İmkan","Mustafa Kemal","Besra","İbrahim","Sait","Anıl","Sinan","Elif"]};
  let cfg=null, err=null;
  const low = s=>String(s||"").toLocaleLowerCase("tr").replace(/[.,;:]+$/,"").trim();
  const p2 = n=>String(n).padStart(2,"0");
  const isoD = d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  const addD = (s,n)=>{ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return isoD(d); };
  const dayTr = s=>new Date(s+"T00:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"});
  async function load(){
    if(DEMO){ cfg=cfg||{...DEF}; return; }
    const {data,error}=await sb.from("shared_settings").select("value").eq("key","wc_rotation").maybeSingle();
    if(error){ err=error.message; cfg=null; return; }
    err=null; cfg=data?.value||null;
  }
  const ok = ()=>cfg && Array.isArray(cfg.names) && cfg.names.length && cfg.start;
  function who(sat){                                      // o cumartesinin sorumlusu
    if(!ok()) return null;
    const w=Math.round((new Date(sat+"T00:00:00")-new Date(cfg.start+"T00:00:00"))/(7*864e5));
    if(w<0) return null;
    return cfg.names[w % cfg.names.length];
  }
  const nextSat = from=>{ const d=new Date(from+"T00:00:00"); const k=(6-d.getDay()+7)%7; return addD(from,k); };   // bugün cumartesiyse bugün
  function matches(entry, names){
    const e=low(entry); if(!e) return false;
    return names.filter(Boolean).some(n=>{ const f=low(n); return f===e || f.split(/\s+/).includes(e); });
  }
  function myNext(names, from){
    if(!ok()) return null;
    let s=nextSat(from);
    for(let i=0;i<cfg.names.length+1;i++){ if(s>=cfg.start && matches(who(s),names)) return s; s=addD(s,7); }
    return null;
  }
  // Günüm kartı: names = kişinin olası adları (üye adı, profil adı), day = ekranda seçili gün
  function card(names, day, canEdit){
    if(!ok()) return canEdit ? `<div class="card wc"><div class="wc-h">🚽 Tuvalet temizliği sırası</div><div class="mini">${err?"Sıra tablosu okunamadı — Supabase'de tuvalet sırası SQL'ini çalıştır.":"Henüz sıra girilmemiş."}</div><button class="btn ghost sm" data-wcedit>✏️ Sırayı düzenle</button></div>` : "";
    const sat = new Date(day+"T00:00:00").getDay()===6;
    const mine = sat && matches(who(day),names);
    const nx = myNext(names, mine?addD(day,1):day);
    const list=[]; let s=nextSat(day<cfg.start?cfg.start:day);
    for(let i=0;i<cfg.names.length;i++){ list.push(s); s=addD(s,7); }
    return `<div class="card wc ${mine?"on":""}">
      <div class="wc-h">🚽 Tuvalet temizliği${mine?` · <b>bugün sende</b>`:""}</div>
      ${mine?`<div class="wc-big">Bugün (${esc(dayTr(day))}) tuvalet temizliği senin görevin — tek başına yapılacak.</div>`:""}
      <div class="mini">${nx?`Sıradaki günün: <b>${esc(dayTr(nx))}</b>`:"Sırada adın yok."}${sat&&!mine&&who(day)?` · Bugün: <b>${esc(who(day))}</b>`:""}</div>
      <details class="wc-list"><summary>Sıra listesi (her cumartesi tek kişi)</summary>
        <table class="compact"><tr><th>Cumartesi</th><th>Sorumlu</th></tr>
        ${list.map(x=>`<tr class="${matches(who(x),names)?"wc-me":""}"><td>${esc(dayTr(x))}</td><td>${esc(who(x)||"—")}</td></tr>`).join("")}</table>
        ${canEdit?`<button class="btn ghost sm" data-wcedit style="margin-top:8px">✏️ Sırayı düzenle</button>`:""}
      </details>
    </div>`;
  }
  function bind(root, rerender){
    root.querySelectorAll("[data-wcedit]").forEach(b=>b.onclick=()=>{
      const c=ok()?cfg:DEF;
      modal(`<h3>🚽 Tuvalet temizliği sırası</h3><div class="sub">Her cumartesi bir kişi, yukarıdan aşağı sırayla. Liste bitince başa döner. İki ekipte de aynı sıra görünür.</div>
        <div class="flabel">İlk cumartesi (listenin ilk kişisi bu gün)</div><input type="date" id="wc_start" value="${esc(c.start)}">
        <div class="flabel">İsimler (her satıra bir kişi, sırayla)</div><textarea id="wc_names" rows="10">${esc(c.names.join("\n"))}</textarea>
        <button class="btn" id="wc_save">Kaydet</button>`);
      $("wc_save").onclick=async ()=>{
        if(typeof VIEW==="function" && VIEW()){ toast("👁 Görüntüleme modu: kaydetme kapalı"); return; }
        const start=$("wc_start").value, names=$("wc_names").value.split(/\n/).map(x=>x.replace(/[.,;:]+$/,"").trim()).filter(Boolean);
        if(!start || new Date(start+"T00:00:00").getDay()!==6){ toast("İlk gün bir cumartesi olmalı."); return; }
        if(names.length<1){ toast("En az bir isim yaz."); return; }
        const value={start, names};
        try{
          if(!DEMO){ const {error}=await sb.from("shared_settings").upsert({key:"wc_rotation", value, updated_at:new Date().toISOString()},{onConflict:"key"}); if(error) throw error; }
          cfg=value; err=null; closeModal(); toast("Tuvalet sırası kaydedildi ✓"); rerender();
        }catch(e){ toast("Kaydedilemedi: "+(e?.message||e)); }
      };
    });
  }
  return {load, card, bind, who, matches, myNext};
})();

const DUTY_BASE = "2026-01-05"; // pazartesi
// temizlik nöbetine girmeyenler (ör. Furkan): ops_settings.duty_exempt = [üye id]
const dutyExempt = m=>(S.dutyExempt||[]).includes(m?.id);
const dutyPool = ()=>actives().filter(m=>!dutyExempt(m));
function dutyPairs(){
  const a=dutyPool(); const out=[];
  for(let i=0;i<a.length;i++) for(let j=i+1;j<a.length;j++) out.push([a[i],a[j]]);
  // her turda farklı kişiler denk gelsin diye sırayı karıştır (deterministik)
  return out.sort((p,q)=>((p[0].sort+p[1].sort*3)%7)-((q[0].sort+q[1].sort*3)%7));
}
function autoDuty(day){
  if(dow(day)===0) return null;
  const pairs=dutyPairs(); if(!pairs.length) return null;
  const idx=Math.round((new Date(day+"T00:00:00")-new Date(DUTY_BASE+"T00:00:00"))/86400000);
  const work = idx - Math.floor((idx+1)/7);
  return pairs[((work%pairs.length)+pairs.length)%pairs.length];
}
function dutyFor(day){
  const o=S.duty.find(d=>d.day===day);
  if(o) return [memById(o.a_id), memById(o.b_id)].filter(Boolean);
  return autoDuty(day)||[];
}

  // hazır tablo: "17.09.2026 | Perşembe | Besra | Anıl" satırlarını gün gün aynen kaydeder

    $("rpAuto").onclick=()=>dmAuto();

      const rows=parsed.rows.map(r=>({day:r.day, a_id:r.a.id, b_id:r.b.id, updated_at:nowIso()}));
      $("rpSave").disabled=true;
      try{ await upsert("ops_duty",rows,"day"); const days=new Set(rows.map(r=>r.day)); S.duty=S.duty.filter(x=>!days.has(x.day)).concat(rows);
        const f=rows[0].day, l=rows[rows.length-1].day; S.kontrolDay=f<=today()&&today()<=l?today():f;
        closeModal(); toast(`${rows.length} günlük liste kaydedildi ✓`); renderKontrol(); }
      catch(e){ toast(errMsg(e)); $("rpSave").disabled=false; }
    };
  }
  const dc=$("dutyClear"); if(dc) dc.onclick=async ()=>{
    if(!confirm(trMonth(mFirst)+" nöbet listesi silinsin mi? Otomatik sıraya dönülür.")) return;
    try{ if(!DEMO){ const {error}=await sb.from("ops_duty").delete().gte("day",mFirst).lte("day",mLast); if(error) throw error; } S.duty=S.duty.filter(x=>!inRange(x.day,[mFirst,mLast])); renderKontrol(); }catch(e){ toast(errMsg(e)); }
  };
  const de=$("dutyEdit"); if(de) de.onclick=()=>{
    const cur=dutyFor(day);
    modal(`<h3>Nöbetçiler · ${trDate(day)}</h3>
      <div class="flabel">1. kişi</div><select id="dA">${actives().map(m=>opt(m.id,m.name,cur[0]?.id)).join("")}</select>
      <div class="flabel">2. kişi</div><select id="dB">${actives().map(m=>opt(m.id,m.name,cur[1]?.id)).join("")}</select>
      <div class="btnrow"><button class="btn ghost" id="dAuto">Otomatiğe dön</button><button class="btn" id="dSave">Kaydet</button></div>`);
    $("dSave").onclick=async ()=>{
      const row={day,a_id:$("dA").value,b_id:$("dB").value,updated_at:nowIso()};
      try{ if(!DEMO){ const {error}=await sb.from("ops_duty").upsert(row,{onConflict:"day"}); if(error) throw error; }
        S.duty=S.duty.filter(d=>d.day!==day); S.duty.push(row); closeModal(); renderKontrol(); }catch(e){ toast(errMsg(e)); }
    };
    $("dAuto").onclick=async ()=>{
      try{ if(!DEMO){ const {error}=await sb.from("ops_duty").delete().eq("day",day); if(error) throw error; }
        S.duty=S.duty.filter(d=>d.day!==day); closeModal(); renderKontrol(); }catch(e){ toast(errMsg(e)); }
    };
  };
}

/* ================= KARGO & MESAJ TOPLAMLARI ================= */

  const wk=monday(day); const wkRows=S.team.filter(t=>inRange(t.day,[wk,addDays(wk,6)]));
  const last14=[...S.team].sort((a,b)=>b.day<a.day?-1:1).slice(0,14);
  const weeks=[]; for(let i=0;i<8;i++){ const m=addDays(monday(today()),-7*i); const rows=S.team.filter(t=>inRange(t.day,[m,addDays(m,6)])); weeks.push({m,rows}); }

  el.innerHTML=`
    <h2>Kargo & Mesaj Toplamları</h2>

      <div class="sect"><h3>📦 Çıkan kargo</h3><div class="fgrid">
        ${num("hepsijet","Hepsijet")}${num("yurtici","Yurtiçi")}${num("dhl","DHL")}

      <div class="sect"><h3>↩️ Sorunlu</h3><div class="fgrid c3">
        ${num("failed","Teslimat başarısız")}${num("returns","İade")}${num("cancels","İptal")}
      </div></div>
      <div class="sect"><h3>💬 Mesaj kanalı toplamları</h3><div class="fgrid c3">
        ${num("wp_total","WhatsApp")}${num("ig_total","Instagram")}${num("mail_total","Mail")}
      </div></div>
      <div class="flabel">Not</div><textarea id="k_note" rows="2" placeholder="Örn: 10 PTT, sistem hatasıyla geç çıktı">${esc(v("note"))}</textarea>
      <button class="btn" id="kargoSave">${r.day?"Güncelle":"Kaydet"}</button>
      ${r.updated_by?`<div class="note">Son: ${esc(memName(r.updated_by))} · ${r.updated_at?new Date(r.updated_at).toLocaleString("tr-TR"):""}</div>`:""}
    </div>
    <div class="kpis">
      <div class="kpi"><span>Bu hafta kargo</span><b>${nf.format(sum(wkRows,x=>x.cargo_total))}</b><small>${wkRows.length} gün</small></div>
      <div class="kpi"><span>Günlük ort.</span><b>${wkRows.length?nf.format(Math.round(sum(wkRows,x=>x.cargo_total)/wkRows.length)):"—"}</b></div>
      <div class="kpi"><span>Teslimat başarısız</span><b>${nf.format(sum(wkRows,x=>x.failed))}</b><small>iade ${sum(wkRows,x=>x.returns)} · iptal ${sum(wkRows,x=>x.cancels)}</small></div>
      <div class="kpi"><span>Mesaj toplam</span><b>${nf.format(sum(wkRows,x=>(x.wp_total||0)+(x.ig_total||0)+(x.mail_total||0)))}</b></div>
    </div>
    <div class="sect"><h3>📈 Son 8 hafta</h3><div class="tblwrap"><table class="compact">
      <tr><th>Hafta</th><th>Kargo</th><th></th><th>Hepsijet</th><th>Yurtiçi</th><th>DHL</th><th>Başarısız</th><th>Mesaj</th></tr>
      ${weeks.map(w=>{ const c=sum(w.rows,x=>x.cargo_total); return `<tr><td>${trShort(w.m)}</td><td>${nf.format(c)}</td><td style="min-width:90px"><div class="bar"><i style="width:${Math.round(c/maxC*100)}%"></i></div></td><td>${nf.format(sum(w.rows,x=>x.hepsijet))}</td><td>${nf.format(sum(w.rows,x=>x.yurtici))}</td><td>${nf.format(sum(w.rows,x=>x.dhl))}</td><td>${nf.format(sum(w.rows,x=>x.failed))}</td><td>${nf.format(sum(w.rows,x=>(x.wp_total||0)+(x.ig_total||0)+(x.mail_total||0)))}</td></tr>`; }).join("")}
    </table></div></div>
    <div class="sect"><h3>📅 Son 14 gün</h3><div class="tblwrap"><table class="compact">
      <tr><th>Gün</th><th>Hepsijet</th><th>Yurtiçi</th><th>DHL</th><th>Toplam</th><th>Başarısız</th><th>İade</th><th>İptal</th><th>WP</th><th>IG</th><th>Mail</th></tr>
      ${last14.map(t=>`<tr><td>${trShort(t.day)}</td><td>${t.hepsijet??"—"}</td><td>${t.yurtici??"—"}</td><td>${t.dhl??"—"}</td><td><b>${t.cargo_total??"—"}</b></td><td>${t.failed??"—"}</td><td>${t.returns??"—"}</td><td>${t.cancels??"—"}</td><td>${t.wp_total??"—"}</td><td>${t.ig_total??"—"}</td><td>${t.mail_total??"—"}</td></tr>`).join("")||`<tr><td colspan="11">Kayıt yok</td></tr>`}

  ["hepsijet","yurtici","dhl"].forEach(k=>$("k_"+k).oninput=()=>{ $("k_cargo_total").value=(numOrNull($("k_hepsijet").value)||0)+(numOrNull($("k_yurtici").value)||0)+(numOrNull($("k_dhl").value)||0); });
  if(dayLocked(day)) $("kargoForm").querySelectorAll("input,textarea,button").forEach(x=>x.disabled=true);
  $("kargoSave").onclick=async ()=>{
    if(VIEW()){ toast("👁 Görüntüleme modu: kaydetme kapalı"); return; }
    if(dayLocked(day)){ toast(LOCK_MSG); return; }
    const row={day, updated_by:S.me?.id||null, updated_at:nowIso(), note:$("k_note").value.trim()||null};
    ["hepsijet","yurtici","dhl","cargo_total","failed","returns","cancels","wp_total","ig_total","mail_total"].forEach(k=>row[k]=numOrNull($("k_"+k).value));
    if(row.cargo_total==null && (row.hepsijet!=null||row.yurtici!=null||row.dhl!=null)) row.cargo_total=(row.hepsijet||0)+(row.yurtici||0)+(row.dhl||0);
    $("kargoSave").disabled=true;
    try{ if(!DEMO){ const {error}=await sb.from("ops_team_daily").upsert(row,{onConflict:"day"}); if(error) throw error; }
      S.team=S.team.filter(t=>t.day!==day); S.team.push(row); toast("Kaydedildi ✓"); renderKargo(); }
    catch(e){ toast(errMsg(e)); $("kargoSave").disabled=false; }
  };
}

/* ================= MÜŞTERİ SESİ ================= */
function tagCounts(rows){ const c={}; rows.forEach(v=>(v.tags||[]).forEach(t=>c[t]=(c[t]||0)+1)); return Object.entries(c).sort((a,b)=>b[1]-a[1]); }
function renderSes(){
  const el=$("tabSes"); const f=S.voiceFilter;

  const tc=tagCounts(thisW), lc=Object.fromEntries(tagCounts(lastW));
  let list=S.voice.filter(v=>(!f.kind||v.kind===f.kind)&&(!f.brand||v.brand===f.brand)&&(!f.tag||(v.tags||[]).includes(f.tag))).slice(0,120);

    <h2>Müşteri Sesi</h2>
    <div class="sub">Şikayet, soru ve geri dönüşleri etiketle; hangi sorunun arttığı kendiliğinden görünür.</div>
    <div class="kpis">${(tc.slice(0,4).length?tc.slice(0,4):[["—",0]]).map(([t,n])=>`<div class="kpi"><span>${esc(TAGS[t]||t)} · bu hafta</span><b>${n}</b><small class="${(lc[t]||0)<n?"down":"up"}">geçen hafta ${lc[t]||0}</small></div>`).join("")}</div>
    <div class="card" style="margin-bottom:18px">
      <div class="fgrid c3">
        <div><div class="flabel">Tarih</div><input type="date" id="v_day" value="${today()}"></div>
        <div><div class="flabel">Tür</div><select id="v_kind">${Object.entries(VOICE_KINDS).map(([k,x])=>opt(k,x.l,"sikayet")).join("")}</select></div>
        <div><div class="flabel">Marka</div><select id="v_brand">${opt("","— genel —","")}${activeBrands().map(b=>opt(b.key,b.name,"")).join("")}</select></div>
      </div>
      <div class="flabel">Etiketler</div>
      <div class="tagc" id="v_tags" style="margin-bottom:12px">${Object.entries(TAGS).map(([k,l])=>`<button class="fchip" data-tag="${k}">${esc(l)}</button>`).join("")}</div>
      <textarea id="v_text" rows="3" placeholder="Müşteri ne dedi? Kaç kişi? Örn: 'Erimiş geldi' — 3 kişi, hepsi Ozvenia"></textarea>
      <button class="btn" id="vAdd">Ekle</button>

    <div class="filters">${fch("kind","","Hepsi")}${Object.entries(VOICE_KINDS).map(([k,x])=>fch("kind",k,x.l)).join("")}</div>
    ${activeBrands().length>1?`<div class="filters">${fch("brand","","Tüm markalar")}${activeBrands().map(b=>fch("brand",b.key,b.name)).join("")}</div>`:""}
    <div class="filters">${fch("tag","","Tüm etiketler")}${Object.entries(TAGS).map(([k,l])=>fch("tag",k,l)).join("")}</div>
    <div class="cards">${list.map(v=>`
      <div class="card vcard">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span class="pill">${trShort(v.day)}</span>${chip(VOICE_KINDS[v.kind]?.l||v.kind, VOICE_KINDS[v.kind]?.s||"var(--gray-s)")}${v.brand?chip(brandName(v.brand),"var(--card)"):""}
          <span style="flex:1"></span>
          ${(isAdmin()||v.by_id===S.me?.id)?`<button class="editbtn" data-vedit="${v.id}">✏️</button>`:""}
        </div>
        <div class="vtext">${esc(v.text)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${(v.tags||[]).map(t=>`<span class="pill">${esc(TAGS[t]||t)}</span>`).join("")}<span style="flex:1"></span><span class="note" style="margin:0">${esc(memName(v.by_id))}</span></div>
      </div>`).join("")||`<div class="empty">Kayıt yok</div>`}</div>
  `;
  el.querySelectorAll("[data-fk]").forEach(b=>b.onclick=()=>{ f[b.dataset.fk]=b.dataset.fv; renderSes(); });
  const picked=new Set();
  el.querySelectorAll("#v_tags .fchip").forEach(b=>b.onclick=()=>{ b.classList.toggle("on"); b.classList.contains("on")?picked.add(b.dataset.tag):picked.delete(b.dataset.tag); });
  $("vAdd").onclick=async ()=>{
    if(VIEW()){ toast("👁 Görüntüleme modu: kaydetme kapalı"); return; }
    const text=$("v_text").value.trim(); if(!text){ toast("Metin boş."); return; }
    const row={day:$("v_day").value||today(), kind:$("v_kind").value, brand:$("v_brand").value||null, tags:[...picked], text, by_id:S.me?.id||null, created_at:nowIso()};

      toast("Eklendi ✓"); renderSes(); }catch(e){ toast(errMsg(e)); }

      <textarea id="e_text" rows="4">${esc(v.text)}</textarea>
      <div class="btnrow"><button class="btn danger" id="eDel">Sil</button><button class="btn" id="eSave">Kaydet</button></div>`);
    const tg=new Set(v.tags||[]);
    document.querySelectorAll("#e_tags .fchip").forEach(x=>x.onclick=()=>{ x.classList.toggle("on"); x.classList.contains("on")?tg.add(x.dataset.tag):tg.delete(x.dataset.tag); });
    $("eSave").onclick=async ()=>{
      const upd={day:$("e_day").value, kind:$("e_kind").value, brand:$("e_brand").value||null, tags:[...tg], text:$("e_text").value.trim()};
      try{ if(!DEMO){ const {error}=await sb.from("ops_voice").update(upd).eq("id",v.id); if(error) throw error; } Object.assign(v,upd); closeModal(); renderSes(); }catch(e){ toast(errMsg(e)); }
    };
    $("eDel").onclick=async ()=>{ if(!confirm("Silinsin mi?")) return;
      try{ if(!DEMO){ const {error}=await sb.from("ops_voice").delete().eq("id",v.id); if(error) throw error; } S.voice=S.voice.filter(x=>x.id!==v.id); closeModal(); renderSes(); }catch(e){ toast(errMsg(e)); } };
  });
}

/* ================= STOK ================= */
function renderStok(){

  const prods=S.products.filter(p=>p.active!==false).sort((a,b)=>(bsort(a.brand)-bsort(b.brand))||((a.sort||0)-(b.sort||0)));
  const dates=[...new Set(S.stock.map(s=>s.day))].sort().reverse();
  const at=(p,d)=>S.stock.find(s=>s.product===p&&s.day===d)?.qty;
  const lastOf=p=>{ const r=S.stock.filter(s=>s.product===p&&s.day<day).sort((a,b)=>b.day<a.day?-1:1)[0]; return r; };
  const cols=dates.slice(0,6);
  el.innerHTML=`

    ${dayNav("stokDay",day, isAdmin()?`<button class="btn ghost sm" id="prodEdit">🏷 Markalar & Ürünler</button>`:"")}
    <div class="note" style="margin:-6px 0 12px">${activeBrands().map(b=>`<b>${esc(b.name)}</b>: ${S.products.filter(p=>p.brand===b.key&&p.active!==false).map(p=>esc(p.name)).join(", ")||"ürün yok"}`).join(" · ")||"Marka tanımlı değil"}</div>
    <div class="card stk" style="margin-bottom:18px">
      <div class="row" style="border-bottom:var(--b2)"><div class="flabel" style="margin:0">Ürün</div><div class="flabel" style="margin:0;text-align:right">Önceki</div><div class="flabel" style="margin:0;text-align:right">${trShort(day)}</div></div>
      ${prods.map((p,i)=>{ const l=lastOf(p.key); const cur=at(p.key,day); const low=p.min_qty&&((cur??l?.qty)??Infinity)<p.min_qty; const hdr=(activeBrands().length>1&&(i===0||prods[i-1].brand!==p.brand))?`<div class="flabel" style="margin-top:10px">🏷 ${esc(brandName(p.brand)||"Markasız")}</div>`:""; return hdr+`<div class="row"><div style="font-weight:700;${low?"color:var(--red)":""}">${esc(p.name)}${low?" ⚠️":""}</div><div class="last">${l?`${nf.format(l.qty)}<br><small style="color:var(--mut)">${trShort(l.day)}</small>`:"—"}</div><input type="number" inputmode="numeric" min="0" id="s_${p.key}" value="${cur??""}" placeholder="—"></div>`; }).join("")||`<div class="empty">Ürün yok — ${isAdmin()?"“Markalar & Ürünler” ile ekle.":"yönetici eklesin."}</div>`}
      <button class="btn" id="stokSave" style="margin-top:14px">Sayımı Kaydet</button>
    </div>
    ${cols.length?`<div class="sect"><h3>📊 Son sayımlar</h3><div class="tblwrap"><table class="compact">
      <tr><th>Ürün</th>${cols.map(d=>`<th>${trShort(d)}</th>`).join("")}</tr>
      ${prods.map(p=>`<tr><td>${esc(p.name)}</td>${cols.map((d,i)=>{ const q=at(p.key,d); const prev=cols[i+1]!=null?at(p.key,cols[i+1]):null; const cls=q!=null&&prev!=null?(q>prev?"up":q<prev?"down":""):""; return `<td class="${cls}">${q!=null?nf.format(q):"—"}</td>`; }).join("")}</tr>`).join("")}
    </table></div></div>`:""}
  `;
  bindDayNav(el,"stokDay",renderStok);
  $("stokSave").onclick=async ()=>{
    if(VIEW()){ toast("👁 Görüntüleme modu: kaydetme kapalı"); return; }
    const rows=prods.map(p=>({day,product:p.key,qty:numOrNull($("s_"+p.key).value),by_id:S.me?.id||null})).filter(r=>r.qty!=null);
    if(!rows.length){ toast("Adet gir."); return; }
    try{ await upsert("ops_stock",rows,"day,product"); rows.forEach(r=>{ S.stock=S.stock.filter(s=>!(s.day===r.day&&s.product===r.product)); S.stock.push({id:uid(),...r}); });
      toast(`${rows.length} ürün kaydedildi ✓`); renderStok(); }catch(e){ toast(errMsg(e)); }
  };
  const pe=$("prodEdit"); if(pe) pe.onclick=()=>{
    const all=[...S.products].sort((a,b)=>(a.sort||0)-(b.sort||0)); const brands=[...S.brands].sort((a,b)=>(a.sort||0)-(b.sort||0));
    const bsel=(id,cur)=>`<select data-pb="${id}" style="margin:0">${opt("","— marka —",cur||"")}${brands.map(b=>opt(b.key,b.name,cur||"")).join("")}</select>`;
    modal(`<h3>🏷 Markalar & Ürünler</h3>
      <div class="flabel">Markalar</div>
      ${brands.map(b=>`<div class="frow" style="grid-template-columns:1fr 70px;align-items:center"><input type="text" data-bn="${b.key}" value="${esc(b.name)}"><label style="font-size:.7rem;font-weight:800;margin-bottom:12px"><input type="checkbox" data-ba="${b.key}" ${b.active!==false?"checked":""} style="width:auto;margin:0 4px 0 0">aktif</label></div>`).join("")}
      <input type="text" id="bNew" placeholder="Yeni marka adı">
      <div class="flabel" style="margin-top:8px">Ürünler</div>
      ${all.map(p=>`<div class="frow" style="grid-template-columns:1fr 110px 60px 60px;gap:6px;align-items:center"><input type="text" data-pn="${p.key}" value="${esc(p.name)}">${bsel(p.key,p.brand)}<input type="number" data-pm="${p.key}" value="${p.min_qty||""}" placeholder="min" title="Uyarı eşiği"><label style="font-size:.7rem;font-weight:800;margin-bottom:12px"><input type="checkbox" data-pa="${p.key}" ${p.active!==false?"checked":""} style="width:auto;margin:0 4px 0 0">aktif</label></div>`).join("")}
      <div class="frow" style="grid-template-columns:1fr 110px;gap:6px"><input type="text" id="pNew" placeholder="Yeni ürün (ör. Kids Macun)">${bsel("__new", brands[0]?.key||"")}</div>
      <div class="note">Pasif yapılan ürün/marka listelerden kalkar, geçmiş sayımları silinmez.</div>
      <button class="btn" id="pSave" style="margin-top:10px">Kaydet</button>`);
    const slug=n=>n.toLowerCase().replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
    $("pSave").onclick=async ()=>{
      const brows=brands.map(b=>({key:b.key,name:document.querySelector(`[data-bn="${b.key}"]`).value.trim()||b.name,active:document.querySelector(`[data-ba="${b.key}"]`).checked,sort:b.sort||0}));
      const bn=$("bNew").value.trim(); if(bn){ const k=slug(bn)||("marka_"+brands.length); if(!brows.find(b=>b.key===k)) brows.push({key:k,name:bn,active:true,sort:brands.length+1}); }
      const prows=all.map(p=>({key:p.key,name:document.querySelector(`[data-pn="${p.key}"]`).value.trim()||p.name,brand:document.querySelector(`[data-pb="${p.key}"]`).value||null,min_qty:numOrNull(document.querySelector(`[data-pm="${p.key}"]`).value)||0,active:document.querySelector(`[data-pa="${p.key}"]`).checked,sort:p.sort||0}));
      const nn=$("pNew").value.trim(); if(nn){ let k=slug(nn)||("urun_"+all.length); if(prows.find(p=>p.key===k)) k+="_"+(all.length+1); prows.push({key:k,name:nn,brand:document.querySelector('[data-pb="__new"]').value||null,min_qty:0,active:true,sort:all.length+1}); }
      try{ await upsert("ops_brands",brows,"key"); await upsert("ops_products",prows,"key"); S.brands=brows; S.products=prows; closeModal(); toast("Kaydedildi ✓"); renderStok(); }catch(e){ toast(errMsg(e)); }
    };
  };
}

/* ================= SORUMLULUKLAR · GÖREVLER · DENETİM ================= */
const ROLES = {
  stok:             {l:"Stok sayımı",                       i:"📊", tab:"stok",    d:"Stok sekmesi yalnızca bu kişiye görünür."},
  kargo:            {l:"Kargo & mesaj toplamları girişi",   i:"📦", tab:"kargo",   d:"Kargo sekmesi yalnızca bu kişiye görünür."},
  mesaj_kontrol:    {l:"Mesaj kontrolü",                    i:"💬", tab:"denetim", d:"Herkesin günlük mesaj sayılarını görür ve kontrol eder."},
  temizlik_kontrol: {l:"Temizlik kontrolü",                 i:"🧹", tab:"denetim", d:"Nöbetçilerin temizlik tiklerini görür ve denetler."},
  mesaj_kanali:     {l:"Mesaj kanalı temizleme (sabah/akşam)", i:"📨", tab:"kontrol", d:"Kontrol sekmesindeki WhatsApp/Instagram/Mail temizleme maddeleri yalnızca bu kişide görünür."},
};
const roleHolder = k=>{ const a=S.assign.find(x=>x.role_key===k); return a?.member_id ? memById(a.member_id) : null; };
const holdsRole  = k=>{ const h=roleHolder(k); return !!(h && S.me && h.id===S.me.id); };
const canTab     = k=>isAdmin() || !roleHolder(k) || holdsRole(k) || (k==="stok" && isPuanci());      // atanmamışsa herkes; puan+stok yetkilisi stoğu her zaman görür
const canDenetim = ()=>isAdmin() || holdsRole("mesaj_kontrol") || holdsRole("temizlik_kontrol");
const myRoles    = m=>Object.keys(ROLES).filter(k=>roleHolder(k)?.id===m?.id);
const checkOf    = (day,item)=>S.checks.find(c=>c.day===day && c.item===item);
function roleStatus(k, day){ // o gün sorumluluk yerine getirildi mi
  if(k==="stok")  return S.stock.some(s=>s.day===day);
  if(k==="kargo") return S.team.some(t=>t.day===day && t.cargo_total!=null);
  if(k==="mesaj_kanali") return CHECK_GROUPS.filter(g=>/^mesaj/.test(g.k)).every(g=>g.items.every(i=>checkOf(day,i[0])));
  return !!checkOf(day,k);
}
// ortak görev tablosu (tasks) -> panel içi şekil: her atanan üye için bir satır
function unifyTasks(rows, assignees){
  const out=[];
  rows.forEach(t=>{
    const uids=[t.user_id, ...assignees.filter(a=>a.task_id===t.id).map(a=>a.user_id)].filter((v,i,a)=>v&&a.indexOf(v)===i);
    uids.forEach(uid=>{ const m=S.members.find(x=>x.user_id===uid); if(!m) return;
      out.push({id:t.id, user_id:uid, member_id:m.id, title:t.title, detail:t.descr||null, due:t.due, done:t.status==="done", done_at:t.done_at, done_note:t.done_note, created_at:t.created_at, source:t.source}); });
  });
  return out;
}
const taskUpd = upd=>({status: upd.done?"done":"todo", done_at: upd.done_at||null, done_note: upd.done_note||null});
const tasksOf = (mid, day)=>S.tasks.filter(t=>t.member_id===mid && (!t.done || (t.done_at||"").slice(0,10)===day || t.due===day)).sort((a,b)=>(a.due||"9")<(b.due||"9")?-1:1);

function taskList(m, day){
  const ts=tasksOf(m.id, day); const roles=myRoles(m);
  const onDuty = dutyFor(day).some(x=>x.id===m.id);
  const cleanItems = CHECK_GROUPS.filter(g=>!/^mesaj/.test(g.k)).flatMap(g=>g.items.map(i=>i[0]));
  const cleanDone = cleanItems.filter(k=>checkOf(day,k)).length;
  const dutyRow = onDuty ? `<div class="chk ${cleanDone===cleanItems.length?"on":""}" data-rtab="kontrol"><div class="bx">${cleanDone===cleanItems.length?"✓":""}</div><div class="lbl">🧹 Bugün nöbetçisin — temizlik & kapanış listesi</div><div class="by">${cleanDone}/${cleanItems.length}</div></div>` : "";
  if(!ts.length && !roles.length && !onDuty) return "";
  return `<div class="card" style="margin-bottom:16px">
    <div class="sect" style="margin-bottom:${ts.length?"14px":"0"}"><h3>🎯 Sorumluluklar · ${trDate(day)}</h3>
      ${dutyRow}${roles.length?roles.map(k=>{ const ok=roleStatus(k,day); return `<div class="chk ${ok?"on":""}" data-rtab="${ROLES[k].tab}"><div class="bx">${ok?"✓":""}</div><div class="lbl">${ROLES[k].i} ${esc(ROLES[k].l)}</div><div class="by">${ok?"yapıldı":"bekliyor →"}</div></div>`; }).join(""):(onDuty?"":`<div class="note" style="margin:0">Sabit sorumluluk yok.</div>`)}
    </div>
    ${ts.length?`<div class="sect" style="margin-bottom:0"><h3>📌 Sana verilen işler <span class="cnt">${ts.filter(t=>!t.done).length} açık</span></h3>
      ${ts.map(t=>`<div class="chk ${t.done?"on":""}" data-task="${t.id}"><div class="bx">${t.done?"✓":""}</div><div class="lbl">${esc(t.title)}${t.detail?`<div class="note" style="margin:2px 0 0">${esc(t.detail)}</div>`:""}${t.done_note?`<div class="note" style="margin:2px 0 0;color:var(--green)">↳ ${esc(t.done_note)}</div>`:""}</div><div class="by">${t.due?trShort(t.due):""}${t.done&&t.done_at?` · ${new Date(t.done_at).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})}`:""}${(t.due&&!t.done&&t.due<today())?" ⚠️ gecikti":""}</div></div>`).join("")}
    </div>`:""}
  </div>`;
}
function bindTaskList(root, rerender){
  root.querySelectorAll("[data-rtab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.rtab; renderAll(); });
  root.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.task); if(!t) return;
    modal(`<h3>${esc(t.title)}</h3>${t.detail?`<div class="sub">${esc(t.detail)}</div>`:""}
      <div class="flabel">Ne yaptın / not (yöneticiye gider)</div><textarea id="tk_note" rows="3">${esc(t.done_note||"")}</textarea>
      <div class="btnrow">${t.done?`<button class="btn ghost" id="tkUndo">Yapılmadı yap</button>`:""}<button class="btn" id="tkDone">${t.done?"Notu güncelle":"Yapıldı ✓"}</button></div>
      ${isAdmin()?`<button class="btn danger sm" id="tkDel" style="margin-top:10px">Görevi sil</button>`:""}`);
    const save=async (upd)=>{ try{ if(!DEMO){ const {error}=await sb.from("tasks").update(taskUpd(upd)).eq("id",t.id); if(error) throw error; } S.tasks.filter(x=>x.id===t.id).forEach(x=>Object.assign(x,upd)); closeModal(); rerender(); }catch(e){ toast(errMsg(e)); } };
    $("tkDone").onclick=()=>{ if(VIEW()){ toast("👁 Görüntüleme modu: kaydetme kapalı"); return; } save({done:true, done_at:t.done_at||nowIso(), done_note:$("tk_note").value.trim()||null}); };
    const u=$("tkUndo"); if(u) u.onclick=()=>save({done:false, done_at:null, done_note:$("tk_note").value.trim()||null});
    const d=$("tkDel"); if(d) d.onclick=async ()=>{ if(!confirm("Görev silinsin mi?")) return; try{ if(!DEMO){ const {error}=await sb.from("tasks").delete().eq("id",t.id); if(error) throw error; } S.tasks=S.tasks.filter(x=>x.id!==t.id); closeModal(); rerender(); }catch(e){ toast(errMsg(e)); } };
  });
}

async function toggleControl(day, item, on, note){
  if(dayLocked(day)) throw new Error(LOCK_MSG);
  const c=checkOf(day,item);
  if(c && !on){ if(!DEMO){ const {error}=await sb.from("ops_checks").delete().eq("id",c.id); if(error) throw error; } S.checks=S.checks.filter(x=>x.id!==c.id); return; }
  if(!c && on){ const row={day,item,done_by:S.me?.id||null,done_at:nowIso(),note:note||null};
    if(DEMO) S.checks.push({id:uid(),...row}); else { const {data,error}=await sb.from("ops_checks").insert(row).select().single(); if(error) throw error; S.checks.push(data); } }
  else if(c && on && note!==undefined){ if(!DEMO){ const {error}=await sb.from("ops_checks").update({note:note||null}).eq("id",c.id); if(error) throw error; } c.note=note||null; }
}

}

try{ await toggleControl(day,item,true,$("ct_note").value.trim()); closeModal(); rerender(); }catch(e){ toast(errMsg(e)); } };

const RANK_DEF = {puan:40, disiplin:20, devam:15, kontrol:10, hacim:15};
const RANK_L   = {puan:"Ekip puanı", disiplin:"Doldurma", devam:"Zamanında geliş", kontrol:"Kontrol tikleri", hacim:"İş hacmi"};
const weights  = ()=>({...RANK_DEF, ...(S.weights||{})});
const monthEnd = f=>{ const d=new Date(f+"T00:00:00"); d.setMonth(d.getMonth()+1); d.setDate(0); return iso(d); };
function monthWeeks(first){ // pazartesi'si bu ayda olan haftalar
  const last=monthEnd(first); let m=monday(first); if(m<first) m=addDays(m,7);
  const out=[]; while(m<=last){ out.push([m, addDays(m,6)]); m=addDays(m,7); } return out;
}
function rankLocal(from,to){ // DEMO: sunucudaki ops_ranking ile aynı formül
  const w=weights(); const toC=to<today()?to:today(); let wdays=0;
  for(let d=from; d<=toC; d=addDays(d,1)) if(dow(d)!==0) wdays++;
  const rows=actives().map(m=>{
    const D=S.daily.filter(x=>x.member_id===m.id&&inRange(x.day,[from,to]));
    const ins=D.map(x=>mins(x.in_time)).filter(x=>x!=null);
    const scR=S.scores.filter(s=>s.ratee_id===m.id&&inRange(s.day,[from,to])&&s.score!=null), sc=scR.map(s=>s.score);
    const ticks=S.checks.filter(c=>c.done_by===m.id&&inRange(c.day,[from,to])).length;
    const vol=sum(D,x=>(x.call_total||0)+msgOf(x)+(x.cargo||0));
    return {member_id:m.id,name:m.name,puan:(recvAvg(scR)||0)*10,n_puan:sc.length,disiplin:Math.min(100,D.length/Math.max(wdays,1)*100),devam:ins.length?ins.filter(x=>x<=LATE_MIN).length/ins.length*100:0,ticks,volpd:D.length?vol/D.length:0};
  });
  const mt=Math.max(1,...rows.map(r=>r.ticks)), mv=Math.max(1,...rows.map(r=>r.volpd));
  rows.forEach(r=>{ r.kontrol=r.ticks/mt*100; r.hacim=r.volpd/mv*100; r.total=(r.puan*w.puan+r.disiplin*w.disiplin+r.devam*w.devam+r.kontrol*w.kontrol+r.hacim*w.hacim)/100; });
  return rows.filter(r=>r.total>0).sort((a,b)=>b.total-a.total||b.puan-a.puan);
}
async function ranking(from,to){
  if(DEMO) return isAdmin()? rankLocal(from,to) : rankLocal(from,to).slice(0,1).map(r=>({member_id:r.member_id,name:r.name}));
  const {data,error}=await sb.rpc("ops_ranking",{p_from:from,p_to:to,p_full:isAdmin()});
  if(error){ if(/ops_ranking/.test(error.message)) throw new Error("schema.sql v1.1 bloğu çalıştırılmamış."); throw error; }
  return data||[];
}

/* ================= PANO (yönetici) ================= */
function periodRange(p=S.panoPeriod, ref=S.panoRef){
  if(p==="hafta"){ const m=monday(ref); return [m, addDays(m,6)]; }
  if(p==="ay"){ const f=ref.slice(0,8)+"01"; const d=new Date(f+"T00:00:00"); d.setMonth(d.getMonth()+1); d.setDate(0); return [f, iso(d)]; }
  return ["2000-01-01","2999-12-31"];
}
function shiftRef(n){
  if(S.panoPeriod==="hafta") S.panoRef=addDays(S.panoRef,7*n);
  else if(S.panoPeriod==="ay"){ const d=new Date(S.panoRef.slice(0,8)+"01T00:00:00"); d.setMonth(d.getMonth()+n); S.panoRef=iso(d); }
}
function cargoIn(range){
  const t=S.team.filter(x=>inRange(x.day,range)&&x.cargo_total!=null);
  if(t.length) return sum(t,x=>x.cargo_total);
  return sum(S.daily.filter(x=>inRange(x.day,range)),x=>x.cargo);
}

function renderImport(){
  const el=$("tabImport"); if(!isAdmin()){ el.innerHTML=""; return; }
  el.innerHTML=`
    <h2>Veri İçe Aktar</h2>
    <div class="sub">Excel'den dönüştürülmüş JSON'u yapıştır (gecmis-import.json). Aynı gün/kişi kayıtları güncellenir, tekrar eklenmez.</div>
    <textarea id="impJson" class="json" placeholder='{"members":[...],"daily":[...],"scores":[...],"checks":[...],"duty":[...],"team":[...],"voice":[...],"stock":[...]}'></textarea>
    <button class="btn" id="btnImport">İçe Aktar</button>
    <div id="impLog" class="implog hidden"></div>`;
  $("btnImport").onclick=doImport;
}
async function doImport(){
  const log=$("impLog"); log.classList.remove("hidden"); log.textContent="";
  const say=m=>{ log.textContent+=m+"\n"; log.scrollTop=log.scrollHeight; };
  let data; try{ data=JSON.parse($("impJson").value); }catch(e){ say("❌ JSON okunamadı: "+e.message); return; }
  $("btnImport").disabled=true;
  try{
    // üyeler
    if(Array.isArray(data.members)){
      const rows=data.members.filter(m=>!S.members.find(x=>x.key===m.key)).map((m,i)=>({key:m.key,name:m.name,active:m.active!==false,tasks:m.tasks||null,sort:S.members.length+i+1,color:"#9AA0A6"}));
      if(rows.length){ say(`→ ${rows.length} yeni üye…`); if(DEMO) rows.forEach(r=>S.members.push({id:uid(),...r})); else { const {data:d,error}=await sb.from("ops_members").upsert(rows,{onConflict:"key"}).select(); if(error) throw error; S.members.push(...d); } }
    }
    const mid=k=>S.members.find(m=>m.key===k)?.id||null;
    if(Array.isArray(data.products)){
      const skip=data.products.filter(p=>!S.products.find(x=>x.key===p.key)).length;
      if(skip) say(`→ ${skip} ürün atlandı (panelde tanımlı değil; önce Markalar & Ürünler'den ekle).`);
    }
    if(Array.isArray(data.daily)&&data.daily.length){
      const rows=data.daily.map(r=>{ const {m,...rest}=r; return {member_id:mid(m),...rest,updated_at:nowIso()}; }).filter(r=>r.member_id);
      say(`→ ${rows.length} günlük kayıt…`); await upsert("ops_daily",rows,"member_id,day");
      if(DEMO) rows.forEach(r=>{ const i=S.daily.findIndex(x=>x.member_id===r.member_id&&x.day===r.day); if(i>=0) S.daily[i]={...S.daily[i],...r}; else S.daily.push({id:uid(),...r}); });
    }
    if(Array.isArray(data.scores)&&data.scores.length){
      const rows=data.scores.map(s=>({day:s.day,rater_id:mid(s.rater),ratee_id:mid(s.ratee),score:s.score,comment:s.comment||null,updated_at:nowIso()})).filter(r=>r.rater_id&&r.ratee_id);
      say(`→ ${rows.length} puan…`); await upsert("ops_scores",rows,"day,rater_id,ratee_id");
      if(DEMO) rows.forEach(r=>{ if(!S.scores.find(x=>x.day===r.day&&x.rater_id===r.rater_id&&x.ratee_id===r.ratee_id)) S.scores.push({id:uid(),...r}); });
    }
    if(Array.isArray(data.checks)&&data.checks.length){
      const rows=data.checks.map(c=>({day:c.day,item:c.item,done_by:mid(c.by),done_at:c.day+"T09:00:00+03:00"}));
      say(`→ ${rows.length} kontrol tiki…`); await upsert("ops_checks",rows,"day,item",true);
      if(DEMO) rows.forEach(r=>{ if(!S.checks.find(x=>x.day===r.day&&x.item===r.item)) S.checks.push({id:uid(),...r}); });
    }
    if(Array.isArray(data.duty)&&data.duty.length){
      const rows=data.duty.map(d=>({day:d.day,a_id:mid(d.a),b_id:mid(d.b),updated_at:nowIso()}));
      say(`→ ${rows.length} nöbet…`); await upsert("ops_duty",rows,"day",true);
      if(DEMO) rows.forEach(r=>{ if(!S.duty.find(x=>x.day===r.day)) S.duty.push(r); });
    }
    if(Array.isArray(data.team)&&data.team.length){
      const rows=data.team.map(t=>({...t,updated_at:nowIso()}));
      say(`→ ${rows.length} kargo/mesaj günü…`); await upsert("ops_team_daily",rows,"day");
      if(DEMO) rows.forEach(r=>{ S.team=S.team.filter(x=>x.day!==r.day); S.team.push(r); });
    }
    if(Array.isArray(data.voice)&&data.voice.length){
      const have=new Set(S.voice.map(v=>`${v.day}|${v.kind}|${v.brand||""}|${v.text}`));
      const okBrand=v=>!v.brand || S.brands.find(b=>b.key===v.brand);
      const skipB=data.voice.filter(v=>!okBrand(v)).length; if(skipB) say(`→ ${skipB} müşteri notu atlandı (tanımsız marka).`);
      const rows=data.voice.filter(v=>okBrand(v)&&!have.has(`${v.day}|${v.kind}|${v.brand||""}|${v.text}`)).map(v=>({day:v.day,kind:v.kind,brand:v.brand||null,tags:v.tags||guessTags(v.text),text:v.text,by_id:mid(v.by),created_at:v.day+"T18:00:00+03:00"}));
      say(`→ ${rows.length} müşteri sesi (${data.voice.length-rows.length} zaten vardı)…`);
      if(DEMO) rows.forEach(r=>S.voice.push({id:uid(),...r}));
      else for(let i=0;i<rows.length;i+=400){ const {error}=await sb.from("ops_voice").insert(rows.slice(i,i+400)); if(error) throw error; }
    }
    if(Array.isArray(data.stock)&&data.stock.length){
      const rows=data.stock.filter(s=>S.products.find(p=>p.key===s.product)).map(s=>({day:s.day,product:s.product,qty:s.qty}));
      say(`→ ${rows.length} stok sayımı…`); await upsert("ops_stock",rows,"day,product");
      if(DEMO) rows.forEach(r=>{ S.stock=S.stock.filter(x=>!(x.day===r.day&&x.product===r.product)); S.stock.push({id:uid(),...r}); });
    }
    if(!DEMO){ say("→ Yeniden yükleniyor…"); await loadAll(); }
    S.voice.sort((a,b)=>b.day<a.day?-1:1); S.daily.sort((a,b)=>b.day<a.day?-1:1);
    say("✅ Tamamlandı."); toast("Aktarım tamam ✓");
  }catch(e){ say("❌ Hata: "+(e.message||e)); }
  $("btnImport").disabled=false;
}
function guessTags(t){
  const s=String(t||"").toLowerCase(); const out=[];
  if(/erimi/.test(s)) out.push("erimis"); if(/eksik/.test(s)) out.push("eksik"); if(/yanlı|yanli/.test(s)) out.push("yanlis");
  if(/geç|gec /.test(s)) out.push("gec"); if(/iade/.test(s)) out.push("iade"); if(/iptal/.test(s)) out.push("iptal");
  if(/kullan/.test(s)) out.push("kullanim"); if(/içeri|iceri/.test(s)) out.push("icerik"); if(/fiyat/.test(s)) out.push("fiyat"); if(/kitap/.test(s)) out.push("ekitap");
  return out;
}

  if(S.dbOk && !S.me && md.member_key){
    const {data}=await sb.from("ops_members").update({user_id:prof.id}).eq("key",md.member_key).is("user_id",null).select().maybeSingle();
    if(data){ const i=S.members.findIndex(m=>m.key===data.key); S.members[i]=data; S.me=data; }
  }
  await showApp();
  if(S.dbOk && !S.me && !isAdmin()) openClaimModal();
}

$("suMember").innerHTML+=MEMBER_SEED.map(([k,n])=>`<option value="${k}">${n}</option>`).join("");
(async ()=>{
  if(DEMO) return;
  try{
    const {data,error} = await sb.rpc("ops_team_names");
    if(error || !data?.length) return;
    $("suMember").innerHTML = `<option value="">Ekipteki adın</option>` +
      data.map(m=>`<option value="${esc(m.key)}">${esc(m.name)}</option>`).join("");

/* ---------- ŞİFREMİ UNUTTUM ---------- */
function authView(v){ ["Login","Signup","Forgot","Reset"].forEach(k=>$("auth"+k).classList.toggle("hidden", k.toLowerCase()!==v)); }
function showReset(){ showAuth("",false); authView("reset"); }
$("goForgot").onclick=()=>{ authView("forgot"); $("fgEmail").value=$("liEmail").value; $("authMsg").textContent=""; };
$("goLogin2").onclick=()=>{ authView("login"); $("authMsg").textContent=""; };
$("btnForgot").onclick=async ()=>{
  if(DEMO) return;
  const email=$("fgEmail").value.trim(); if(!/^\S+@\S+\.\S+$/.test(email)){ showAuth("Geçerli bir e-posta yaz.",true); return; }
  $("btnForgot").disabled=true;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  $("btnForgot").disabled=false;
  if(error){ showAuth(/rate|limit|seconds/i.test(error.message)?"Çok sık denendi. Birkaç dakika bekleyip tekrar dene.":"Gönderilemedi: "+error.message,true); return; }
  showAuth("Bağlantı gönderildi ✓ E-postanı (gerekirse spam klasörünü) kontrol et. Bağlantıya tıklayınca yeni şifreni belirleyeceksin.",false);
};
$("btnReset").onclick=async ()=>{
  const p1=$("rsPass").value, p2=$("rsPass2").value;
  if(p1.length<6){ showAuth("Şifre en az 6 karakter olmalı.",true); return; }
  if(p1!==p2){ showAuth("İki şifre aynı değil.",true); return; }
  $("btnReset").disabled=true;
  const {error}=await sb.auth.updateUser({password:p1});
  $("btnReset").disabled=false;
  if(error){ showAuth("Şifre kaydedilemedi: "+error.message+" — bağlantının süresi dolmuş olabilir, yeni bağlantı iste.",true); return; }
  pwRecovery=false; history.replaceState(null,"",location.pathname); $("rsPass").value=$("rsPass2").value="";
  authView("login"); boot();
};
$("goSignup").onclick=()=>{ $("authLogin").classList.add("hidden"); $("authSignup").classList.remove("hidden"); $("authMsg").textContent=""; };
$("goLogin").onclick =()=>{ $("authSignup").classList.add("hidden"); $("authLogin").classList.remove("hidden"); $("authMsg").textContent=""; };
$("btnLogin").onclick=async ()=>{
  if(DEMO) return; $("btnLogin").disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$("liEmail").value.trim(), password:$("liPass").value});
  $("btnLogin").disabled=false;
  if(error){ showAuth("Giriş başarısız: "+error.message,true); return; }
  boot();
};
$("btnSignup").onclick=async ()=>{
  if(DEMO) return;
  const name=$("suName").value.trim(); if(!name){ showAuth("Ad Soyad gerekli.",true); return; }
  $("btnSignup").disabled=true;
  const {data,error}=await sb.auth.signUp({email:$("suEmail").value.trim(), password:$("suPass").value, options:{data:{name, member_key:$("suMember").value||null, role:"ops"}}});
  if(error){ $("btnSignup").disabled=false; showAuth("Kayıt başarısız: "+error.message,true); return; }
  if(data.session){ await sb.from("profiles").insert({id:data.user.id, name, role:"ops"}); }
  else showAuth("Kayıt alındı. E-posta doğrulaması kapalıysa hemen giriş yapabilirsin.");
  $("btnSignup").disabled=false;
  boot();
};
const logout=async ()=>{ if(DEMO){ alert("Demo modundasın."); return; } if(confirm("Çıkış yapılsın mı?")){ await sb.auth.signOut(); location.reload(); } };
$("avatar").onclick=logout; $("btnView").onclick=openViewModal; $("avatarSide").onclick=logout;
$("btnCollapse").onclick=()=>{ document.documentElement.classList.toggle("collapsed"); $("btnCollapse").textContent=document.documentElement.classList.contains("collapsed")?"›":"‹"; };

boot();

<!--MOBJS-->
<script id="mobJs">
/* ===== MOBİL: alt menü en fazla 5 buton (4 sekme + "Daha"), sekme etiketleri ikon + yazı ===== */
(()=>{
  const mq = matchMedia("(max-width:959px)"), MAX = 5;
  const EMO = /^\s*((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍\p{Extended_Pictographic})*)\s*/u;
  const obs = new MutationObserver(run);
  const watch = () => obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:["class"]});

  // "📝 Günlük" → <span class="ic">📝</span><span class="lb">Günlük</span>
  function split(b){
    if(b.dataset.mobSplit || b.querySelector(".ic")) return;
    const t = b.textContent, m = t.match(EMO);
    if(!m) return;
    b.dataset.mobSplit = 1;
    const lb = b.dataset.s || t.slice(m[0].length);
    b.innerHTML = `<span class="ic">${m[1]}</span><span class="lb"></span>`;
    b.querySelector(".lb").textContent = lb;
    if(b.dataset.s) b.title = t.slice(m[0].length);
  }
  function label(b){ return (b.querySelector(".lb")?.textContent || b.textContent.replace(EMO,"")).trim(); }
  function icon(b){ return b.querySelector(".ic")?.textContent || (b.textContent.match(EMO)||[])[1] || "•"; }

  function closeSheet(){ document.querySelector(".mob-sheet")?.remove(); }
  function openSheet(nav, items){
    closeSheet();
    const d = document.createElement("div"); d.className = "mob-sheet";
    d.innerHTML = `<div class="in"><div class="hd"><span>Diğer sekmeler</span><button type="button" aria-label="Kapat">✕</button></div><div class="gr"></div></div>`;
    const gr = d.querySelector(".gr");
    let sep = false;
    items.forEach(b=>{
      const ext = !b.dataset.tab && !b.dataset.t && !b.dataset.main;   // başka panele geçiş
      if(ext && !sep){ sep = true; gr.insertAdjacentHTML("beforeend", `<div class="sep">Diğer paneller</div>`); }
      const x = document.createElement("button"); x.type = "button";
      if(b.classList.contains("on") || b.classList.contains("active")) x.className = "on";
      x.innerHTML = `<span class="ic"></span><span></span>`;
      x.firstChild.textContent = icon(b); x.lastChild.textContent = label(b);
      x.onclick = ()=>{ closeSheet(); b.click(); };
      gr.appendChild(x);
    });
    d.onclick = e=>{ if(e.target === d || e.target.closest(".hd button")) closeSheet(); };
    document.body.appendChild(d);
  }

  function fix(nav){
    const btns = [...nav.children].filter(b=>/^(BUTTON|A)$/.test(b.tagName) && !b.dataset.mobMore);
    // değişiklik yoksa dokunma (sayfa başka yerde güncellenince buton yeniden oluşmasın, dokunuş kaçmasın)
    const sig = mq.matches + "|" + btns.length + "|" + btns.map(b=>b.className.replace(/\s*mob-hid/,"")+b.textContent).join(",");
    if(nav.__mobSig === sig && (!mq.matches || btns.length <= MAX || nav.querySelector(":scope > [data-mob-more]"))) return;
    nav.__mobSig = sig;
    nav.querySelectorAll(":scope > [data-mob-more]").forEach(x=>x.remove());
    btns.forEach(b=>{ b.classList.remove("mob-hid"); if(nav.classList.contains("tabs2") || nav.id==="mainTabs") split(b); });
    if(!mq.matches || btns.length <= MAX) return;
    const keep = MAX - 1;
    const onIx = btns.findIndex(b=>b.classList.contains("on") || b.classList.contains("active"));
    btns.forEach((b,i)=>{ if(i >= keep) b.classList.add("mob-hid"); });
    const more = document.createElement("button");
    more.type = "button"; more.dataset.mobMore = 1;
    const act = onIx >= keep ? btns[onIx] : null;
    more.innerHTML = `<span class="ic"></span><span class="lb"></span>`;
    more.firstChild.textContent = act ? icon(act) : "☰";
    more.lastChild.textContent = act ? label(act) : "Daha";
    if(act) more.classList.add(nav.id==="mainTabs" ? "active" : "on");
    more.onclick = e=>{ e.stopPropagation(); openSheet(nav, btns.slice(keep)); };
    nav.appendChild(more);
  }
  function run(){
    obs.disconnect();
    try{ document.querySelectorAll("nav.bottom, .tabs2, #mainTabs").forEach(fix); }
    finally{ watch(); }
  }
  mq.addEventListener ? mq.addEventListener("change", run) : mq.addListener(run);
  addEventListener("keydown", e=>{ if(e.key === "Escape") closeSheet(); });
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
})();
</script>
<!--/MOBJS-->
