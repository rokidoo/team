<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Yasin · Planım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F2EC; --cream2:#EAE7E1; --card:#FFFDF9;
    --ink:#121212; --ink-soft:#4A4A46; --mut:#8A867E;
    --cobalt:#2F5DFF; --cobalt-s:#E4EBFF;
    --green:#22C55E;  --green-s:#DFF6E7;
    --mustard:#FFC53D;--mustard-s:#FFF3D6;
    --red:#E8402A;    --red-s:#FDE4DF;
    --purple:#A855F7; --purple-s:#F1E4FE;
    --orange:#FF8A00; --orange-s:#FFE9D1;
    --gray-s:#ECEAE4;
    --fh:'Space Grotesk','Plus Jakarta Sans',sans-serif;
    --fb:'Plus Jakarta Sans',sans-serif;
    --fm:'JetBrains Mono',monospace;
    --b:3px solid var(--ink); --b2:2px solid var(--ink);
    --sh:6px 6px 0 var(--ink); --sh-sm:4px 4px 0 var(--ink);
    --r:16px; --r-lg:24px;
    --H:44px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{background:var(--cream);color:var(--ink);min-height:100dvh;font-family:var(--fb)}
  h1,h2,h3{font-family:var(--fh);letter-spacing:-.02em}
  .hidden{display:none!important}
  .mono{font-family:var(--fm)}
  button{font-family:var(--fb)}

  /* genel parçalar */
  .card{background:var(--card);border:var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh-sm)}
  .flabel{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:2px 0 4px}
  .note{font-size:.74rem;color:var(--mut);font-weight:600;margin-top:6px;line-height:1.45}
  .empty{text-align:center;color:var(--mut);font-size:.8rem;font-weight:600;padding:16px 10px;border:2px dashed var(--mut);border-radius:12px;background:var(--cream2)}
  input,textarea,select{width:100%;background:var(--card);border:var(--b2);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:.92rem;margin-bottom:10px;font-family:var(--fb);font-weight:600}
  textarea{resize:vertical;line-height:1.45}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cobalt);box-shadow:var(--sh-sm)}
  input[type=checkbox]{width:auto;margin:0;accent-color:var(--ink)}
  .btn{width:100%;background:var(--cobalt);color:#fff;border:var(--b2);border-radius:12px;padding:12px;font-size:.9rem;font-weight:800;cursor:pointer;box-shadow:var(--sh-sm)}
  .btn:active{transform:translate(2px,2px);box-shadow:none}
  .btn:disabled{opacity:.5}
  .btn.sm{width:auto;padding:8px 12px;font-size:.78rem}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .btn.danger{background:var(--red)}
  .btn.yel{background:var(--mustard);color:var(--ink)}
  .btnrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .btnrow .btn{flex:1 1 auto;width:auto}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .pill{display:inline-flex;align-items:center;gap:4px;border:var(--b2);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:800;background:var(--card);white-space:nowrap}
  .tag{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--ink);border-radius:99px;padding:0 7px;font-size:.62rem;font-weight:800;background:var(--card);white-space:nowrap;line-height:1.6}
  .tag i{width:8px;height:8px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
  .ib{background:var(--card);border:var(--b2);border-radius:10px;min-width:34px;height:34px;padding:0 9px;cursor:pointer;font-weight:800;font-size:.8rem;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
  .ib:active{transform:translate(2px,2px);box-shadow:none}
  .ib.on{background:var(--ink);color:var(--card)}
  .ib.rec{background:var(--red);color:#fff}
  details>summary{cursor:pointer;list-style:none;font-weight:800}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
  details[open]>summary::before{transform:rotate(90deg)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:.82rem;z-index:95;border:var(--b2);box-shadow:var(--sh-sm);max-width:92vw;text-align:center}
  .late{color:var(--red);font-weight:800}

  /* modal */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(18,18,18,.55);display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.modal{align-items:center;padding:20px}}
  .modal .box{background:var(--card);border:var(--b);width:100%;max-width:560px;box-shadow:var(--sh);border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
  @media(min-width:640px){.modal .box{border-radius:20px}}
  .modal h3{font-size:1.05rem;margin-bottom:12px}
  .seg{display:flex;border:var(--b2);border-radius:12px;overflow:hidden;margin-bottom:10px}
  .seg button{flex:1;background:var(--card);border:none;padding:10px 6px;font-weight:800;font-size:.8rem;cursor:pointer}
  .seg button+button{border-left:var(--b2)}
  .seg button.on{background:var(--ink);color:var(--card)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chips button{border:var(--b2);border-radius:99px;background:var(--card);padding:6px 11px;font-weight:800;font-size:.75rem;cursor:pointer}
  .ckrow{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.85rem;margin:4px 0 12px;cursor:pointer}
  .linked{background:var(--cobalt-s);border:var(--b2);border-radius:12px;padding:9px 11px;font-size:.8rem;font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* giriş */
  .auth{max-width:400px;margin:8vh auto 0;padding:0 20px}
  .authcard{background:var(--card);border:var(--b);border-radius:var(--r-lg);padding:26px 22px;box-shadow:var(--sh)}
  .auth .logo{font-family:var(--fh);font-size:1.45rem;font-weight:700;text-align:center;margin-bottom:4px}
  .auth .logo b{color:var(--cobalt)}
  .auth p{color:var(--mut);text-align:center;font-size:.85rem;font-weight:600;margin-bottom:22px}
  .authmsg{font-size:.8rem;font-weight:700;text-align:center;margin-top:12px;color:var(--mut)}
  .authmsg.err{color:var(--red)}
  .switch{text-align:center;margin-top:16px;font-size:.82rem;font-weight:600;color:var(--mut)}
  .switch a{color:var(--cobalt);font-weight:800;cursor:pointer;text-decoration:none}
  .deny{text-align:center;padding:40px 16px}

  /* üst kısım */
  .wrap{max-width:1480px;margin:0 auto;padding:18px 16px 60px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .top .ttl{font-family:var(--fh);font-size:1.45rem;font-weight:700}
  .top .ttl b{color:var(--cobalt)}
  .top .who{margin-left:auto;font-size:.75rem;font-weight:800;color:var(--mut)}
  .top .out{background:var(--card);border:var(--b2);border-radius:10px;padding:7px 12px;font-weight:800;font-size:.75rem;cursor:pointer}
  .plinks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .plinks a{border:var(--b2);border-radius:99px;padding:6px 12px;font-weight:800;font-size:.76rem;text-decoration:none;color:var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink)}
  .tabs2{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tabs2 button{background:var(--card);border:var(--b2);border-radius:99px;padding:8px 14px;font-weight:800;font-size:.8rem;cursor:pointer}
  .tabs2 button.on{background:var(--ink);color:var(--card)}

  /* gün başlığı */
  .dayhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .dayhead .dl{font-family:var(--fh);font-weight:700;font-size:1.3rem;margin-right:4px}
  .dayhead input[type=date]{width:auto;margin:0;padding:7px 10px;font-size:.85rem}
  .dayhead .notday{background:var(--orange-s);border:var(--b2);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:800}
  .dayhead .isday{background:var(--green-s);border:var(--b2);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:800}
  .savest{font-size:.7rem;font-weight:800;color:var(--mut);margin-left:auto}

  /* tek satır giriş */
  .qline{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .qline .seg{margin:0;flex:0 0 auto}
  .qline .seg button{padding:9px 10px;font-size:.74rem}
  .qline input{margin:0;flex:1 1 260px;min-width:0}
  .qhelp{font-size:.7rem;color:var(--mut);font-weight:600;margin:-8px 0 12px}
  .qhelp code{font-family:var(--fm);background:var(--cream2);border-radius:5px;padding:0 4px}

  /* haftalık bakış */
  .wkbtn{width:100%;text-align:left;background:var(--card);border:var(--b2);border-radius:12px;padding:10px 14px;font-weight:800;font-size:.86rem;cursor:pointer;box-shadow:var(--sh-sm);margin-bottom:12px;display:flex;gap:10px;align-items:center}
  .wkbtn .s{margin-left:auto;font-size:.72rem;color:var(--mut)}
  .wkp{border:var(--b);border-radius:var(--r);background:var(--card);box-shadow:var(--sh-sm);padding:12px;margin-bottom:16px}
  .wkph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .wkph b{font-family:var(--fh);font-size:1rem}
  .wkph .sp{flex:1}
  .wkg{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .wkd{border:var(--b2);border-radius:12px;background:var(--cream);padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px}
  .wkd.today{background:var(--mustard-s)}
  .wkd.sel{outline:3px solid var(--cobalt);outline-offset:-2px}
  .wkd.sun{background:var(--purple-s)}
  .wkd .h{background:none;border:none;text-align:left;cursor:pointer;font-weight:800;font-size:.82rem;padding:0}
  .wkd .h small{display:block;font-family:var(--fm);font-weight:700;font-size:.66rem;color:var(--mut)}
  .wkd input{margin:0;padding:6px 8px;font-size:.76rem;border-radius:8px}
  .wkd .wb{display:flex;gap:5px;align-items:flex-start;border:1.5px solid var(--ink);border-radius:8px;padding:3px 5px;background:var(--card)}
  .wkd .wb.ok{background:var(--green-s)} .wkd .wb.miss{background:var(--red-s)}
  .wkd .wtk{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;cursor:pointer;background:var(--card)}
  .wkd .wb.ok .wtk{background:var(--green);color:#fff}
  .wkd .wtx{background:none;border:none;padding:0;text-align:left;cursor:pointer;font-size:.7rem;font-weight:700;overflow-wrap:anywhere;min-width:0;flex:1;font-family:var(--fb)}
  .wkd .wb.ok .wtx{text-decoration:line-through;opacity:.7}
  .wkd .wtx .k{font-family:var(--fm);font-size:.62rem;color:var(--mut);display:block;text-decoration:none}
  .wkd .tot{font-family:var(--fm);font-size:.64rem;color:var(--ink-soft);font-weight:700}
  .wkd .add{background:none;border:1.5px dashed var(--mut);border-radius:8px;padding:4px;font-size:.7rem;font-weight:800;color:var(--ink-soft);cursor:pointer}

  /* üç kolon */
  .g3{display:grid;gap:16px;align-items:start;grid-template-columns:minmax(0,1fr);grid-template-areas:"left" "center" "right"}
  @media(min-width:960px){.g3{grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"left left" "center right"}}
  @media(min-width:1240px){.g3{grid-template-columns:290px minmax(0,1fr) 330px;grid-template-areas:"left center right"}}
  .cl{grid-area:left;min-width:0} .cc{grid-area:center;min-width:0} .cr{grid-area:right;min-width:0;display:flex;flex-direction:column;gap:14px}
  @media(min-width:1240px){.cl{position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto;padding-right:4px}}
  .ptitle{font-family:var(--fh);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ptitle .cnt{background:var(--ink);color:var(--card);border-radius:99px;padding:0 8px;font-size:.66rem;font-family:var(--fm)}
  .ptitle .sp{flex:1}
  .lwrap>summary.ptitle{list-style:none;flex-wrap:wrap}
  .lwrap>summary.ptitle::before{content:none}
  @media(min-width:960px){.lwrap>summary{pointer-events:none}}
  @media(max-width:959px){.lwrap{background:var(--card);border:var(--b2);border-radius:14px;padding:10px 12px;box-shadow:var(--sh-sm)} .lwrap>summary.ptitle{margin:0} .lwrap[open]>summary.ptitle{margin-bottom:8px} .lwrap>summary.ptitle::after{content:"▾";margin-left:auto;font-size:.9rem} .lwrap:not([open])>summary.ptitle::after{content:"▸"}}

  /* işler */
  .grp{margin-bottom:10px}
  .grp>.gh{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 5px;color:var(--ink-soft)}
  .grp>.gh.late{color:var(--red)} .grp>.gh.ok{color:#15803d}
  .it .acts2{display:flex;gap:6px;padding:0 9px 8px 41px;flex-wrap:wrap}
  .it .acts2 button{border:1.5px solid var(--ink);border-radius:8px;background:var(--mustard-s);font-size:.7rem;font-weight:800;padding:4px 8px;cursor:pointer}
  .pill.ok{background:var(--green-s)} .pill.bad{background:var(--red-s)}
  .it{border:var(--b2);border-radius:12px;background:var(--card);margin-bottom:6px;overflow:hidden}
  .it .r{display:flex;gap:8px;align-items:flex-start;padding:8px 9px}
  .it .cb{width:24px;height:24px;border:var(--b2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;background:var(--card);cursor:pointer;font-size:.8rem}
  .it.done .cb{background:var(--green);color:#fff}
  .it .t{flex:1;min-width:0;cursor:pointer}
  .it .t b{display:block;font-size:.86rem;font-weight:800;overflow-wrap:anywhere}
  .it.done .t b{text-decoration:line-through;opacity:.65}
  .it .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;align-items:center;font-size:.66rem;font-weight:700;color:var(--mut)}
  .it .x{border-top:1.5px dashed var(--gray-s);padding:8px 9px;background:var(--cream)}
  .st{display:flex;gap:8px;align-items:center;font-size:.8rem;font-weight:700;padding:3px 0}
  .st input[type=checkbox]{width:18px;height:18px}
  .st.ok span{text-decoration:line-through;opacity:.6}
  .st .del{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--mut);font-size:.8rem}
  .addst{display:flex;gap:6px;margin-top:6px}
  .addst input{margin:0;padding:6px 9px;font-size:.8rem}
  .it .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .it .acts button{border:1.5px solid var(--ink);border-radius:8px;background:var(--card);font-size:.7rem;font-weight:800;padding:4px 8px;cursor:pointer}
  .it.team{background:var(--mustard-s)}
  .warnst{background:var(--orange-s);border:1.5px solid var(--ink);border-radius:8px;padding:5px 8px;font-size:.72rem;font-weight:700;margin-top:4px}

  /* çizelge */
  .focus{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .focus input{margin:0;font-family:var(--fh);font-size:1.05rem;font-weight:700}
  .tots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .tots .sp{flex:1}
  .tlw{border:var(--b);border-radius:var(--r);background:var(--card);box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:16px}
  .tlhd{display:grid;grid-template-columns:48px 1fr;border-bottom:var(--b2);background:var(--mustard-s);font-weight:800;font-size:.76rem}
  .tlhd div{padding:8px 8px}
  .tlhd div+div{border-left:1.5px solid var(--ink)}
  .tlb{position:relative;display:grid;grid-template-columns:48px 1fr;overflow-y:auto;max-height:min(74dvh,980px);overscroll-behavior:contain}
  @media(max-width:959px){.tlb{max-height:none;overflow:visible}}
  .tlh{position:relative;height:calc(var(--H) * 32)}
  .tlh span.nx{color:var(--purple)}
  .tlhd .hint{font-weight:600;color:var(--mut);font-size:.7rem}
  .tlh span{position:absolute;right:6px;font-family:var(--fm);font-size:.66rem;font-weight:700;color:var(--mut);transform:translateY(-50%)}
  .tlh span:first-child{transform:none}
  .tlc{position:relative;height:calc(var(--H) * 32);border-left:1.5px solid var(--ink);touch-action:pan-y;cursor:crosshair;
    background-image:linear-gradient(to bottom, var(--gray-s) 1px, transparent 1px),linear-gradient(to bottom, rgba(0,0,0,.035) 1px, transparent 1px);
    background-size:100% var(--H),100% calc(var(--H) / 2)}
  .tlh span.last{transform:translateY(-100%)}
  .tlb{padding-bottom:4px}
  .sleep{display:inline-flex;align-items:center;gap:5px;border:var(--b2);border-radius:99px;padding:2px 4px 2px 10px;font-size:.72rem;font-weight:800;background:var(--purple-s);white-space:nowrap}
  .sleep input{width:92px;margin:0;padding:3px 6px;font-size:.8rem;border-radius:99px;text-align:center;font-family:var(--fm)}
  .sleep b{font-family:var(--fm);padding-right:6px}
  @media(max-width:959px){ .sleep input{width:118px;padding:3px 4px} .sleep input::-webkit-calendar-picker-indicator{margin-left:0;padding:0} }
  @media(max-width:420px){ .sleep{flex-wrap:wrap;border-radius:14px;padding:4px 8px;row-gap:4px} }
  .vfab{position:fixed;right:22px;bottom:24px;z-index:70;width:62px;height:62px;border-radius:50%;border:var(--b);background:var(--mustard);font-size:1.6rem;cursor:pointer;box-shadow:var(--sh)}
  .vlog{white-space:pre-wrap;font-family:var(--fm);font-size:.66rem;background:var(--cream2);border-radius:8px;padding:8px;margin-top:6px;max-height:220px;overflow:auto}
  .vfab:active{transform:translate(3px,3px);box-shadow:none}
  .vfab.rec{background:var(--red);color:#fff;animation:vpulse 1.2s infinite}
  @keyframes vpulse{50%{box-shadow:0 0 0 10px rgba(232,64,42,.25)}}
  .vpanel{position:fixed;right:22px;bottom:98px;z-index:70;max-width:min(420px,calc(100vw - 44px));background:var(--ink);color:#fff;border:var(--b2);border-radius:14px;padding:10px 14px;font-weight:700;font-size:.85rem;box-shadow:var(--sh-sm)}
  @media(max-width:959px){ #toastHost .toast{bottom:calc(170px + env(safe-area-inset-bottom))!important}
    .vfab{bottom:calc(96px + env(safe-area-inset-bottom));right:16px} .vpanel{bottom:calc(168px + env(safe-area-inset-bottom));right:16px} }
  .extbg{position:absolute;left:0;right:0;background:rgba(168,85,247,.07);border-top:2px dashed var(--purple);pointer-events:none}
  .nday{position:absolute;right:6px;margin-top:3px;font-size:.64rem;font-weight:800;color:var(--purple);pointer-events:none;z-index:1}
  .bk{position:absolute;left:3px;right:3px;border:2px solid var(--ink);border-radius:8px;padding:2px 6px 2px 36px;overflow:hidden;cursor:pointer;font-size:.72rem;line-height:1.25;z-index:2;background:var(--card)}
  .bk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .bk b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk .tm{display:block;font-family:var(--fm);font-size:.62rem;color:var(--ink-soft);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk .ar{font-size:.6rem;font-weight:800;color:var(--ink-soft)}
  .bk .tick{position:absolute;left:9px;top:3px;width:22px;height:22px;border:var(--b2);border-radius:6px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;cursor:pointer;z-index:3}
  .bk.short .tick{top:50%;transform:translateY(-50%);width:18px;height:18px;font-size:.7rem}
  .bk.ok{background:var(--green-s)} .bk.ok .tick{background:var(--green);color:#fff} .bk.ok b{text-decoration:line-through;opacity:.7}
  .bk.miss{background:var(--red-s)}
  .bk.nx{opacity:.85}
  .bk.short{padding-top:0;padding-bottom:0} .bk.short .ar,.bk.short .tm{display:none} .bk.mid .ar{display:none}

const DEMO_KEY="ys-demo-v1";
function demoPersist(){ if(!DEMO) return; try{ localStorage.setItem(DEMO_KEY, JSON.stringify({days:S.days,items:S.items,blocks:S.blocks,set:S.set,reviews:S.reviews,team:S.team})); }catch(e){ toast("Kayıt saklanamadı. Yedeği indir."); } }
async function fetchAll(table, build){
  let out=[], from=0;
  while(true){ let q=sb.from(table).select("*"); if(build) q=build(q); const {data,error}=await q.range(from,from+999); if(error) throw error; out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  return out;
}
async function ins(table,row){
  if(DEMO){ const r={id:uid(),created_at:nowIso(),...row}; setTimeout(demoPersist); return r; }
  const {data,error}=await sb.from(table).insert(row).select().single(); if(error) throw error; return data;
}
async function insMany(table,rows){
  if(!rows.length) return [];
  if(DEMO){ setTimeout(demoPersist); return rows.map(r=>({id:r.id||uid(),created_at:nowIso(),...r})); }
  const out=[]; for(let i=0;i<rows.length;i+=400){ const {data,error}=await sb.from(table).insert(rows.slice(i,i+400)).select(); if(error) throw error; out.push(...data); } return out;
}
async function upd(table,id,patch){
  if(DEMO){ setTimeout(demoPersist); return; }
  const {error}=await sb.from(table).update(patch).eq("id",id); if(error) throw error;
}
async function del(table,id){
  if(DEMO){ setTimeout(demoPersist); return; }
  const {error}=await sb.from(table).delete().eq("id",id); if(error) throw error;
}
async function saveDay(d, patch){
  const cur=dayRow(d); const row={...cur, ...patch, owner_id:S.owner, day:d, updated_at:nowIso()};
  S.days=S.days.filter(x=>x.day!==d).concat(row);
  if(DEMO){ demoPersist(); return; }
  const {error}=await sb.from("ys_days").upsert(row,{onConflict:"owner_id,day"}); if(error) throw error;

async function saveSet(key, value){
  if(key.startsWith("review:")) S.reviews[key.slice(7)]=value; else S.set[key]=value;

  const {error}=await sb.from("ys_settings").upsert({owner_id:S.owner,key,value,updated_at:nowIso()},{onConflict:"owner_id,key"}); if(error) throw error;
}

  await safe(async()=>{ const [docs,reads]=await Promise.all([fetchAll("docs",q=>q.select("key,version")), fetchAll("doc_reads")]);

const DAY_H0 = 6, DAY_H1 = 21;
function sumMins(list){ return list.reduce((s,b)=>s+dur(b),0); }
const work = b=>!isPersonal(b.area);
function dayTotals(d){
  const B=blocksOn(d), W=B.filter(work);
  const plan=sumMins(W), done=sumMins(W.filter(b=>b.done)), personal=sumMins(B.filter(b=>!work(b)));
  return {plan, done, left:plan-done, personal, nP:B.length, nDone:W.filter(b=>b.done).length, nW:W.length};
}

function hourPx(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--H"))||44; }
function weekLabel(m){ return `${trShort(m)} – ${trShort(addDays(m,6))}${m===monday(trToday())?" · bu hafta":""}`; }
const whenTxt = b=>`${b.day===trToday()?"Bugün":trShort(b.day)+" "+WDS[wdIdx(b.day)]} ${fm(b.start_min)}–${fm(b.end_min)}`;

/* ---------- çizelge ---------- */
function tlRange(d){ let h0=DAY_H0, h1=DAY_H1; blocksOn(d).forEach(b=>{ h0=Math.min(h0,Math.floor(b.start_min/60)); h1=Math.max(h1,Math.ceil(b.end_min/60)); }); return [h0,h1]; }
function blockBox(b, h0){
  const H=hourPx(); const s=b.start_min-h0*60, e=b.end_min-h0*60; const hgt=Math.max((e-s)/60*H-2,14);
  const miss=!b.done && b.day<trToday() && work(b);
  return `<div class="bk ${b.done?"ok":""} ${miss?"miss":""} ${hgt<30?"short":hgt<50?"mid":""}" data-bk="${b.id}" style="--c:${areaColor(b.area)};top:${s/60*H}px;height:${hgt}px" title="${esc(fm(b.start_min)+"–"+fm(b.end_min)+" "+(b.title||""))}">
    <span class="tick" data-tick="${b.id}" role="checkbox" aria-checked="${b.done?"true":"false"}" aria-label="Yapıldı">${b.done?"✓":""}</span>
    <b>${esc(b.title||"(başlıksız)")}</b><span class="tm">${fm(b.start_min)}–${fm(b.end_min)} · ${hTxt(dur(b))}${b.done?" · yapıldı":miss?" · yapılmadı":""}</span>${b.area?`<div class="ar">${esc(b.area)}${b.project?" · "+esc(b.project):""}</div>`:""}</div>`;
}
function timelineHtml(d){
  const H=hourPx(), [h0,h1]=tlRange(d), hgt=(h1-h0)*H;
  const hours=[...Array(h1-h0+1)].map((_,i)=>`<span style="top:${i*H}px" class="${i===h1-h0?"last":""}">${pad(h0+i)}:00</span>`).join("");
  const nm=nowMin();
  const now = d===trToday()&&nm>=h0*60&&nm<=h1*60 ? `<div class="nowl" style="top:${(nm-h0*60)/60*H}px"></div>` : "";
  return `<div class="tlh" style="height:${hgt}px">${hours}</div><div class="tlc" data-col="plan" data-h0="${h0}" data-h1="${h1}" style="height:${hgt}px">${blocksOn(d).map(b=>blockBox(b,h0)).join("")}${now}</div>`;
}
function bindTimeline(){
  const H=hourPx();
  document.querySelectorAll(".tlc").forEach(colEl=>{
    const h0=+colEl.dataset.h0, h1=+colEl.dataset.h1;
    const minAt=ev=>{ const r=colEl.getBoundingClientRect(); const y=Math.max(0,Math.min(r.height-1,ev.clientY-r.top)); return Math.min(h0*60+Math.floor(y/H*2)*30, h1*60-30); };
    const openAt=(s,e)=>openEditor({day:S.day, start_min:s, end_min:Math.min(e,1440)});
    let drag=null;
    // fare: tıkla = 1 saatlik plan · sürükle = aralık
    colEl.addEventListener("pointerdown",ev=>{
      if(ev.pointerType!=="mouse"||ev.button!==0||ev.target.closest(".bk")) return;
      ev.preventDefault(); const m=minAt(ev); drag={a:m,b:m,moved:false};
      const g=document.createElement("div"); g.className="selx"; colEl.appendChild(g); drag.g=g;
      drag.paint=()=>{ const s=Math.min(drag.a,drag.b), e=drag.moved?Math.max(drag.a,drag.b)+30:s+60; g.style.top=(s-h0*60)/60*H+"px"; g.style.height=(e-s)/60*H+"px"; g.textContent=`${fm(s)}–${fm(Math.min(e,1440))}`; };
      drag.paint(); colEl.setPointerCapture(ev.pointerId);
    });
    colEl.addEventListener("pointermove",ev=>{ if(!drag) return; const m=minAt(ev); if(m!==drag.a) drag.moved=true; drag.b=m; drag.paint(); });
    colEl.addEventListener("pointerup",()=>{ if(!drag) return; const s=Math.min(drag.a,drag.b), e=drag.moved?Math.max(drag.a,drag.b)+30:s+60; drag.g.remove(); drag=null; openAt(s,e); });
    colEl.addEventListener("pointercancel",()=>{ if(drag){ drag.g.remove(); drag=null; } });
    // dokunmatik: boş saate tek dokunuş = o saate plan. Kaydırma "click" üretmez, yanlışlıkla açılmaz.
    colEl.addEventListener("click",ev=>{
      if(ev.target.closest(".bk")) return;
      if(ev.pointerType==="mouse" || (ev.pointerType===undefined && matchMedia("(hover:hover)").matches && !("ontouchstart" in window))) return;
      const m=minAt(ev); openAt(m,m+60);
    });
  });
  document.querySelectorAll("[data-tick]").forEach(x=>x.addEventListener("click",ev=>{ ev.stopPropagation(); toggleBlock(S.blocks.find(k=>k.id===x.dataset.tick)); }));
  document.querySelectorAll(".bk[data-bk]").forEach(b=>b.addEventListener("click",ev=>{ if(ev.target.closest("[data-tick]")) return; ev.stopPropagation(); const x=S.blocks.find(k=>k.id===b.dataset.bk); if(x) openEditor(x); }));
}

function leftHtml(){
  const t=trToday(), hz=addDays(t,7), d=S.day;
  const undone=S.blocks.filter(b=>!b.done&&work(b));
  const byT=(a,b)=>a.day<b.day?-1:a.day>b.day?1:a.start_min-b.start_min;
  const late=undone.filter(b=>b.day<t).sort(byT), tod=undone.filter(b=>b.day===t).sort(byT), nxt=undone.filter(b=>b.day>t&&b.day<=hz).sort(byT), far=undone.filter(b=>b.day>hz).length;
  const grp=(list,lbl,cls,acts)=>list.length?`<div class="grp"><div class="gh ${cls||""}">${lbl} · ${list.length}</div>${list.map(b=>blkRow(b,{acts})).join("")}</div>`:"";
  const doneDay=blocksOn(d).filter(b=>b.done);
  const wm=monday(d), we=addDays(wm,6); const WB=S.blocks.filter(b=>b.day>=wm&&b.day<=we&&work(b)); const wDone=WB.filter(b=>b.done).length;
  const mine=myTeamTasks();

/* ---------- tek satır giriş ---------- */
function matchArea(tag){
  const n=norm(tag); if(!n) return null;
  const direct=S.set.areas.find(a=>norm(a.k)===n) || S.set.areas.find(a=>norm(a.k).startsWith(n)) || S.set.areas.find(a=>norm(a.k).split(/[\s,/]+/).some(w=>w&&w.startsWith(n)));
  if(direct) return direct.k;
  if(n in ALIAS){ const def=DEF_AREAS[ALIAS[n]].k; if(areaOf(def)) return def; }
  return null;
}
function matchProject(tag){
  const n=norm(tag); if(!n) return null;
  return S.set.projects.find(p=>norm(p)===n) || S.set.projects.find(p=>norm(p).replace(/\s+/g,"").startsWith(n.replace(/\s+/g,""))) || null;
}
function parseLine(text){
  let s=String(text||"").trim(); const r={area:null, project:null, newProject:null, steps:[]};
  s=s.replace(/(^|\s)#([^\s#@]+)/g,(m,sp,tag)=>{ const a=matchArea(tag); if(a){ r.area=a; return sp; } return m; });
  s=s.replace(/(^|\s)@([^\s#@]+)/g,(m,sp,tag)=>{ const p=matchProject(tag); if(p) r.project=p; else { r.project=tag; r.newProject=tag; } return sp; });
  const tm=s.match(/^(\d{1,2})(?:[:.](\d{2}))?\s*[-–—]\s*(\d{1,2})(?:[:.](\d{2}))?\s+(.*)$/);
  if(tm){ const a=+tm[1]*60+(+tm[2]||0), b=+tm[3]*60+(+tm[4]||0);
    if(+tm[1]>24||+tm[3]>24||(+tm[2]||0)>59||(+tm[4]||0)>59||a>=1440||b>1440) return {...r,error:"Saat anlaşılmadı. Örnek: 14-16, 9.30-11 ya da 22-5"};
    if(a===b) return {...r,error:"Başlangıç ve bitiş aynı olamaz."};
    r.start=a; r.end=b>a?b:b+1440; s=tm[5]; }          // 22-5 → 22:00'den ertesi gün 05:00'e
  const parts=s.split(/\s+>\s+/).map(x=>x.trim()).filter(Boolean);
  r.title=(parts.shift()||"").replace(/\s+/g," ").trim(); r.steps=parts.map(t=>({t,done:false}));
  if(!r.area && /\b(uyku|spor|mola)\b/i.test(norm(r.title))) r.area=matchArea("kisisel");
  return r;
}
// Uyku: "uyku 23:30-7", "23'te yattım 7'de kalktım", "11'den 7'ye uyudum", "7 saat uyudum".
// Kayıt, uyanılan günün satırına yazılır (bu sabaha kadar olan uyku).
const hhmm=(h,m)=>`${pad(h%24)}:${pad(m||0)}`;
const bedH=h=>h===12?0:(h>=6&&h<=11?h+12:h);          // "11'de yattım" = 23:00, "12'de" = 00:00, "1'de" = 01:00
function sleepSpan(f,t){ const a=mins(f), b=mins(t); if(a==null||b==null) return null; let d=b-a; if(d<=0) d+=1440; return Math.round(d/60*4)/4; }
function sleepOf(text){
  const n=norm(text).replace(/[’']/g,"").replace(/(\d)\.(\d{2})\b/g,"$1:$2");
  let m=n.match(/^(?:uyku|uyudum)\s*:?\s*(\d{1,2})(?::(\d{2}))?\s*[-–]\s*(\d{1,2})(?::(\d{2}))?$/)
     || n.match(/(\d{1,2})(?::(\d{2}))?\s*(?:-|den|dan|ten|tan)\s*(?:sabah\s*)?(\d{1,2})(?::(\d{2}))?\s*(?:ye|ya|e|a)?\s*(?:kadar\s*)?(?:uyudum|uyku)/);
  if(m) return {from:hhmm(bedH(+m[1]),+m[2]), to:hhmm(+m[3],+m[4])};
  const bed=n.match(/(\d{1,2})(?::(\d{2}))?\s*(?:de|da|te|ta)?\s*(?:gibi\s*)?(?:yatt|uyudum\b(?!.*saat))/), wake=n.match(/(\d{1,2})(?::(\d{2}))?\s*(?:de|da|te|ta)?\s*(?:gibi\s*)?(?:kalkt|uyand)/);
  if(bed||wake) return {from:bed?hhmm(bedH(+bed[1]),+bed[2]):undefined, to:wake?hhmm(+wake[1],+wake[2]):undefined};
  m=n.match(/^(?:uyku|uyudum)\s*:?\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:sa|saat)?$/) || n.match(/^(\d{1,2}(?:[.,]\d+)?)\s*(?:sa|saat)?\s*(?:uyku|uyudum)$/)
    || n.match(/(\d{1,2}(?:[.,]\d+)?|bir|iki|uc|dort|bes|alti|yedi|sekiz|dokuz|on)\s*(bucuk)?\s*saat\s*(?:kadar\s*)?(?:uyudum|uyku)/);

  let v=W[m[1]]??parseFloat(String(m[1]).replace(",",".")); if(m[2]) v+=.5;

const VOICE_WD={pazartesi:0,sali:1,carsamba:2,persembe:3,cuma:4,cumartesi:5,pazar:6};
function parseVoice(raw){
  let lo=raw.toLocaleLowerCase("tr").replace(/[’']/g,"").replace(/(\d)\.(\d{2})\b/g,"$1:$2").replace(/\s+/g," ").trim();
  const n=norm(lo); let day=S.day===trToday()?trToday():S.day, dayWord=null;
  if(/\bobur gun\b/.test(n)){ day=addDays(trToday(),2); dayWord=/öbür gün/; }
  else if(/\byarin\b/.test(n)){ day=addDays(trToday(),1); dayWord=/yarın/; }
  else if(/\bbugun\b/.test(n)){ day=trToday(); dayWord=/bugün/; }
  else { for(const [w,i] of Object.entries(VOICE_WD)){ const re=new RegExp("\\b"+w+"\\b"); if(re.test(n)){ const t=trToday(); let d=addDays(monday(t),i); if(d<=t) d=addDays(d,7); day=d; dayWord=new RegExp(lo.split(" ").find(x=>norm(x).startsWith(w))||w); break; } } }
  const pm=/(ogleden sonra|aksam|ogle)/.test(n), am=/\bsabah\b/.test(n);
  const fixH=h=>{ if(pm&&h<12) return h+12; if(!am&&h>=1&&h<=6) return h+12; return h; };
  let s=null, e=null, m;
  // aralık: 14-16, 14ten 16ya, 10 ile 12 arası, 9:30 dan 11e kadar
  m=lo.match(/(?:saat\s*)?\b(\d{1,2})(?::(\d{2}))?(?!\d)\s*(?:-|–|ile|ila|den|dan|ten|tan)\s*(\d{1,2})(?::(\d{2}))?(?!\d)(?:ye|ya|e|a)?(?:\s*(?:kadar|arasında|arası))?/);
  if(m){ let a=fixH(+m[1]), b=fixH(+m[3]); if(b<=a&&b<12) b+=12; s=a*60+(+m[2]||0); e=b*60+(+m[4]||0); }
  else {
    m=lo.match(/saat\s*(\d{1,2})(?::(\d{2}))?(?!\d)(?:de|da|te|ta|e|a)?\b/) || lo.match(/\b(\d{1,2}):(\d{2})(?:de|da|te|ta|e|a)?\b/) || lo.match(/\b(\d{1,2})(?:de|da|te|ta)\b/);
    if(m){ s=fixH(+m[1])*60+(+m[2]||0); let len=60; const dm=lo.match(/(\d{1,3})\s*dakika/); if(dm) len=+dm[1]; else if(/yarım saat/.test(lo)) len=30; else { const hm=lo.match(/(\d)\s*saat(?:lik)?\b(?!\s*\d)/); if(hm&&hm.index!==m.index) len=+hm[1]*60; } e=s+len; }
  }
  if(s==null||s<0||s>=1440||!(e>s)) return null;
  e=Math.min(e,1440);
  let title=lo.replace(m[0]," ");
  if(dayWord) title=title.replace(dayWord," ");
  title=title.replace(/(?<!\p{L})(öğleden sonra|akşam|sabah|öğlen|öğle|saat|arasında|arası|kadar|ekler misin|ekle|planla|plana|koy|lütfen)(?!\p{L})/gu," ").replace(/\d{1,3}\s*dakika(lık)?|yarım saat(lik)?/g," ").replace(/\s+/g," ").replace(/^[\s,.:;-]+|[\s,.:;-]+$/g,"").trim();
  title=title?title.charAt(0).toLocaleUpperCase("tr")+title.slice(1):"Sesli plan";
  // alan: cümlede "reklam, stok, finans…" gibi bilinen bir kelime varsa (ekleriyle birlikte)
  let area=null; for(const w of norm(title).split(/[^a-z0-9]+/)){ const k=Object.keys(ALIAS).find(a=>w.startsWith(a)); if(k){ area=matchArea(k); if(area) break; } }
  return {day, start_min:s, end_min:e, title, area};
}
async function handleVoice(text){
  const sv=sleepOf(text);
  if(sv){ const d=/\bdun\b/.test(norm(text))?addDays(trToday(),-1):S.day; await setSleep(d,sv); return; }
  const p=parseVoice(text);
  if(p){
    const ok=await saveBlock({day:p.day, start_min:p.start_min, end_min:p.end_min, title:p.title, area:p.area, project:null, done:false}, null);
    if(ok) toast(`🎤 Plana eklendi: ${p.day===trToday()?"bugün":trShort(p.day)} ${fm(p.start_min)}–${fm(p.end_min)} · ${p.title}`);
    else { await addVoiceNote(text); }
    return;
  }
  await addVoiceNote(text);
}
if(DEMO) window.__ys={parseVoice,sleepOf,handleVoice};   // yalnız demo testleri için
async function addVoiceNote(text){
  const d=S.day, cur=dayRow(d).note||"";
  const line=`• ${fm(nowMin())} ${text.charAt(0).toLocaleUpperCase("tr")+text.slice(1)}`;
  try{ await saveDay(d,{note:cur?cur.replace(/\s*$/,"")+"\n"+line:line}); rerender(); toast("🎤 Hızlı nota eklendi 📝"); }catch(e){ fail(e); }
}

/* ---------- haftalık şablon ---------- */
async function applyTemplate(m){
  const tpl=S.set.template||{}; const days=[...Array(7)].map((_,i)=>addDays(m,i));
  const plan=[]; let focusN=0, skip=0, bad=0;
  const clash=(d,s,e)=>overlapOf(d,s,e)||plan.some(q=>q.day===d&&s<q.end_min&&e>q.start_min);
  days.forEach((d,i)=>{ const t=tpl[i]||{};
    if(t.focus && !dayRow(d).focus) focusN++;
    String(t.blocks||"").split("\n").map(x=>x.trim()).filter(Boolean).forEach(line=>{ const p=parseLine(line);
      if(p.error||p.start==null){ bad++; return; }
      const segs=p.end<=1440?[[d,p.start,p.end]]:[[d,p.start,1440],[addDays(d,1),0,p.end-1440]];
      if(segs.some(([dd,s,e])=>clash(dd,s,e))){ skip++; return; }
      segs.forEach(([dd,s,e])=>plan.push({owner_id:S.owner, day:dd, kind:"plan", start_min:s, end_min:e, title:p.title, area:p.area, project:p.project, item_id:null, plan_id:null, done:false})); }); });
  if(!focusN && !plan.length){ toast(Object.keys(tpl).length?"Uygulanacak bir şey yok (odaklar dolu ya da planlar çakışıyor).":"Önce Ayarlar → Haftalık şablon'u doldur."); if(!Object.keys(tpl).length){ S.tab="ayar"; render(); } return; }
  if(!confirm(`${weekLabel(m)} haftasına şablon uygulansın mı?\n• ${focusN} güne odak yazılacak (dolu odaklar değişmez)\n• ${plan.length} plan eklenecek${skip?`\n• ${skip} satır çakıştığı için atlanacak`:""}${bad?`\n• ${bad} satır anlaşılmadı`:""}`)) return;
  try{
    for(let i=0;i<7;i++){ const d=days[i], f=tpl[i]?.focus; if(f && !dayRow(d).focus) await saveDay(d,{focus:f}); }
    const rows=await insMany("ys_blocks",plan); S.blocks.push(...rows); rerender(); toast("Şablon uygulandı ✓");
  }catch(e){ fail(e); }
}

  const pReal=sumMins(B.filter(b=>!work(b)));

  const sl=days.map(d=>dayRow(d).sleep).filter(v=>v!=null); const slAvg=sl.length?Math.round(sl.reduce((a,b)=>a+ +b,0)/sl.length*10)/10:null;
  const maxV=Math.max(1,...Object.values(A).map(v=>Math.max(v.plan,v.real)));

function downloadBackup(){
  const data={format:"yasin-planlayici", version:1, exported_at:nowIso(), days:S.days, items:S.items, blocks:S.blocks, settings:{...S.set}, reviews:S.reviews};
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})); a.download=`yasin-plan-yedek-${trToday()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Yedek indirildi ✓");
}
async function importFile(file){
  let j; try{ j=JSON.parse(await file.text()); }catch(e){ toast("Dosya okunamadı (JSON değil)."); return; }
  const info=$("bkInfo");
  const days=[], items=[], blocks=[]; let skip=0; const newAreas=[];
  const own={owner_id:S.owner};
  const areaFix=a=>{ if(!a) return null; if(areaOf(a)||newAreas.some(x=>x.k===a)) return a; const m=matchArea(a); if(m) return m; newAreas.push({k:a,c:"#7C8CFF",sub:""}); return a; };
  const clash=(d,s,e)=>overlapOf(d,s,e)||blocks.some(b=>b.day===d&&s<b.end_min&&e>b.start_min);
  if(j.format==="yasin-planlayici"){
    (j.days||[]).forEach(d=>days.push({...d,...own}));
    const idMap={};
    (j.items||[]).forEach(x=>{ if(S.items.some(y=>y.id===x.id)) return; const id=uid(); idMap[x.id]=id; items.push({...x,...own,id}); });
    (j.blocks||[]).forEach(b=>{ if(S.blocks.some(y=>y.id===b.id)){ skip++; return; } if(clash(b.day,b.start_min,b.end_min)){ skip++; return; } blocks.push({...b,...own,id:uid(),kind:"plan",done:!!b.done,done_at:b.done_at||null,item_id:b.item_id?(idMap[b.item_id]||null):null,plan_id:null}); });
  }else if(j.days && Array.isArray(j.quick)){
    Object.entries(j.days).forEach(([d,v])=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      const ck={}; (v.checks||[]).forEach(c=>{ if(c.done) ck[c.text]=true; });
      if(v.focus||v.notes||v.resume||v.outcome||Object.keys(ck).length) days.push({...own, day:d, focus:v.focus||"", note:v.notes||"", resume:v.resume||"", outcome:v.outcome||"", checks:ck});
      // önizlemede plan + gerçek ayrıydı; burada tek plan var: gerçek kayıt = yapılmış plan
      (v.blocks||[]).forEach(b=>{ const s=+b.start, e=+b.end; if(!(e>s)||s<0||e>1440){ skip++; return; } if(clash(d,s,e)){ skip++; return; }
        const done=b.kind==="actual"||!!b.done;
        blocks.push({...own,id:uid(),day:d,kind:"plan",start_min:s,end_min:e,title:b.title||"",area:areaFix(b.category),project:null,item_id:null,plan_id:null,done,done_at:done?(b.completedOn?b.completedOn+"T12:00:00Z":d+"T12:00:00Z"):null}); }); });
    j.quick.forEach(q=>{ const done=!!q.done; items.push({...own,id:uid(),title:q.text||"(başlıksız)",area:null,project:null,steps:(q.steps||[]).map(s=>({t:s.text,done:!!s.done})),quick:true,plan_day:null,status:done?"done":"open",done_at:done?(q.completedOn?q.completedOn+"T12:00:00Z":nowIso()):null,done_day:done?(q.completedOn||trToday()):null}); });
  }else{ toast("Bu dosya tanınmadı."); return; }
  if(!confirm(`İçe aktarılacak:\n• ${days.length} gün kaydı (aynı güne ait odak/not üzerine yazılır)\n• ${items.length} iş\n• ${blocks.length} blok${skip?`\n• ${skip} blok çakıştığı ya da zaten olduğu için atlanacak`:""}${newAreas.length?`\n• Yeni alanlar: ${newAreas.map(a=>a.k).join(", ")}`:""}\n\nDevam edilsin mi?`)) return;
  info.textContent="Aktarılıyor…";
  try{
    if(newAreas.length) await saveSet("areas",[...S.set.areas,...newAreas]);
    for(const d of days){ const {owner_id,...rest}=d; await saveDay(d.day,{focus:rest.focus||"",note:rest.note||"",resume:rest.resume||"",outcome:rest.outcome||"",checks:rest.checks||{}}); }
    const I=await insMany("ys_items",items); S.items.push(...I);
    const Bk=await insMany("ys_blocks",blocks); S.blocks.push(...Bk);
    if(j.format==="yasin-planlayici"){ for(const [k,v] of Object.entries(j.settings||{})) if(["projects","checks","template"].includes(k)&&v) await saveSet(k,v); for(const [k,v] of Object.entries(j.reviews||{})) await saveSet("review:"+k,v); }
    info.textContent=`✓ Aktarıldı: ${days.length} gün, ${I.length} iş, ${Bk.length} blok.`; toast("İçe aktarma tamam ✓");
  }catch(e){ info.textContent=""; fail(e); }
}

  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
}

$("goLogin2").onclick=()=>{ authView("login"); $("authMsg").textContent=""; };
$("btnLogin").onclick=async ()=>{
  if(DEMO) return; $("btnLogin").disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$("liEmail").value.trim(), password:$("liPass").value});
  $("btnLogin").disabled=false;
  if(error){ showAuth("Giriş başarısız: "+error.message,true); return; }

$("btnForgot").onclick=async ()=>{

  $("btnForgot").disabled=true;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  $("btnForgot").disabled=false;
  if(error){ showAuth("Gönderilemedi: "+error.message,true); return; }
  showAuth("Bağlantı gönderildi ✓ E-postanı kontrol et.",false);

$("btnReset").onclick=async ()=>{
  const p1=$("rsPass").value, p2=$("rsPass2").value;
  if(p1.length<6){ showAuth("Şifre en az 6 karakter olmalı.",true); return; }

  if(error){ showAuth("Şifre kaydedilemedi: "+error.message,true); return; }

<!--MOBJS-->
<script id="mobJs">
/* ===== MOBİL: alt menü en fazla 5 buton (4 sekme + "Daha"), sekme etiketleri ikon + yazı ===== */
(()=>{
  // uygulama (ana ekran) açılınca en son kullanılan panele dönsün
  try{ const m = location.pathname.match(/^\/(yonetim|operasyon|kreatif|reklam|erdem-kus|yasin)\//); if(m) localStorage.setItem("remaks_last", "/"+m[1]+"/"); }catch(e){}
  const mq = matchMedia("(max-width:959px)"), MAX = 5;
  const EMO = /^\s*((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍\p{Extended_Pictographic})*)\s*/u;
  const obs = new MutationObserver(run);
  const watch = () => obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:["class"]});

  // "📝 Günlük" → <span class="ic">📝</span><span class="lb">Günlük</span>
  function split(b){
    if(b.dataset.mobSplit || b.querySelector(".ic")) return;
    const t = b.textContent, m = t.match(EMO);
    if(!m) return;
    b.dataset.mobSplit = 1;
    const lb = b.dataset.s || t.slice(m[0].length);
    b.innerHTML = `<span class="ic">${m[1]}</span><span class="lb"></span>`;
    b.querySelector(".lb").textContent = lb;
    if(b.dataset.s) b.title = t.slice(m[0].length);
  }
  function label(b){ return (b.querySelector(".lb")?.textContent || b.textContent.replace(EMO,"")).trim(); }
  function icon(b){ return b.querySelector(".ic")?.textContent || (b.textContent.match(EMO)||[])[1] || "•"; }

  function closeSheet(){ document.querySelector(".mob-sheet")?.remove(); }
  function openSheet(nav, items){
    closeSheet();
    const d = document.createElement("div"); d.className = "mob-sheet";
    d.innerHTML = `<div class="in"><div class="hd"><span>Diğer sekmeler</span><button type="button" aria-label="Kapat">✕</button></div><div class="gr"></div></div>`;
    const gr = d.querySelector(".gr");
    let sep = false;
    items.forEach(b=>{
      const ext = !b.dataset.tab && !b.dataset.t && !b.dataset.main;   // başka panele geçiş
      if(ext && !sep){ sep = true; gr.insertAdjacentHTML("beforeend", `<div class="sep">Diğer paneller</div>`); }
      const x = document.createElement("button"); x.type = "button";
      if(b.classList.contains("on") || b.classList.contains("active")) x.className = "on";
      x.innerHTML = `<span class="ic"></span><span></span>`;
      x.firstChild.textContent = icon(b); x.lastChild.textContent = label(b);
      x.onclick = ()=>{ closeSheet(); b.click(); };
      gr.appendChild(x);
    });
    d.onclick = e=>{ if(e.target === d || e.target.closest(".hd button")) closeSheet(); };
    document.body.appendChild(d);
  }

  function fix(nav){
    const btns = [...nav.children].filter(b=>/^(BUTTON|A)$/.test(b.tagName) && !b.dataset.mobMore);
    // değişiklik yoksa dokunma (sayfa başka yerde güncellenince buton yeniden oluşmasın, dokunuş kaçmasın)
    const sig = mq.matches + "|" + btns.length + "|" + btns.map(b=>b.className.replace(/\s*mob-hid/,"")+b.textContent).join(",");
    if(nav.__mobSig === sig && (!mq.matches || btns.length <= MAX || nav.querySelector(":scope > [data-mob-more]"))) return;
    nav.__mobSig = sig;
    nav.querySelectorAll(":scope > [data-mob-more]").forEach(x=>x.remove());
    btns.forEach(b=>{ b.classList.remove("mob-hid"); if(nav.classList.contains("tabs2") || nav.id==="mainTabs") split(b); });
    if(!mq.matches || btns.length <= MAX) return;
    const keep = MAX - 1;
    const onIx = btns.findIndex(b=>b.classList.contains("on") || b.classList.contains("active"));
    btns.forEach((b,i)=>{ if(i >= keep) b.classList.add("mob-hid"); });
    const more = document.createElement("button");
    more.type = "button"; more.dataset.mobMore = 1;
    const act = onIx >= keep ? btns[onIx] : null;
    more.innerHTML = `<span class="ic"></span><span class="lb"></span>`;
    more.firstChild.textContent = act ? icon(act) : "☰";
    more.lastChild.textContent = act ? label(act) : "Daha";
    if(act) more.classList.add(nav.id==="mainTabs" ? "active" : "on");
    more.onclick = e=>{ e.stopPropagation(); openSheet(nav, btns.slice(keep)); };
    nav.appendChild(more);
  }
  function run(){
    obs.disconnect();
    try{ document.querySelectorAll("nav.bottom, .tabs2, #mainTabs").forEach(fix); }
    finally{ watch(); }
  }
  mq.addEventListener ? mq.addEventListener("change", run) : mq.addListener(run);
  addEventListener("keydown", e=>{ if(e.key === "Escape") closeSheet(); });
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
})();
</script>
<!--/MOBJS-->
</body>
