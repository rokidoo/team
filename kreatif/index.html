<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EC">
<title>uzbionik · Kreatif Performans Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F2EC; --cream2:#EAE7E1; --card:#FFFDF9;
    --ink:#121212; --ink-soft:#4A4A46; --mut:#8A867E;
    --cobalt:#2F5DFF; --cobalt-s:#E4EBFF;
    --green:#22C55E;  --green-s:#DFF6E7;
    --mustard:#FFC53D;--mustard-s:#FFF3D6;
    --red:#E8402A;    --red-s:#FDE4DF;
    --purple:#A855F7; --purple-s:#F1E4FE;
    --orange:#FF8A00; --orange-s:#FFE9D1;
    --gray-s:#ECEAE4;
    --fh:'Space Grotesk','Plus Jakarta Sans',sans-serif;
    --fb:'Plus Jakarta Sans',sans-serif;
    --fm:'JetBrains Mono',monospace;
    --b:3px solid var(--ink); --b2:2px solid var(--ink);
    --sh:6px 6px 0 var(--ink); --sh-sm:4px 4px 0 var(--ink);
    --r:16px; --r-lg:24px;
    --sidew:236px; --sidew-c:74px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    background:var(--cream); color:var(--ink); min-height:100dvh; font-family:var(--fb);
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
  }
  h1,h2,h3{font-family:var(--fh); letter-spacing:-.02em}
  .hidden{display:none!important}
  .mono{font-family:var(--fm)}

  /* ================= SIDEBAR (masaüstü) ================= */
  aside{
    display:none; position:fixed; z-index:50; inset:0 auto 0 0; width:var(--sidew);
    background:var(--card); border-right:var(--b); padding:20px 14px;
    flex-direction:column; gap:6px; transition:width .18s ease;
  }
  aside .brand{
    font-family:var(--fh); font-weight:700; font-size:1.15rem; padding:6px 10px 18px;
    white-space:nowrap; overflow:hidden;
  }
  aside .brand b{color:var(--cobalt)}
  aside .navbtn{
    display:flex; align-items:center; gap:12px; width:100%;
    background:none; border:var(--b2); border-color:transparent; border-radius:12px;
    padding:11px 12px; font-family:var(--fb); font-weight:700; font-size:.9rem;
    color:var(--ink-soft); cursor:pointer; white-space:nowrap; overflow:hidden;
  }
  aside .navbtn .ic{font-size:1.15rem; line-height:1; width:24px; text-align:center; flex-shrink:0}
  aside .navbtn:hover{background:var(--cream2)}
  aside .navbtn.on{
    background:var(--mustard); border:var(--b2); color:var(--ink); box-shadow:var(--sh-sm);
  }
  aside .sp{flex:1}
  aside .user{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-top:var(--b2);
    white-space:nowrap; overflow:hidden;
  }
  aside .user .nm{font-weight:800; font-size:.82rem}
  aside .user .rl{font-size:.68rem; color:var(--mut); font-weight:600}
  aside .collapse{
    position:absolute; top:18px; right:-16px; width:32px; height:32px;
    background:var(--card); border:var(--b2); border-radius:50%; cursor:pointer;
    font-weight:800; font-family:var(--fm); box-shadow:var(--sh-sm); z-index:51;
  }
  @media(min-width:960px){
    aside{display:flex}
    body{padding-left:var(--sidew); padding-bottom:24px}
    nav.bottom{display:none}
    header .mlogo{display:none}
    html.collapsed aside{width:var(--sidew-c)}
    html.collapsed body{padding-left:var(--sidew-c)}
    html.collapsed aside .brand{font-size:0}
    html.collapsed aside .brand::first-letter{font-size:1.15rem}
    html.collapsed aside .navbtn span.lbl, html.collapsed aside .user div{display:none}
  }

  /* ================= TOP BAR ================= */
  header{
    position:sticky; top:0; z-index:40; background:var(--cream);
    border-bottom:var(--b); padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; gap:12px;
  }
  header .mlogo{font-family:var(--fh); font-weight:700; font-size:1.05rem}
  header .mlogo b{color:var(--cobalt)}
  header .sp{flex:1}
  .weekpick{
    background:var(--card); border:var(--b2); color:var(--ink); border-radius:12px;
    padding:9px 12px; font-size:.82rem; font-weight:700; font-family:var(--fb);
    max-width:170px; box-shadow:var(--sh-sm); cursor:pointer;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--mustard);
    border:var(--b2); display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:.85rem; cursor:pointer; box-shadow:var(--sh-sm); flex-shrink:0;
  }

  /* ================= BOTTOM NAV (mobil) ================= */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--card); border-top:var(--b);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--mut); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:.62rem; font-weight:800; padding:6px 2px; border-radius:12px; font-family:var(--fb);
  }
  nav.bottom button .ic{font-size:1.2rem; line-height:1}
  nav.bottom button.on{color:var(--ink); background:var(--mustard); border:var(--b2); box-shadow:var(--sh-sm)}
  @media(min-width:960px){ nav.bottom{display:none} }

  /* ================= GENEL ================= */
  main{padding:20px 16px; max-width:1060px; margin:0 auto}
  @media(min-width:960px){main{padding:28px 32px}}
  h2{font-size:1.35rem; margin-bottom:4px}
  .sub{color:var(--mut); font-size:.82rem; font-weight:600; margin-bottom:18px}
  .sect{margin-bottom:26px}
  .sect h3{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.09em;
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .sect h3 .cnt{
    background:var(--ink); color:var(--card); border-radius:99px; padding:1px 9px;
    font-size:.68rem; font-family:var(--fm);
  }
  .cards{display:grid; gap:14px}
  @media(min-width:1100px){.cards{grid-template-columns:1fr 1fr}}
  .card{
    background:var(--card); border:var(--b); border-radius:var(--r);
    padding:16px; box-shadow:var(--sh);
  }
  .chip{
    display:inline-flex; align-items:center; border-radius:99px;
    padding:4px 11px; font-size:.68rem; font-weight:800; border:var(--b2); color:var(--ink);
    white-space:nowrap;
  }
  .own{
    width:28px;height:28px;border-radius:9px; display:inline-flex; border:var(--b2);
    align-items:center;justify-content:center; font-weight:800; font-size:.8rem; flex-shrink:0;
  }
  .mrow{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px}
  .m{font-size:.78rem; color:var(--ink-soft); font-weight:600}
  .m b{font-family:var(--fm); font-weight:700}
  .empty{
    text-align:center; color:var(--mut); font-size:.85rem; font-weight:600; padding:30px 12px;
    border:2px dashed var(--mut); border-radius:var(--r); background:var(--cream2);
  }
  .cards .empty{grid-column:1/-1}

  /* kreatif kartı */
  .ccard .top{display:flex; gap:12px; align-items:flex-start}
  .ccard .code{font-family:var(--fm); font-size:.72rem; font-weight:700; word-break:break-all; line-height:1.4}
  .ccard .meta{font-size:.72rem; color:var(--mut); font-weight:600; margin-top:4px; display:flex; align-items:center; gap:6px}
  .ccard .thumb{
    width:54px;height:54px;border-radius:12px; background:var(--cream2); border:var(--b2);
    flex-shrink:0; object-fit:cover; display:flex;align-items:center;justify-content:center; font-size:1.35rem;
  }
  .ccard .hook{
    margin-top:12px; font-size:.85rem; font-weight:600; background:var(--card);
    border:var(--b2); border-left-width:6px; padding:9px 11px; border-radius:10px;
  }
  .ccard .reason{margin-top:9px; font-size:.74rem; color:var(--mut); font-weight:600; font-style:italic}

  /* filtre çipleri */
  .filters{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; margin-bottom:10px; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{
    flex-shrink:0; background:var(--card); border:var(--b2); color:var(--ink-soft);
    border-radius:99px; padding:7px 14px; font-size:.75rem; font-weight:800; cursor:pointer; font-family:var(--fb);
  }
  .fchip.on{background:var(--ink); border-color:var(--ink); color:var(--card); box-shadow:var(--sh-sm)}

  /* ekip */
  .trow{display:flex; align-items:center; gap:12px}
  .trow .nm{font-family:var(--fh); font-size:1rem; font-weight:700}
  .trow .bar{flex:1; height:12px; background:var(--cream2); border:var(--b2); border-radius:99px; overflow:hidden}
  .trow .bar i{display:block; height:100%}
  .trow .wn{font-family:var(--fm); font-weight:700; font-size:1.05rem}
  .tstats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
  .tstat{background:var(--cream2); border:var(--b2); border-radius:12px; padding:10px 6px; text-align:center}
  .tstat b{display:block; font-size:1.15rem; font-family:var(--fm)}
  .tstat span{font-size:.62rem; color:var(--ink-soft); font-weight:700}

  /* finans */
  .tblwrap{overflow-x:auto; border:var(--b); border-radius:var(--r); background:var(--card); box-shadow:var(--sh)}
  table{border-collapse:collapse; width:100%; font-size:.78rem; min-width:600px}
  th,td{padding:10px 12px; text-align:right; border-bottom:var(--b2); white-space:nowrap}
  th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--card)}
  th{font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; background:var(--mustard-s)}
  td{font-family:var(--fm); font-weight:500}
  td:first-child{font-family:var(--fb); font-weight:700}
  tr:last-child td{border-bottom:none}
  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px}
  @media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--card); border:var(--b); border-radius:var(--r); padding:14px; box-shadow:var(--sh-sm)}
  .kpi b{display:block; font-size:1.35rem; font-family:var(--fm)}
  .kpi span{font-size:.68rem; color:var(--mut); font-weight:800; text-transform:uppercase; letter-spacing:.05em}

  /* board kanban */
  .board{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 16px; scroll-snap-type:x mandatory; align-items:flex-start; scrollbar-width:thin}
  .bcol{
    flex:0 0 min(86vw, 330px); width:min(86vw, 330px); min-width:0; max-width:min(86vw, 330px);
    scroll-snap-align:start; border:var(--b); border-radius:var(--r);
    background:var(--card); box-shadow:var(--sh); display:flex; flex-direction:column;
  }
  @media(min-width:960px){ .board{scroll-snap-type:none} .bcol{flex-basis:318px; width:318px; max-width:318px} }
  .bcol .bbody{min-width:0}
  .bcol .card{min-width:0; max-width:100%}
  .bcol .bhead{
    display:flex; align-items:center; gap:7px; padding:11px 13px; border-bottom:var(--b);
    border-radius:13px 13px 0 0; font-family:var(--fh); font-weight:700; font-size:.82rem; white-space:nowrap;
  }
  .bcol .bhead .cnt{margin-left:auto; background:var(--ink); color:var(--card); border-radius:99px; padding:1px 9px; font-size:.66rem; font-family:var(--fm)}
  .bcol .bbody{padding:8px; display:flex; flex-direction:column; gap:8px; min-height:100px; flex:1; max-height:66dvh; overflow-y:auto; overscroll-behavior:contain}
  .bcol.dragover{outline:3px dashed var(--ink); outline-offset:-6px}
  .bcol .card{box-shadow:var(--sh-sm)}
  .bcol .empty{padding:14px 8px; font-size:.7rem}

  /* kompakt board kartı */
  .ccard.mini{padding:10px 11px}
  .ccard.mini .top{gap:9px}
  .ccard.mini .thumb{width:36px;height:36px;border-radius:9px;font-size:1rem;border-width:2px}
  .ccard.mini .code{font-size:.64rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; word-break:normal}
  .ccard.mini .meta{font-size:.62rem; margin-top:3px; gap:5px}
  .ccard.mini .own{width:20px;height:20px;font-size:.6rem;border-radius:6px;border-width:2px}
  .ccard.mini .chip{padding:2px 8px; font-size:.56rem; border-width:2px}
  .ccard.mini .editbtn{min-width:24px;height:24px;font-size:.6rem;border-radius:6px}
  .ccard.mini .hook{
    font-size:.7rem; padding:6px 8px; margin-top:8px; border-width:2px; border-left-width:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .ccard.mini .mrow{gap:3px 10px; margin-top:8px}
  .ccard.mini .m{font-size:.64rem}
  .ccard.mini .reason{
    font-size:.62rem; margin-top:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .addbtn{
    background:none; border:2px dashed var(--mut); color:var(--ink-soft); border-radius:10px;
    padding:9px; font-weight:800; cursor:pointer; font-family:var(--fb); font-size:.75rem;
  }
  .editbtn{
    background:var(--cream2); border:var(--b2); border-radius:8px; min-width:28px; height:28px;
    cursor:pointer; font-size:.75rem; flex-shrink:0; font-family:inherit;
  }
  [draggable="true"]{cursor:grab}

  /* üretim panosu — tam genişlik, ince kolonlar */
  main.wide{max-width:none}
  @media(min-width:960px){
    .pboard{gap:10px}
    .pboard .bcol{flex:1 1 0; width:auto; min-width:150px; max-width:none}
    .pboard .bhead{font-size:.6rem; padding:9px 8px; gap:5px; letter-spacing:0}
    .pboard .bhead .cnt{font-size:.58rem; padding:1px 7px}
    .pboard .bbody{padding:6px; gap:6px; max-height:70dvh}
    .pboard .addbtn{font-size:.62rem; padding:6px}
    .pboard .pcard{padding:8px 9px}
  }

  /* modal */
  .modal{position:fixed; inset:0; z-index:80; background:rgba(18,18,18,.55); display:flex; align-items:flex-end; justify-content:center}
  @media(min-width:640px){.modal{align-items:center; padding:20px}}
  .modal .box{
    background:var(--card); border:var(--b); width:100%; max-width:540px; box-shadow:var(--sh);
    border-radius:20px 20px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:88dvh; overflow:auto;
  }
  @media(min-width:640px){.modal .box{border-radius:20px}}
  .modal h3{font-size:1.05rem; margin-bottom:14px}
  .frow{display:grid; grid-template-columns:1fr 1fr; gap:0 10px}
  .flabel{font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:2px 0 4px}
  .btn.danger{background:var(--red)}
  .btn.ghost{background:var(--card); color:var(--ink)}
  .btn.sm{width:auto; padding:9px 14px; font-size:.8rem}
  nav.bottom{overflow-x:auto; scrollbar-width:none} nav.bottom::-webkit-scrollbar{display:none} nav.bottom button{min-width:50px}
  .fgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 10px}
  @media(min-width:700px){.fgrid{grid-template-columns:repeat(4,1fr)} .fgrid.c2{grid-template-columns:repeat(2,1fr)}}
  .fgrid input,.fgrid select{margin-bottom:10px}
  .dayrow{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
  .dayrow input[type=date],.dayrow select{width:auto; margin:0; padding:9px 12px; font-size:.85rem}
  .dayrow .nb{background:var(--card); border:var(--b2); border-radius:10px; width:38px; height:38px; cursor:pointer; font-weight:800; font-family:var(--fm); box-shadow:var(--sh-sm)}
  .dayrow .dl{font-family:var(--fh); font-weight:700; font-size:1rem}
  .who{display:flex; flex-wrap:wrap; gap:8px}
  .who .w{display:inline-flex; align-items:center; gap:6px; border:var(--b2); border-radius:99px; padding:6px 12px; font-size:.74rem; font-weight:800; background:var(--card)}
  .who .w.ok{background:var(--green-s)} .who .w.no{background:var(--red-s)}
  .scrow{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
  .scbtn{width:32px; height:32px; border:var(--b2); border-radius:9px; background:var(--card); font-family:var(--fm); font-weight:700; cursor:pointer; font-size:.8rem; padding:0}
  .scbtn.on{background:var(--ink); color:var(--card); box-shadow:var(--sh-sm)}
  .pill{display:inline-block; border:var(--b2); border-radius:8px; padding:2px 8px; font-size:.66rem; font-weight:800; background:var(--card)}
  .crow{display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:2px solid var(--cream2); font-size:.78rem}
  .crow:last-child{border-bottom:none} .crow b{white-space:nowrap} .crow .ct{color:var(--ink-soft); font-weight:600; min-width:0; flex:1}
  .note{font-size:.74rem; color:var(--mut); font-weight:600; margin-top:8px}
  .disc{display:grid; gap:4px; overflow-x:auto}
  .disc .r{display:grid; grid-template-columns:110px repeat(var(--n),minmax(18px,1fr)); gap:3px; align-items:center; font-size:.7rem; font-weight:700}
  .disc .c{height:22px; border:2px solid var(--ink); border-radius:6px; background:var(--red-s)} .disc .c.ok{background:var(--green)} .disc .c.na{background:var(--gray-s); border-style:dashed; border-color:var(--mut)}
  .disc .h{font-size:.58rem; text-align:center; color:var(--mut); font-family:var(--fm)}
  table.compact{min-width:0} table.compact th,table.compact td{padding:7px 8px}
  .late{color:var(--red); font-weight:800}
  .okbox{width:26px;height:26px;border:var(--b2);border-radius:8px;background:var(--cream2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;cursor:pointer;flex-shrink:0;padding:0;font-family:inherit}
  .okbox.on{background:var(--green)}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom)); background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-weight:700; font-size:.8rem; z-index:90; border:var(--b2); box-shadow:var(--sh-sm); max-width:90vw}
  @media(min-width:960px){.toast{bottom:24px}}
  .eye{width:38px;height:38px;border:var(--b2);border-radius:50%;background:var(--card);cursor:pointer;box-shadow:var(--sh-sm);font-size:1rem;flex-shrink:0}
  .viewbar{background:var(--purple-s);border:var(--b2);border-radius:12px;padding:9px 13px;margin-bottom:16px;font-size:.78rem;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .viewbar button{margin-left:auto}
  .vlist button{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 14px}
  .vlist small{color:var(--mut);font-weight:700;margin-left:8px}

  .btnrow{display:flex; gap:10px; margin-top:8px}

  /* form / giriş */
  .auth{max-width:400px; margin:8vh auto 0; padding:0 20px}
  .authcard{background:var(--card); border:var(--b); border-radius:var(--r-lg); padding:26px 22px; box-shadow:var(--sh)}
  .auth .logo{font-family:var(--fh); font-size:1.45rem; font-weight:700; text-align:center; margin-bottom:4px}
  .auth .logo b{color:var(--cobalt)}
  .auth p{color:var(--mut); text-align:center; font-size:.85rem; font-weight:600; margin-bottom:22px}
  input,textarea,select{
    width:100%; background:var(--card); border:var(--b2); color:var(--ink);
    border-radius:12px; padding:13px 14px; font-size:.95rem; margin-bottom:12px; font-family:var(--fb); font-weight:600;
  }
  input:focus,textarea:focus{outline:none; border-color:var(--cobalt); box-shadow:var(--sh-sm)}
  .btn{
    width:100%; background:var(--cobalt); color:#fff; border:var(--b2); border-radius:12px;
    padding:14px; font-size:.95rem; font-weight:800; cursor:pointer; font-family:var(--fb); box-shadow:var(--sh-sm);
  }
  .btn:active{transform:translate(2px,2px); box-shadow:none}
  .btn:disabled{opacity:.5}
  .authmsg{font-size:.8rem; font-weight:700; text-align:center; margin-top:12px; color:var(--mut)}
  .authmsg.err{color:var(--red)}
  .switch{text-align:center; margin-top:16px; font-size:.82rem; font-weight:600; color:var(--mut)}
  .switch a{color:var(--cobalt); font-weight:800; cursor:pointer; text-decoration:none}

  /* import */
  textarea.json{min-height:230px; font-family:var(--fm); font-size:.74rem; font-weight:500}
  .implog{
    font-family:var(--fm); font-size:.72rem; background:var(--ink); color:#DFF6E7;
    border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; max-height:240px; overflow:auto;
  }

  /* demo bar */
  .demo{

  if(pc.error || ip.error){ S.prodTables=false; S.pipeline=[]; S.ideas=[]; }
  else { S.prodTables=true; S.pipeline=pc.data||[]; S.ideas=ip.data||[]; }
  const ln = await sb.from("links").select("*").order("created_at",{ascending:false});
  if(ln.error){ S.linksTable=false; S.links=[]; } else { S.linksTable=true; S.links=ln.data||[]; }
  const li = await sb.from("link_imports").select("last_message_at").order("last_message_at",{ascending:false}).limit(1);
  if(li.error){ S.importsTable=false; S.waLast=null; } else { S.importsTable=true; S.waLast = li.data?.[0]?.last_message_at || null; }
  const [kd,ks,kr]=await Promise.all([
    sb.from("kre_daily").select("*").order("day",{ascending:false}).limit(3000),
    sb.from("kre_scores").select("*").order("day",{ascending:false}).limit(5000),
    sb.from("kre_requests").select("*").order("created_at",{ascending:false}).limit(500),
  ]);
  if(kd.error||ks.error||kr.error){ S.kreTables=false; S.kdaily=[]; S.kscores=[]; S.kreq=[]; }
  else { S.kreTables=true; S.kdaily=kd.data||[]; S.kscores=ks.data||[]; S.kreq=kr.data||[]; }
  try{ const {data:st}=await sb.from("kre_settings").select("*").eq("key","roles").maybeSingle(); if(st?.value) S.kreRoles={...S.kreRoles,...st.value}; }catch(e){}
  if(canFin()){ const {data:pr}=await sb.from("profiles").select("id,name,initial,role").order("name"); S.profiles=pr||[]; }
  try{ const [{data:tk},{data:ta}]=await Promise.all([sb.from("tasks").select("*").order("created_at",{ascending:false}).limit(500), sb.from("task_assignees").select("*")]); S.ktasks=tk||[]; S.kassign=ta||[]; }catch(e){ S.ktasks=[]; S.kassign=[]; }
  S.fins=[];
  if(canFin()){
    const f = await sb.from("weekly_financials").select("*");
    S.fins=f.data||[];
  }
  if(!S.week && S.weeks.length) S.week=S.weeks[0].week;
}

function metricRow(c){
  const r=resFor(c.code), f=finFor(c.code);
  let out=[];
  if(r){
    out.push(`<span class="m">Satış <b>${nf.format(r.sales??0)}</b></span>`);
    if(r.hook_rate!=null) out.push(`<span class="m">Hook <b>${pct(r.hook_rate)}</b></span>`);
    if(r.hold_rate!=null) out.push(`<span class="m">Hold <b>${pct(r.hold_rate)}</b></span>`);
    if(r.ctr!=null) out.push(`<span class="m">CTR <b>${pct(r.ctr)}</b></span>`);
  }
  if(canFin() && f){
    out.push(`<span class="m">Harcama <b>${tl(f.spend)}</b></span>`);
    out.push(`<span class="m">ROAS <b>${f.roas!=null?nf2.format(f.roas):"—"}</b></span>`);
    out.push(`<span class="m">GPT <b>${tl(f.gpt)}</b></span>`);
    out.push(`<span class="m">rGPT <b>${f.rel_gpt!=null?nf2.format(f.rel_gpt):"—"}</b></span>`);
  }
  return out.length?`<div class="mrow">${out.join("")}</div>`:"";
}

function allTimeRows(){
  const by = {};
  S.results.forEach(r=>{
    const k=r.creative_code;
    const x = by[k] = by[k] || {code:k, weeks:0, sales:0, imp:0, winWeeks:0, spend:0, rev:0, first:null, last:null};
    x.weeks++; x.sales += (+r.sales||0); x.imp += (+r.impressions||0);
    if(["onayli_winner","winner_adayi"].includes(r.status_at_week)) x.winWeeks++;
    if(r.week){ if(!x.first || r.week<x.first) x.first=r.week; if(!x.last || r.week>x.last) x.last=r.week; }
  });
  S.fins.forEach(f=>{ const x=by[f.creative_code]; if(x){ x.spend+=(+f.spend||0); x.rev+=(+f.revenue||0); } });
  return Object.values(by).map(x=>{
    x.creative = S.creatives.find(c=>c.code===x.code) || null;
    x.roas = x.spend ? x.rev/x.spend : null;
    x.gpt  = (x.sales && x.spend) ? (x.spend/x.sales)*((x.rev/x.spend)-1) : null;
    return x;
  });
}

async function setStatus(code, status, reason){
  const c = S.creatives.find(x=>x.code===code); if(!c) return;
  if(c.status===status && (resFor(code)?.status_at_week??c.status)===status) return;
  c.status = status; if(reason) c.status_reason = reason;
  const r = S.results.find(x=>x.creative_code===code && x.week===S.week);
  if(r) r.status_at_week = status;
  if(!DEMO){
    await sb.from("creatives").update({status, status_reason:c.status_reason, updated_at:new Date().toISOString()}).eq("code", code);
    if(r) await sb.from("weekly_results").update({status_at_week:status}).eq("creative_code", code).eq("week", S.week);
  }
  renderAll();
}

const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const ayAdi = ym => { const [y,m]=ym.split("-"); return `${AYLAR[+m-1]} ${y}`; };
function aylikVideoSiralama(ym){
  const WIN=["onayli_winner","winner_adayi"], UNDEC=["yeni","testte","yetersiz_veri"];
  const wks = S.weeks.filter(w=>String(w.week).slice(0,7)===ym).map(w=>w.week);
  const fs = firstSeenMap();
  const per = {};
  Object.keys(OWNERS).forEach(o=>{ per[o]={kod:new Set(), dec:new Set(), win:new Set(), eski:new Set()}; });
  S.results.filter(r=>wks.includes(r.week)).forEach(r=>{
    const c = S.creatives.find(x=>x.code===r.creative_code);
    if(!c) return;
    if((c.format||"video")!=="video") return;             // SADECE VIDEO
    const yeni = wks.includes(fs[c.code]);                  // bu ay ILK KEZ teslim edilmis mi
    ownersOf(c).forEach(o=>{
      if(!per[o]) return;                                   // sahipsiz ve ekipte olmayan haric
      if(!yeni){ if(WIN.includes(r.status_at_week)) per[o].eski.add(c.code); return; }
      per[o].kod.add(c.code);
      if(!UNDEC.includes(r.status_at_week)) per[o].dec.add(c.code);
      if(WIN.includes(r.status_at_week))    per[o].win.add(c.code);
    });
  });
  let rows = Object.keys(per).map(o=>{
    const t=per[o].kod.size, d=per[o].dec.size, w=per[o].win.size;
    return {o, teslim:t, dec:d, win:w, rate: d? w/d : null, eski:per[o].eski.size};
  }).filter(r=>r.teslim>0 || r.eski>0);
  const maxT = Math.max(1,...rows.map(r=>r.teslim));
  const maxR = Math.max(0.0001,...rows.map(r=>r.rate||0));
  rows.forEach(r=>{
    r.pUretim = (r.teslim/maxT)*100;
    r.pOran   = ((r.rate||0)/maxR)*100;
    r.puan    = 0.5*r.pUretim + 0.5*r.pOran;
    r.yeterli = r.dec >= 4;
  });
  const sirali = rows.filter(r=>r.yeterli).sort((a,b)=>b.puan-a.puan);
  const onSinyal = rows.filter(r=>!r.yeterli).sort((a,b)=>b.teslim-a.teslim);
  return {wks, sirali, onSinyal};
}
function renderAylik(){
  const aylar = [...new Set(S.weeks.map(w=>String(w.week).slice(0,7)))].sort().reverse();
  if(!S.teamMonth || !aylar.includes(S.teamMonth)) S.teamMonth = aylar[0] || "";
  const {wks, sirali, onSinyal} = aylikVideoSiralama(S.teamMonth);

function renderTeam(){
  if(S.teamView==="ay"){
    const chips=[["tumu","🏛 Tüm Zamanlar"],["hafta","📅 Bu Hafta"],["ay","🏆 Aylık Sıralama"]].map(([v,l])=>
      `<button class="fchip ${S.teamView===v?"on":""}" data-tv="${v}">${l}</button>`).join("");
    $("tabTeam").innerHTML = `<h2>Aylık En İyi — Video</h2>
      <div class="sub">Ayın en iyisi: çok üreten ve isabet oranı yüksek olan</div>
      <div class="filters">${chips}</div>${renderAylik()}`;
    $("tabTeam").querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{S.teamView=b.dataset.tv; renderTeam();});
    $("tabTeam").querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{S.teamMonth=b.dataset.tm; renderTeam();});
    return;
  }
  const WIN=["onayli_winner","winner_adayi"], UNDEC=["yeni","testte","yetersiz_veri"];
  const weekly = S.teamView==="hafta";
  /* her kreatif icin: kapsamda mi, karar verilebilir mi, winner mi */
  const info = {};
  if(weekly){
    const fs = firstSeenMap();
    const stOf = {}; S.results.filter(r=>r.week===S.week).forEach(r=>stOf[r.creative_code]=r.status_at_week);
    S.creatives.forEach(c=>{
      const st = stOf[c.code];
      const yeni = fs[c.code]===S.week;                     // bu hafta ILK KEZ teslim edilmis
      info[c.code] = (st && yeni) ? {ok:true, dec:!UNDEC.includes(st), win:WIN.includes(st)}
                   : {ok:false, eskiWin: !!(st && !yeni && WIN.includes(st))};
    });
  } else {
    const per = {};
    S.results.forEach(r=>{
      const x = per[r.creative_code] = per[r.creative_code] || {ever:false, dec:false};
      if(WIN.includes(r.status_at_week)) x.ever = true;
      if(!UNDEC.includes(r.status_at_week)) x.dec = true;
    });
    S.creatives.forEach(c=>{
      info[c.code] = {ok:true, dec:(per[c.code]?.dec)||!UNDEC.includes(c.status), win:(per[c.code]?.ever)||WIN.includes(c.status)};
    });
  }
  const fmtOf = c => (c.format||"video")==="gorsel" ? "gorsel" : "video";
  const agg = list => {
    const l = list.filter(c=>info[c.code]?.ok);
    const a = {teslim:l.length, evald:l.filter(c=>info[c.code].dec).length, win:l.filter(c=>info[c.code].win).length};
    a.rate = a.evald ? a.win/a.evald : null;
    return a;
  };
  let rows = Object.keys(OWNERS).map(o=>{
    let mine = S.creatives.filter(c=>hasOwner(c,o));
    if(S.teamFmt) mine = mine.filter(c=>fmtOf(c)===S.teamFmt);
    const a = agg(mine);
    const eski = weekly ? mine.filter(c=>info[c.code]?.eskiWin).length : 0;
    return {o, ...a, eski, g: agg(mine.filter(c=>fmtOf(c)==="gorsel")), v: agg(mine.filter(c=>fmtOf(c)==="video"))};
  });
  rows.sort((a,b)=>(b.win-a.win)||((b.rate??0)-(a.rate??0)));
  const maxWin = Math.max(1,...rows.map(r=>r.win));
  const teamWarn = (isAdmin() && !DEMO && !S.teamTable)
    ? `<div class="demo" style="margin-bottom:14px">Ekip düzenleme için Supabase'de <b>team_members</b> tablosu gerekli — Claude'un verdiği SQL'i bir kez çalıştır.</div>` : "";
  const tvchips = [["tumu","🏛 Tüm Zamanlar"],["hafta","📅 Bu Hafta"],["ay","🏆 Aylık Sıralama"]].map(([v,l])=>
    `<button class="fchip ${S.teamView===v?"on":""}" data-tv="${v}">${l}</button>`).join("");
  const tfchips = [["","Görsel + Video"],["gorsel","🖼 Sadece Görsel"],["video","🎬 Sadece Video"]].map(([v,l])=>
    `<button class="fchip ${S.teamFmt===v?"on":""}" data-tf="${v}">${l}</button>`).join("");
  const tot = rows.reduce((a,r)=>({t:a.t+r.teslim, e:a.e+r.evald, w:a.w+r.win}),{t:0,e:0,w:0});
  $("tabTeam").innerHTML = `
    <h2>Ekip Skoru</h2>
    <div class="sub">${weekly?(S.week?trDate(S.week)+" haftasında ilk kez teslim edilenler":"Hafta seçilmedi"):"Tüm haftaların toplamı — bir kreatif herhangi bir haftada winner olduysa sayılır"} · görsel ve video birlikte sayılır, kırılımı her kartta görürsün · küçük örneklemde oran "ön sinyal"dir</div>
    <div class="filters">${tvchips}</div>
    <div class="filters">${tfchips}</div>
    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
      <div class="kpi"><b>${tot.t}</b><span>Teslim</span></div>
      <div class="kpi"><b>${tot.e}</b><span>Değerlendirilebilir</span></div>
      <div class="kpi"><b>${tot.w}</b><span>Winner</span></div>
      <div class="kpi"><b>${tot.e?pct(tot.w/tot.e):"—"}</b><span>Ekip Winner Oranı</span></div>
    </div>
    ${teamWarn}
    ${isAdmin()?`<div class="demo" style="margin-bottom:12px">🛒 Talep & ofis alışverişi sorumlusu: <select id="talepSel">${Object.keys(OWNERS).map(k=>`<option value="${esc(k)}" ${k===S.kreRoles.talep?"selected":""}>${esc(k)} · ${esc(OWNERS[k].name)}</option>`).join("")}</select><span style="font-weight:600;color:var(--mut)">Talepler bölümünü yalnızca bu kişi, sen ve ortaklar görür.</span></div>
    <div style="margin-bottom:12px"><button class="addbtn" id="teamAdd" style="width:100%">＋ Ekip üyesi ekle</button></div>`:""}
    <div class="cards">
    ${rows.map(r=>{
      const w=OWNERS[r.o];
      return `<div class="card">
        <div class="trow">
          ${ownBadge(r.o)}
          <span class="nm">${esc(w.name)}</span>
          <div class="bar"><i style="width:${(r.win/maxWin)*100}%;background:${w.c}"></i></div>
          <span class="wn">${r.win}</span>
          ${isAdmin()?`<button class="editbtn" data-tedit="${esc(r.o)}" title="Düzenle">✏️</button>`:""}
        </div>
        <div class="tstats">
          <div class="tstat"><b>${r.teslim}</b><span>Teslim</span></div>
          <div class="tstat"><b>${r.evald}</b><span>Değerlendirilebilir</span></div>
          <div class="tstat"><b>${r.win}</b><span>Winner</span></div>
          <div class="tstat"><b>${r.rate==null?"—":pct(r.rate)}</b><span>Winner Oranı${r.evald<4?" *":""}</span></div>
        </div>
        ${!S.teamFmt?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <span style="background:var(--cream2);border:var(--b2);border-radius:9px;padding:4px 10px;font-size:.7rem;font-weight:700">🖼 Görsel <b class="mono">${r.g.win}/${r.g.evald}</b> ${r.g.rate==null?"":"· "+pct(r.g.rate)}</span>
          <span style="background:var(--cream2);border:var(--b2);border-radius:9px;padding:4px 10px;font-size:.7rem;font-weight:700">🎬 Video <b class="mono">${r.v.win}/${r.v.evald}</b> ${r.v.rate==null?"":"· "+pct(r.v.rate)}</span>
        </div>`:""}
        ${r.eski?`<div class="reason" style="margin-top:8px;font-size:.7rem;color:var(--green);font-weight:700">♻️ Önceki haftalardan +${r.eski} kreatifi bu hafta da winner (skora girmez)</div>`:""}
        ${r.evald<4?`<div class="reason" style="margin-top:9px;font-size:.68rem;color:var(--mut);font-weight:600">* Örneklem küçük (${r.evald} değerlendirilebilir) — ön sinyal.</div>`:""}
      </div>`;
    }).join("")}
    </div>
  `;
  $("tabTeam").querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{S.teamView=b.dataset.tv; renderTeam();});
  $("tabTeam").querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{S.teamFmt=b.dataset.tf; renderTeam();});
  if(isAdmin()){
    if($("teamAdd")) $("teamAdd").onclick=()=>openTeamModal(null);
    if($("talepSel")) $("talepSel").onchange=async e=>{ const v={...S.kreRoles, talep:e.target.value}; if(!DEMO){ const {error}=await sb.from("kre_settings").upsert({key:"roles",value:v,updated_at:nowIso()},{onConflict:"key"}); if(error){ toast("Hata: "+error.message); return; } } S.kreRoles=v; toast("Talep sorumlusu: "+OWNERS[v.talep].name); };
    $("tabTeam").querySelectorAll("[data-tedit]").forEach(b=>b.onclick=()=>openTeamModal(b.dataset.tedit));
  }
}

function renderFinance(){
  if(!canFin()){ $("tabFinance").innerHTML=""; return; }
  const wf = S.fins.filter(f=>f.week===S.week);
  const tot = wf.reduce((a,f)=>({spend:a.spend+(+f.spend||0), revenue:a.revenue+(+f.revenue||0)}),{spend:0,revenue:0});
  const sales = S.results.filter(r=>r.week===S.week).reduce((a,r)=>a+(+r.sales||0),0);
  const roas = tot.spend? tot.revenue/tot.spend : null;

const pad = n=>String(n).padStart(2,"0");
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = ()=>iso(new Date());
const addDays = (s,n)=>{ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const dow = s=>new Date(s+"T00:00:00").getDay();
const monday = s=>addDays(s, -((dow(s)+6)%7));
const monthEnd = f=>{ const d=new Date(f+"T00:00:00"); d.setMonth(d.getMonth()+1); d.setDate(0); return iso(d); };
const trDateW = s=>new Date(s+"T00:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short",weekday:"long"});
const trMonth = s=>new Date(s+"T00:00:00").toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
const mins = t=>{ if(!t||!/^\d{1,2}:\d{2}/.test(t)) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
const hhmm = m=> m==null? "—" : `${pad(Math.floor(m/60))}:${pad(Math.round(m%60))}`;
const durTxt = m=> !m? "—" : m>=60? `${Math.floor(m/60)} sa${m%60? " "+(m%60)+" dk":""}` : `${m} dk`;
const numOrNull = v=>{ const s=String(v??"").trim(); if(s==="") return null; const n=parseInt(s.replace(/[^\d-]/g,""),10); return isNaN(n)?null:n; };
const sum = (arr,f)=>arr.reduce((a,x)=>a+(+(f?f(x):x)||0),0);
const avg = arr=>arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null;

/* ---- ortak görev tablosu (tasks): kreatif ekibin işleri ---- */
const userOfIni = ini => S.profiles.find(p=>p.initial===ini)?.id || (myIni()===ini ? S.profile?.id : null) || (DEMO ? "u_"+ini : null);

  return S.ktasks.filter(t=>t.user_id===uid || S.kassign.some(a=>a.task_id===t.id&&a.user_id===uid)).map(t=>({...t, done:t.status==="done"}));

function kTaskList(ini, day){
  const ts=kTasksFor(ini).filter(t=>!t.done || (t.done_at||"").slice(0,10)===day || t.due===day);
  if(!ts.length) return "";
  return `<div class="card" style="margin-bottom:16px"><div class="sect" style="margin-bottom:0"><h3>📌 Sana verilen işler <span class="cnt">${ts.filter(t=>!t.done).length} açık</span></h3>

  </div></div>`;

function bindKTasks(root, rerender){

async function importKre(data, say){

const OUR_PAGES = ["2201415620103449","438124863248207"];
function hostOf(u){ try{ return new URL(u).hostname.replace(/^(www|m|web)\./,"").toLowerCase(); }catch{ return ""; } }
function urlKey(u){
  try{
    const x = new URL(String(u).trim());
    [...x.searchParams.keys()].forEach(k=>{ if(/^(utm_.*|fbclid|gclid|igsh|igshid|si|mibextid|rdid|share_url|_r|_t)$/i.test(k)) x.searchParams.delete(k); });
    const q = x.searchParams.toString();
    return hostOf(x.href) + x.pathname.replace(/\/+$/,"") + (q ? "?"+q : "");
  }catch{ return String(u).trim().toLowerCase(); }
}
function platformOf(u){
  const h = hostOf(u), s = String(u).toLowerCase();
  if(s.includes("facebook.com/ads/library")) return "meta_ads";
  if(/(^|\.)facebook\.com$|fb\.watch|(^|\.)fb\.com$/.test(h)) return "facebook";
  if(h.includes("instagram.com")) return "instagram";
  if(h.includes("tiktok.com")) return "tiktok";
  if(/youtube\.com|youtu\.be/.test(h)) return "youtube";
  if(/drive\.google|docs\.google/.test(h)) return "drive";
  if(h.includes("canva.com")) return "canva";
  if(h.includes("higgsfield")) return "higgsfield";
  return "web";
}
function guessKat(u){
  const p = platformOf(u);
  if(OUR_PAGES.some(id=>String(u).includes(id))) return "bizim";
  if(p==="meta_ads") return "rakip";
  if(["instagram","tiktok","youtube"].includes(p)) return "ilham";
  if(["drive","canva","higgsfield"].includes(p)) return "arac";
  return "diger";
}
const maskPhone = t => String(t||"").replace(/\+?\d[\d\s().-]{8,}\d/g, m=>{ const d=m.replace(/\D/g,""); return d.length>=10 ? "•••"+d.slice(-2) : m; });
const maskSender = n => /^[+\d\s().-]+$/.test(String(n||"").trim()) ? "Kayıtsız numara (…"+String(n).replace(/\D/g,"").slice(-2)+")" : String(n||"").trim();
function parseWhatsApp(text){
  text = String(text).replace(/[‎‏‪-‮﻿]/g,"").replace(/[  ]/g," ").replace(/\r\n?/g,"\n");
  const HEAD = /^\[?(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(?:[AaPp][Mm])?\]?\s*(?:-\s*)?(.*)$/;
  const msgs = []; let cur = null;
  for(const line of text.split("\n")){
    const m = line.match(HEAD);
    if(m){
      let [, a, b, y, h, mi, se, rest] = m;
      if(y.length===2) y = "20"+y;
      let d=+a, mo=+b; if(mo>12 && d<=12){ const t=d; d=mo; mo=t; }
      const ts = new Date(+y, mo-1, d, +h, +mi, +(se||0));
      const sm = rest.match(/^([^:]{1,60}):\s?([\s\S]*)$/);
      if(sm){ cur = {ts, from: sm[1].trim(), text: sm[2]}; msgs.push(cur); } else cur = null;
    } else if(cur){ cur.text += "\n"+line; }
  }
  return msgs;
}
function extractLinks(msgs){
  const URLG = /https?:\/\/[^\s<>"'`]+/g, HASURL = /https?:\/\//;
  const clean = t => String(t||"").replace(URLG,"").replace(/<[^>]*(dahil edilmedi|omitted)[^>]*>/gi,"").replace(/\s+/g," ").trim();
  const out = new Map();
  msgs.forEach((m,i)=>{
    const urls = (m.text.match(URLG)||[]).map(u=>u.replace(/[.,;:!?)\]]+$/,""));
    if(!urls.length) return;
    let desc = clean(m.text);
    if(!desc){
      const near = j => { const n=msgs[j]; return (n && n.from===m.from && Math.abs(n.ts-m.ts)<=10*60000 && !HASURL.test(n.text)) ? clean(n.text) : ""; };
      desc = near(i+1) || near(i-1);
    }
    desc = maskPhone(desc);
    urls.forEach(u=>{
      const key = urlKey(u);
      if(out.has(key)){ const o=out.get(key); if(desc && !o.description.includes(desc)) o.description = (o.description? o.description+" · " : "")+desc; return; }
      out.set(key, {url:u, url_key:key, description:desc, category:guessKat(u), platform:platformOf(u), status:"yeni",
        shared_by:maskSender(m.from), shared_at: isNaN(m.ts) ? null : m.ts.toISOString(), source:"whatsapp"});
    });
  });
  return [...out.values()];
}

async function readWaFile(file){
  if(/\.zip$/i.test(file.name)){
    const JSZip = (await import("https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm")).default;
    const zip = await JSZip.loadAsync(file);
    const f = Object.values(zip.files).find(z=>!z.dir && /\.txt$/i.test(z.name));
    if(!f) throw new Error("Zip dosyasının içinde sohbet (.txt) bulunamadı");
    return await f.async("string");

  return await file.text();
}

function linkCard(x){
  const pl = PLAT[x.platform||platformOf(x.url)]||PLAT.web;
  const k = LINK_KATS[x.category]||LINK_KATS.diger, d = LINK_DURUM[x.status]||LINK_DURUM.yeni;
  const next = {yeni:["✓","İncelendi olarak işaretle"], incelendi:["★","Kullanıldı olarak işaretle"]}[x.status||"yeni"];
  const short = (hostOf(x.url)+(()=>{ try{ return new URL(x.url).pathname; }catch{ return ""; } })()).slice(0,60);
  return `<div class="card" style="padding:11px 13px;${(x.status==="arsiv")?"opacity:.65":""}">
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div class="thumb" style="width:38px;height:38px;border-radius:10px;font-size:1.05rem;border-width:2px" title="${esc(pl.l)}">${pl.i}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:.84rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(x.description||"(açıklama yok)")}</div>
        <a href="${esc(x.url)}" target="_blank" rel="noopener" class="mono" style="font-size:.64rem;color:var(--cobalt);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(short)}</a>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center">
          ${chip(k.l,k.s)} ${chip(d.l,d.s)}
          <span class="mono" style="font-size:.6rem;color:var(--mut)">${esc(x.shared_by||"")}${x.shared_at?" · "+trShort(x.shared_at):""}${x.source==="whatsapp"?" · 💬":""}</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <a class="editbtn" href="${esc(x.url)}" target="_blank" rel="noopener" title="Aç" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--cobalt);font-weight:800">↗</a>
        ${next?`<button class="editbtn" data-lnext="${esc(x.id)}" title="${next[1]}">${next[0]}</button>`:""}
        <button class="editbtn" data-ledit="${esc(x.id)}" title="Düzenle">✏️</button>
      </div>
    </div>
  </div>`;
}
function renderLinkList(){
  const box = $("linkList"); if(!box) return;
  const list = linkFiltered();
  box.innerHTML = `<div class="sub" style="margin:0 0 10px">${list.length} link</div>
    <div class="cards">${list.length? list.map(linkCard).join("") : `<div class="empty">Bu filtrede link yok</div>`}</div>`;
  box.querySelectorAll("[data-ledit]").forEach(b=>b.onclick=()=>openLinkModal(b.dataset.ledit));
  box.querySelectorAll("[data-lnext]").forEach(b=>b.onclick=()=>linkNext(b.dataset.lnext));
}
function renderLinks(){
  const el = $("tabLinks"); const f = S.linkFilter;
  const warn = (!DEMO && !S.linksTable) ? `<div class="demo" style="margin-bottom:14px">Bu bölüm için Supabase'de <b>links</b> tablosu gerekli — Claude'un verdiği SQL'i bir kez çalıştır.</div>` : "";
  const acik = S.links.filter(x=>["yeni","incelendi"].includes(x.status||"yeni")).length;
  const dchips = [["acik",`🔵 Açık (${acik})`],["kullanildi","✅ Kullanıldı"],["arsiv","🗄 Arşiv"],["tumu","Tümü"]].map(([v,l])=>
    `<button class="fchip ${f.durum===v?"on":""}" data-ld="${v}">${l}</button>`).join("");
  const kchips = [["","Tüm kategoriler"],...Object.keys(LINK_KATS).map(k=>[k,LINK_KATS[k].l])].map(([v,l])=>
    `<button class="fchip ${f.kat===v?"on":""}" data-lk="${v}">${l}</button>`).join("");
  const pchips = [["","Tüm platformlar"],...Object.keys(PLAT).map(k=>[k,PLAT[k].i+" "+PLAT[k].l])].map(([v,l])=>
    `<button class="fchip ${f.plat===v?"on":""}" data-lp="${v}">${l}</button>`).join("");
  el.innerHTML = `
    <h2>Link Kütüphanesi</h2>
    <div class="sub">WhatsApp grubunda ve ekipte paylaşılan linkler — herkes ekleyebilir, herkes görür</div>
    ${warn}
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn" id="lnAdd" style="width:auto;padding:11px 16px">＋ Link ekle</button>
      <button class="btn ghost" id="lnWa" style="width:auto;padding:11px 16px">📥 WhatsApp'tan aktar</button>
    </div>
    <input id="lnQ" value="${esc(f.q)}" placeholder="🔍 Açıklamada, linkte ya da paylaşanda ara…" style="margin-bottom:10px">
    <div class="filters">${dchips}</div>
    <div class="filters">${kchips}</div>
    <div class="filters">${pchips}</div>
    <div id="linkList"></div>
  `;
  el.querySelectorAll("[data-ld]").forEach(b=>b.onclick=()=>{S.linkFilter.durum=b.dataset.ld; renderLinks();});
  el.querySelectorAll("[data-lk]").forEach(b=>b.onclick=()=>{S.linkFilter.kat=b.dataset.lk; renderLinks();});
  el.querySelectorAll("[data-lp]").forEach(b=>b.onclick=()=>{S.linkFilter.plat=b.dataset.lp; renderLinks();});
  $("lnQ").oninput = e=>{ S.linkFilter.q = e.target.value; renderLinkList(); };
  $("lnAdd").onclick = ()=>openLinkModal(null);
  $("lnWa").onclick  = openWaImportModal;
  renderLinkList();
}
async function linkNext(id){
  const x = S.links.find(l=>String(l.id)===String(id)); if(!x) return;
  const next = {yeni:"incelendi", incelendi:"kullanildi"}[x.status||"yeni"]; if(!next) return;
  const prev = x.status; x.status = next;
  if(!DEMO){
    const {error} = await sb.from("links").update({status:next, updated_at:new Date().toISOString()}).eq("id", x.id);
    if(error){ alert("Kaydedilemedi: "+error.message); x.status=prev; return; }
  }
  renderLinks();
}
function openLinkModal(id){
  if(!DEMO && !S.linksTable){ alert("Önce links tablosunu oluşturmalısın — Claude'un verdiği SQL'i Supabase'de bir kez çalıştır."); return; }
  const x = id ? S.links.find(l=>String(l.id)===String(id)) : null;
  const isNew = !x;
  const v = x || {url:"", description:"", category:"diger", status:"yeni", shared_by:S.profile?.name||""};
  const canDel = x && (isAdmin() || DEMO || x.created_by===S.profile?.id);
  modal(`
    <h3>${isNew?"＋ Link ekle":"Linki düzenle"}</h3>
    <div class="flabel">Link</div>
    <input id="lmUrl" value="${esc(v.url)}" placeholder="https://…">
    <div class="flabel">Açıklama</div>
    <textarea id="lmDesc" style="min-height:80px" placeholder="Bu link neden önemli, ne gördün?">${esc(v.description||"")}</textarea>
    <div class="frow">
      <div><div class="flabel">Kategori</div><select id="lmKat">${Object.keys(LINK_KATS).map(k=>opt(k,LINK_KATS[k].l,v.category||"diger")).join("")}</select></div>
      <div><div class="flabel">Durum</div><select id="lmDur">${Object.keys(LINK_DURUM).map(k=>opt(k,LINK_DURUM[k].l,v.status||"yeni")).join("")}</select></div>
    </div>
    <div class="flabel">Paylaşan</div>
    <input id="lmBy" value="${esc(v.shared_by||"")}">
    <div class="btnrow">
      <button class="btn" id="lmSave">Kaydet</button>
      ${canDel?`<button class="btn danger" id="lmDel" style="width:auto;padding:14px 18px">Sil</button>`:""}
      <button class="btn ghost" id="lmCancel" style="width:auto;padding:14px 18px">Vazgeç</button>
    </div>`);
  if(isNew) $("lmUrl").onblur = ()=>{ const u=$("lmUrl").value.trim(); if(u) $("lmKat").value = guessKat(u); };
  $("lmCancel").onclick = closeModal;
  $("lmSave").onclick = async ()=>{
    const url = $("lmUrl").value.trim();
    if(!/^https?:\/\//i.test(url)){ alert("Geçerli bir link gir (https:// ile başlamalı)."); return; }
    const key = urlKey(url);
    const dup = S.links.find(l=>(l.url_key||urlKey(l.url))===key && (!x || l.id!==x.id));
    if(dup){ alert("Bu link zaten kütüphanede: "+(dup.description||dup.url)); return; }
    const row = {url, url_key:key, description:$("lmDesc").value.trim()||null, category:$("lmKat").value,
      status:$("lmDur").value, platform:platformOf(url), shared_by:$("lmBy").value.trim()||null};
    if(isNew){
      const full = {...row, shared_at:new Date().toISOString(), source:"manuel", created_by:DEMO?null:S.profile.id, created_name:S.profile?.name||null};
      if(!DEMO){
        const {data,error} = await sb.from("links").insert(full).select().single();
        if(error){ alert("Kaydedilemedi: "+error.message); return; }
        S.links.unshift(data);
      } else S.links.unshift({...full, id:"demo-"+Date.now()});
    } else {
      if(!DEMO){
        const {error} = await sb.from("links").update({...row, updated_at:new Date().toISOString()}).eq("id", x.id);
        if(error){ alert("Kaydedilemedi: "+error.message); return; }
      }
      Object.assign(x,row);
    }
    closeModal(); renderLinks();
  };
  if(canDel) $("lmDel").onclick = async ()=>{
    if(!confirm("Link silinsin mi?")) return;
    if(!DEMO){ const {error}=await sb.from("links").delete().eq("id",x.id); if(error){ alert("Silinemedi: "+error.message); return; } }
    S.links = S.links.filter(l=>l.id!==x.id);
    closeModal(); renderLinks();
  };
}
function openWaImportModal(){
  if(!DEMO && !S.linksTable){ alert("Önce links tablosunu oluşturmalısın — Claude'un verdiği SQL'i Supabase'de bir kez çalıştır."); return; }
  modal(`
    <h3>📥 WhatsApp'tan link aktar</h3>
    <div style="font-size:.78rem;font-weight:600;color:var(--ink-soft);line-height:1.5;margin-bottom:12px">
      WhatsApp'ta grubu aç → grup adına dokun → <b>Sohbeti dışa aktar</b> → <b>Medya olmadan</b>.<br>
      Çıkan <b>.zip</b> ya da <b>.txt</b> dosyasını buraya yükle. Sadece link içeren mesajlar alınır, telefon numaraları panele taşınmaz. Daha önce eklenmiş linkler atlanır.
    </div>
    ${waCutoff()?`<label style="display:flex;gap:9px;align-items:flex-start;font-size:.78rem;font-weight:700;margin:0 0 12px;background:var(--green-s);border:var(--b2);border-radius:10px;padding:9px 11px;cursor:pointer">
      <input type="checkbox" id="waOnlyNew" checked style="width:auto;margin:2px 0 0">
      <span>Sadece son aktarmadan sonraki mesajları al<br><span style="font-weight:600;color:var(--ink-soft)">Son aktarılan link: ${esc(trShortTime(waCutoff()))} — öncesi okunmaz, silinen linkler geri gelmez</span></span>
    </label>`:`<div class="sub" style="margin:0 0 12px">İlk aktarma: sohbetteki bütün linkler alınacak.</div>`}
    <input type="file" id="waFile" accept=".txt,.zip,text/plain,application/zip">
    <div id="waPrev"></div>
    <div class="btnrow">
      <button class="btn" id="waGo" disabled>İçe Aktar</button>
      <button class="btn ghost" id="waCancel" style="width:auto;padding:14px 18px">Vazgeç</button>
    </div>`);
  let yeniler = [], msgs = null;
  $("waCancel").onclick = closeModal;
  const hesapla = ()=>{
    if(!msgs) return;
    const hepsi = extractLinks(msgs);
    const cut = ($("waOnlyNew")?.checked) ? waCutoff() : null;
    const eski = cut ? hepsi.filter(l=>l.shared_at && new Date(l.shared_at).getTime() <= cut.getTime()) : [];
    const aday = cut ? hepsi.filter(l=>!l.shared_at || new Date(l.shared_at).getTime() > cut.getTime()) : hepsi;
    const var_ = new Set(S.links.map(l=>l.url_key||urlKey(l.url)));
    const tekrar = aday.filter(l=>var_.has(l.url_key));
    yeniler = aday.filter(l=>!var_.has(l.url_key));
    const kc = {}; yeniler.forEach(l=>kc[l.category]=(kc[l.category]||0)+1);
    $("waPrev").innerHTML = `
        <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-top:6px">
          <div class="kpi"><b>${hepsi.length}</b><span>Sohbetteki link</span></div>
          <div class="kpi"><b>${eski.length+tekrar.length}</b><span>Atlanan</span></div>
          <div class="kpi"><b>${yeniler.length}</b><span>Eklenecek</span></div>
        </div>
        ${(eski.length||tekrar.length)?`<div class="sub" style="margin:-6px 0 10px">Atlananlar: ${eski.length} link son aktarmadan önce paylaşılmış · ${tekrar.length} link zaten kütüphanede</div>`:""}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${Object.entries(kc).map(([k,n])=>chip(`${(LINK_KATS[k]||LINK_KATS.diger).l} · ${n}`,(LINK_KATS[k]||LINK_KATS.diger).s)).join("")}</div>
        <div style="max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px">
          ${yeniler.slice(0,8).map(l=>`<div style="font-size:.72rem;border:2px solid var(--cream2);border-radius:9px;padding:6px 8px">
            <b>${esc(l.shared_by)}</b> · ${esc(trShort(l.shared_at))} — ${esc((l.description||"(açıklama yok)").slice(0,90))}
            <div class="mono" style="font-size:.6rem;color:var(--cobalt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.url)}</div></div>`).join("")}
          ${yeniler.length>8?`<div class="sub" style="margin:0">…ve ${yeniler.length-8} link daha</div>`:""}
        </div>
        <div class="sub" style="margin:8px 0 0">Kategoriler linkin türüne göre tahmin edildi, sonra ✏️ ile değiştirebilirsin.</div>`;
    $("waGo").disabled = !yeniler.length;
    $("waGo").textContent = yeniler.length ? `İçe Aktar (${yeniler.length})` : "Yeni link yok";
  };
  if($("waOnlyNew")) $("waOnlyNew").onchange = hesapla;
  $("waFile").onchange = async e=>{
    const file = e.target.files[0]; if(!file) return;
    $("waPrev").innerHTML = `<div class="sub">Okunuyor…</div>`; $("waGo").disabled = true;
    try{
      msgs = parseWhatsApp(await readWaFile(file));
      if(!msgs.length) throw new Error("Dosyada WhatsApp mesajı bulunamadı — doğru dosyayı seçtiğinden emin ol");
      hesapla();
    }catch(err){ msgs=null; $("waPrev").innerHTML = `<div class="demo" style="margin-top:8px">❌ ${esc(err.message||err)}</div>`; }
  };
  $("waGo").onclick = async ()=>{
    if(!yeniler.length) return;
    $("waGo").disabled = true; $("waGo").textContent = "Aktarılıyor…";
    const rows = yeniler.map(l=>({...l, created_by:DEMO?null:S.profile.id, created_name:S.profile?.name||null}));
    const sonMesajMs = Math.max(...msgs.map(m=>m.ts.getTime()).filter(x=>!isNaN(x)));
    const sonMesaj = new Date(Math.max(sonMesajMs, S.waLast ? new Date(S.waLast).getTime() : 0)).toISOString();
    if(!DEMO){
      for(let i=0;i<rows.length;i+=200){
        const {error} = await sb.from("links").upsert(rows.slice(i,i+200), {onConflict:"url_key", ignoreDuplicates:true});
        if(error){ alert("Aktarılamadı: "+error.message); $("waGo").disabled=false; $("waGo").textContent="İçe Aktar"; return; }
      }
      const {data} = await sb.from("links").select("*").order("created_at",{ascending:false});
      if(data) S.links = data;
      if(S.importsTable){
        await sb.from("link_imports").insert({last_message_at:sonMesaj, link_count:rows.length, imported_by:S.profile.id, imported_name:S.profile?.name||null});
      }
    } else rows.forEach((r,i)=>S.links.unshift({...r, id:"wa-"+i+"-"+Date.now()}));
    S.waLast = sonMesaj;
    closeModal(); S.linkFilter.durum="acik"; renderLinks();
    alert(`✅ ${rows.length} link kütüphaneye eklendi`);
  };
}

/* ================= ÜRETİM (akış + havuz — herkes yazabilir) ================= */
function renderProd(){
  const el = $("tabProd");
  const warn = (!DEMO && !S.prodTables)
    ? `<div class="demo" style="margin-bottom:14px">Bu bölüm için Supabase'de <b>pipeline_cards</b> ve <b>idea_pool</b> tabloları gerekli — Claude'un verdiği SQL'i bir kez çalıştır.</div>` : "";
  const viewChips = [["akis","📋 Üretim Akışı"],["havuz","💡 Varyasyon / İterasyon Havuzu"]].map(([v,l])=>
    `<button class="fchip ${S.prodView===v?"on":""}" data-pv="${v}">${l}</button>`).join("");
  let body = "";
  if(S.prodView==="akis"){
    const cols = STAGES.map(([key,label],i)=>{
      const c = STAGE_COLORS[i];
      const arr = S.pipeline.filter(p=>p.stage===key);
      return `<div class="bcol" data-pdrop="${key}">
        <div class="bhead" style="background:${c}22"><span style="color:${c}">●</span> ${label} <span class="cnt">${arr.length}</span></div>
        <div class="bbody">
          ${arr.map(pipeCard).join("")}
          <button class="addbtn" data-padd="${key}">＋ Ekle</button>
        </div>
      </div>`;
    }).join("");
    body = `<div class="board pboard">${cols}</div>`;
  } else {
    const f = S.ideaFilter;
    const fmtOf = code => {
      const c = S.creatives.find(x=>x.code===code);
      return c ? (c.format||"gorsel") : (code.toLowerCase().includes("video")?"video":"gorsel");
    };
    const groups = {};
    S.ideas.forEach(x=>{ (groups[x.parent_code] = groups[x.parent_code]||[]).push(x); });
    const winnerCodes = S.creatives.filter(c=>["onayli_winner","winner_adayi"].includes(statusAtWeek(c))).map(c=>c.code);
    winnerCodes.forEach(w=>{ if(!groups[w]) groups[w]=[]; });
    let keys = Object.keys(groups).sort((a,b)=>{
      const aw = winnerCodes.includes(a)?0:1, bw = winnerCodes.includes(b)?0:1;
      return aw-bw || a.localeCompare(b,"tr");
    });
    if(f.format) keys = keys.filter(k=>fmtOf(k)===f.format);
    const isDone = x => !!x.done;
    const allDone = k => groups[k].length>0 && groups[k].every(isDone);
    const doneGroups = keys.filter(allDone);
    const view = {};
    keys.forEach(k=>{
      let arr = groups[k];
      if(f.tur) arr = arr.filter(x=>(x.tur||"FIKIR")===f.tur);
      if(f.durum==="acik")   arr = arr.filter(x=>!isDone(x));
      if(f.durum==="yapildi") arr = arr.filter(isDone);
      view[k] = arr;
    });
    if(f.durum==="acik")    keys = keys.filter(k=>!allDone(k));
    if(f.durum==="yapildi") keys = keys.filter(k=>view[k].length);
    if(f.tur)               keys = keys.filter(k=>view[k].length);
    const tchips = [["","Tüm etiketler"],...Object.keys(TURS).map(k=>[k,TURS[k].l])].map(([v,l])=>
      `<button class="fchip ${f.tur===v?"on":""}" data-it="${v}">${l}</button>`).join("");
    const fchips2 = [["","Tüm formatlar"],["gorsel","🖼 Görsel"],["video","🎬 Video"]].map(([v,l])=>
      `<button class="fchip ${f.format===v?"on":""}" data-if="${v}">${l}</button>`).join("");
    const dchips = [["acik","🔵 Açık işler"],["yapildi","✅ Yapıldı"],["tumu","Tümü"]].map(([v,l])=>
      `<button class="fchip ${f.durum===v?"on":""}" data-id2="${v}">${l}</button>`).join("");
    const doneNote = (f.durum==="acik" && doneGroups.length)
      ? `<div style="font-size:.72rem;color:var(--mut);font-weight:700;margin-top:14px">✅ ${doneGroups.length} kreatifin tüm işi tamamlandı ve listeden gizlendi — görmek için "Yapıldı" filtresine geç.</div>` : "";
    body = `
      <div class="filters">${dchips}</div>
      <div class="filters">${fchips2}</div>
      <div class="filters">${tchips}</div>
      <div style="margin-bottom:14px"><button class="addbtn" id="ideaAdd" style="width:100%">＋ Yeni kayıt — kreatifi seç, fikrini/hook'unu yaz, etiketle (herkes ekleyebilir)</button></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        ${keys.length? keys.map(k=>ideaGroup(k, view[k], winnerCodes.includes(k), allDone(k))).join("") : `<div class="empty">${f.durum==="yapildi"?"Henüz tamamlanan kayıt yok":"Açık iş kalmadı — hepsi tamamlandı 🎉"}</div>`}
      </div>
      ${doneNote}
    `;
  }
  el.innerHTML = `
    <h2>Üretim</h2>
    <div class="sub">Ortak çalışma alanı — ekipteki herkes kart ekleyebilir, taşıyabilir, not yazabilir</div>
    ${warn}
    <div class="filters">${viewChips}</div>
    ${body}
  `;
  el.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>{S.prodView=b.dataset.pv; renderProd();});
  if(S.prodView==="akis"){
    el.querySelectorAll("[data-padd]").forEach(b=>b.onclick=()=>openPipeModal(null, b.dataset.padd));
    el.querySelectorAll("[data-pedit]").forEach(b=>b.onclick=()=>openPipeModal(b.dataset.pedit));
    el.querySelectorAll(".pcard").forEach(card=>{
      card.setAttribute("draggable","true");
      card.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", card.dataset.pid); });
    });
    el.querySelectorAll("[data-pdrop]").forEach(col=>{
      col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("dragover"); });
      col.addEventListener("dragleave", ()=>col.classList.remove("dragover"));
      col.addEventListener("drop", async e=>{
        e.preventDefault(); col.classList.remove("dragover");
        const id = e.dataTransfer.getData("text/plain");
        const p = S.pipeline.find(x=>String(x.id)===id); if(!p || p.stage===col.dataset.pdrop) return;
        p.stage = col.dataset.pdrop;
        if(!DEMO) await sb.from("pipeline_cards").update({stage:p.stage, updated_at:new Date().toISOString()}).eq("id", p.id);
        renderProd();
      });
    });
  } else {
    if($("ideaAdd")) $("ideaAdd").onclick=()=>openIdeaModal(null);
    el.querySelectorAll("[data-iadd]").forEach(b=>b.onclick=()=>openIdeaModal(null, b.dataset.iadd));
    el.querySelectorAll("[data-iedit]").forEach(b=>b.onclick=()=>openIdeaModal(b.dataset.iedit));
    el.querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{S.ideaFilter.tur=b.dataset.it; renderProd();});
    el.querySelectorAll("[data-if]").forEach(b=>b.onclick=()=>{S.ideaFilter.format=b.dataset.if; renderProd();});
    el.querySelectorAll("[data-id2]").forEach(b=>b.onclick=()=>{S.ideaFilter.durum=b.dataset.id2; renderProd();});
    el.querySelectorAll("[data-idone]").forEach(b=>b.onclick=()=>toggleIdeaDone(b.dataset.idone));
  }
}

function ideaEntry(x){

      style="min-width:24px;height:24px;font-size:.68rem;background:${d?"var(--green)":"var(--card)"};color:${d?"#fff":"var(--ink)"};border-color:${d?"var(--green)":"var(--ink)"}">✓</button>
    ${chip(t.l, "var(--card)")}
    <div style="min-width:0">
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        ${hooks.map(h=>`<span style="display:inline-block;background:var(--card);border:2px solid ${d?"var(--mut)":"var(--ink)"};border-radius:8px;padding:3px 9px;font-size:.76rem;font-weight:700;line-height:1.35;${d?"text-decoration:line-through;color:var(--mut)":""}">${esc(h)}</span>`).join("")}
      </div>
      ${x.note?`<div style="font-size:.7rem;color:var(--ink-soft);font-weight:600;margin-top:4px">${esc(x.note)}</div>`:""}
      <div class="mono" style="font-size:.58rem;color:var(--mut);margin-top:3px">
        ${x.created_name?esc(x.created_name):""}${d&&x.done_name?` · ✅ ${esc(x.done_name)}`:d?" · ✅ yapıldı":""}

}
async function toggleIdeaDone(id){
  const x = S.ideas.find(i=>String(i.id)===String(id)); if(!x) return;
  const now = !x.done;
  x.done = now;
  x.done_name = now ? (S.profile?.name||null) : null;
  if(!DEMO){
    const {error} = await sb.from("idea_pool")
      .update({done:now, done_name:x.done_name, done_at: now? new Date().toISOString() : null, updated_at:new Date().toISOString()})
      .eq("id", x.id);
    if(error){ alert("Kaydedilemedi: "+error.message); x.done=!now; return; }
  }
  renderProd();
}

/* ================= IMPORT ================= */
async function doImport(){
  const log = $("impLog"); log.classList.remove("hidden"); log.textContent="";
  const say = m => { log.textContent += m+"\n"; };
  let data;
  try{ data = JSON.parse($("impJson").value); }
  catch(e){ say("❌ JSON okunamadı: "+e.message); return; }
  if(Array.isArray(data.daily)||Array.isArray(data.scores)||Array.isArray(data.requests)){
    try{ await importKre(data, say); }catch(e){ say("❌ Hata: "+(e.message||e)); }
    if(!data.week) return;
  }
  if(!data.week){ say("❌ 'week' alanı zorunlu (haftanın pazartesi tarihi, YYYY-AA-GG)."); return; }
  if(DEMO){ say("⚠️ DEMO modundasın — Supabase ayarları doldurulunca gerçek içe aktarma çalışır."); return; }
  try{
    say("→ Hafta kaydediliyor…");
    await sb.from("weeks").upsert({week:data.week, note:data.note||null, updated_at:new Date().toISOString()});
    if(Array.isArray(data.creatives) && data.creatives.length){
      say(`→ ${data.creatives.length} kreatif upsert…`);
      const rows = data.creatives.map(c=>({...c, updated_at:new Date().toISOString()}));
      const {error} = await sb.from("creatives").upsert(rows,{onConflict:"code"});
      if(error) throw error;
    }
    if(Array.isArray(data.results) && data.results.length){
      say(`→ ${data.results.length} haftalık sonuç upsert…`);
      const rows = data.results.map(r=>{
        const o={...r, week:data.week};
        o.hook_rate = o.hook_rate ?? (o.video_3s&&o.impressions? o.video_3s/o.impressions : null);
        o.hold_rate = o.hold_rate ?? (o.thruplay&&o.video_3s? o.thruplay/o.video_3s : null);
        o.ctr = o.ctr ?? (o.link_clicks&&o.impressions? o.link_clicks/o.impressions : null);
        return o;
      });
      const {error} = await sb.from("weekly_results").upsert(rows,{onConflict:"creative_code,week"});
      if(error) throw error;
      for(const r of rows){
        if(r.status_at_week) await sb.from("creatives").update({status:r.status_at_week, updated_at:new Date().toISOString()}).eq("code", r.creative_code);
      }
    }
    if(Array.isArray(data.financials) && data.financials.length){
      say(`→ ${data.financials.length} finansal kayıt upsert…`);
      let rows = data.financials.map(f=>({...f, week:data.week}));
      rows.forEach(f=>{
        const sales = (data.results||[]).find(r=>r.creative_code===f.creative_code)?.sales;
        f.roas = f.roas ?? (f.spend? f.revenue/f.spend : null);
        f.cpr  = f.cpr  ?? (sales? f.spend/sales : null);
        f.gpt  = f.gpt  ?? ((f.cpr!=null&&f.roas!=null)? f.cpr*(f.roas-1) : null);
      });
      const totSpend = rows.reduce((a,f)=>a+(+f.spend||0),0);
      const wAvg = totSpend? rows.reduce((a,f)=>a+(+f.gpt||0)*(+f.spend||0),0)/totSpend : null;
      rows.forEach(f=>{ f.rel_gpt = f.rel_gpt ?? ((wAvg&&f.gpt!=null)? f.gpt/wAvg : null); });
      const {error} = await sb.from("weekly_financials").upsert(rows,{onConflict:"creative_code,week"});
      if(error) throw error;
    }
    if(Array.isArray(data.hooks) && data.hooks.length){
      say(`→ ${data.hooks.length} hook upsert…`);
      const {error} = await sb.from("hooks").upsert(data.hooks.map(h=>({...h, updated_at:new Date().toISOString()})),{onConflict:"code"});
      if(error) throw error;
    }
    if(Array.isArray(data.links) && data.links.length){
      say(`→ ${data.links.length} Facebook linki işleniyor…`);
      let ok=0;
      for(const l of data.links){
        if(!l.code || !l.link) continue;
        const {error} = await sb.from("creatives").update({link:l.link}).eq("code", l.code);
        if(!error) ok++;
      }
      say(`   ${ok} kreatif linklendi`);
    }
    say("✅ Tamamlandı. Veriler yenileniyor…");
    await loadAll(); S.week=data.week; renderAll();
  }catch(e){ say("❌ Hata: "+(e.message||e)); }
}

/* ================= AUTH ================= */
function showAuth(msg,err){
  $("vAuth").classList.remove("hidden"); $("vApp").classList.add("hidden");
  const m=$("authMsg"); m.textContent=msg||""; m.className="authmsg"+(err?" err":"");
}
async function showApp(){
  $("vAuth").classList.add("hidden"); $("vApp").classList.remove("hidden");
  renderAll();
}

async function boot(){
  if(DEMO){
    demoData();
    S.profile={name:"Demo Yönetici", role:"admin", initial:"Y"};
    $("demoBar").classList.remove("hidden");
    $("demoRole").onchange = e=>{
      const r=e.target.value;
      S.profile = r==="admin" ? {name:"Demo Yönetici",role:"admin",initial:"Y"}
        : r==="partner" ? {name:"Demo Ortak",role:"partner",initial:"O"}
        : {name:"Demo Çağdaş",role:"creative",initial:"C"};
      S.tab="board"; renderAll();
    };
    await showApp(); return;
  }
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ showAuth(); return; }
  let {data:prof} = await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(!prof){
    const md = session.user.user_metadata||{};
    const row = {id:session.user.id, name: md.name || session.user.email.split("@")[0], initial: md.initial||null};
    const {data:ins,error} = await sb.from("profiles").insert(row).select().single();
    if(error){ showAuth("Profil oluşturulamadı: "+error.message, true); await sb.auth.signOut(); return; }
    prof = ins;
  }
  S.profile=prof;
  await loadAll();
  await showApp();
}

$("goSignup").onclick=()=>{ $("authLogin").classList.add("hidden"); $("authSignup").classList.remove("hidden"); $("authMsg").textContent=""; };
$("goLogin").onclick =()=>{ $("authSignup").classList.add("hidden"); $("authLogin").classList.remove("hidden"); $("authMsg").textContent=""; };

$("btnLogin").onclick = async ()=>{
  if(DEMO) return;
  $("btnLogin").disabled=true;
  const {error} = await sb.auth.signInWithPassword({email:$("liEmail").value.trim(), password:$("liPass").value});
  $("btnLogin").disabled=false;
  if(error){ showAuth("Giriş başarısız: "+error.message, true); return; }

};
$("btnSignup").onclick = async ()=>{
  if(DEMO) return;
  const name=$("suName").value.trim();
  if(!name){ showAuth("Ad Soyad gerekli.",true); return; }
  $("btnSignup").disabled=true;
  const {data,error} = await sb.auth.signUp({email:$("suEmail").value.trim(), password:$("suPass").value,
    options:{data:{name, initial:$("suInitial").value||null}}});
  if(error){ $("btnSignup").disabled=false; showAuth("Kayıt başarısız: "+error.message, true); return; }
  if(data.session){
    await sb.from("profiles").insert({id:data.user.id, name, initial:$("suInitial").value||null});
  }
  $("btnSignup").disabled=false;
  boot();
};
const logout = async ()=>{
  if(DEMO){ alert("Demo modundasın."); return; }
  if(confirm("Çıkış yapılsın mı?")){ await sb.auth.signOut(); location.reload(); }
};
$("avatar").onclick = logout;
$("btnView").onclick = openViewModal;
$("avatarSide").onclick = logout;
$("weekPick").onchange = e=>{ S.week=e.target.value; renderAll(); };
$("btnCollapse").onclick = ()=>{
  document.documentElement.classList.toggle("collapsed");
  $("btnCollapse").textContent = document.documentElement.classList.contains("collapsed") ? "›" : "‹";
