    if(error || !data?.length) return;
    $("suInitial").innerHTML = `<option value="">Kreatif harfin (yoksa boş bırak)</option>` +
      data.map(m=>`<option value="${esc(m.initial)}">${esc(m.initial)} · ${esc(m.name)}</option>`).join("");
  }catch(e){}
}
fillInitials();
/* ---------- ŞİFREMİ UNUTTUM ---------- */
function authView(v){ ["Login","Signup","Forgot","Reset"].forEach(k=>$("auth"+k).classList.toggle("hidden", k.toLowerCase()!==v)); }
function showReset(){ showAuth("",false); authView("reset"); }
$("goForgot").onclick=()=>{ authView("forgot"); $("fgEmail").value=$("liEmail").value; $("authMsg").textContent=""; };
$("goLogin2").onclick=()=>{ authView("login"); $("authMsg").textContent=""; };
$("btnForgot").onclick=async ()=>{
  if(DEMO) return;
  const email=$("fgEmail").value.trim(); if(!/^\S+@\S+\.\S+$/.test(email)){ showAuth("Geçerli bir e-posta yaz.",true); return; }
  $("btnForgot").disabled=true;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  $("btnForgot").disabled=false;
  if(error){ showAuth(/rate|limit|seconds/i.test(error.message)?"Çok sık denendi. Birkaç dakika bekleyip tekrar dene.":"Gönderilemedi: "+error.message,true); return; }
  showAuth("Bağlantı gönderildi ✓ E-postanı (gerekirse spam klasörünü) kontrol et. Bağlantıya tıklayınca yeni şifreni belirleyeceksin.",false);
};
$("btnReset").onclick=async ()=>{
  const p1=$("rsPass").value, p2=$("rsPass2").value;
  if(p1.length<6){ showAuth("Şifre en az 6 karakter olmalı.",true); return; }
  if(p1!==p2){ showAuth("İki şifre aynı değil.",true); return; }
  $("btnReset").disabled=true;
  const {error}=await sb.auth.updateUser({password:p1});
  $("btnReset").disabled=false;
  if(error){ showAuth("Şifre kaydedilemedi: "+error.message+" — bağlantının süresi dolmuş olabilir, yeni bağlantı iste.",true); return; }
  pwRecovery=false; history.replaceState(null,"",location.pathname); $("rsPass").value=$("rsPass2").value="";
  authView("login"); boot();
};
$("goSignup").onclick=()=>{ $("authLogin").classList.add("hidden"); $("authSignup").classList.remove("hidden"); $("authMsg").textContent=""; };
$("goLogin").onclick =()=>{ $("authSignup").classList.add("hidden"); $("authLogin").classList.remove("hidden"); $("authMsg").textContent=""; };

$("btnLogin").onclick = async ()=>{
  if(DEMO) return;
  $("btnLogin").disabled=true;
  const {error} = await sb.auth.signInWithPassword({email:$("liEmail").value.trim(), password:$("liPass").value});
  $("btnLogin").disabled=false;
  if(error){ showAuth("Giriş başarısız: "+error.message, true); return; }
  boot();
};
$("btnSignup").onclick = async ()=>{
  if(DEMO) return;
  const name=$("suName").value.trim();
  if(!name){ showAuth("Ad Soyad gerekli.",true); return; }
  $("btnSignup").disabled=true;
  const {data,error} = await sb.auth.signUp({email:$("suEmail").value.trim(), password:$("suPass").value,
    options:{data:{name, initial:$("suInitial").value||null}}});
  if(error){ $("btnSignup").disabled=false; showAuth("Kayıt başarısız: "+error.message, true); return; }
  if(data.session){
    await sb.from("profiles").insert({id:data.user.id, name, initial:$("suInitial").value||null});
  }
  $("btnSignup").disabled=false;
  boot();
};
const logout = async ()=>{
  if(DEMO){ alert("Demo modundasın."); return; }
  if(confirm("Çıkış yapılsın mı?")){ await sb.auth.signOut(); location.reload(); }
};
$("avatar").onclick = logout;
$("btnView").onclick = openViewModal;
$("avatarSide").onclick = logout;
$("weekPick").onchange = e=>{ S.week=e.target.value; renderAll(); };
$("btnCollapse").onclick = ()=>{
  document.documentElement.classList.toggle("collapsed");
  $("btnCollapse").textContent = document.documentElement.classList.contains("collapsed") ? "›" : "‹";
};

boot();
</script>
<!--MOBJS-->
<script id="mobJs">
/* ===== MOBİL: alt menü en fazla 5 buton (4 sekme + "Daha"), sekme etiketleri ikon + yazı ===== */
(()=>{
  const mq = matchMedia("(max-width:959px)"), MAX = 5;
  const EMO = /^\s*((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍\p{Extended_Pictographic})*)\s*/u;
  const obs = new MutationObserver(run);
  const watch = () => obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:["class"]});

  // "📝 Günlük" → <span class="ic">📝</span><span class="lb">Günlük</span>
  function split(b){
    if(b.dataset.mobSplit || b.querySelector(".ic")) return;
    const t = b.textContent, m = t.match(EMO);
    if(!m) return;
    b.dataset.mobSplit = 1;
    const lb = b.dataset.s || t.slice(m[0].length);
    b.innerHTML = `<span class="ic">${m[1]}</span><span class="lb"></span>`;
    b.querySelector(".lb").textContent = lb;
    if(b.dataset.s) b.title = t.slice(m[0].length);
  }
  function label(b){ return (b.querySelector(".lb")?.textContent || b.textContent.replace(EMO,"")).trim(); }
  function icon(b){ return b.querySelector(".ic")?.textContent || (b.textContent.match(EMO)||[])[1] || "•"; }

  function closeSheet(){ document.querySelector(".mob-sheet")?.remove(); }
  function openSheet(nav, items){
    closeSheet();
    const d = document.createElement("div"); d.className = "mob-sheet";
    d.innerHTML = `<div class="in"><div class="hd"><span>Diğer sekmeler</span><button type="button" aria-label="Kapat">✕</button></div><div class="gr"></div></div>`;
    const gr = d.querySelector(".gr");
    let sep = false;
    items.forEach(b=>{
      const ext = !b.dataset.tab && !b.dataset.t && !b.dataset.main;   // başka panele geçiş
      if(ext && !sep){ sep = true; gr.insertAdjacentHTML("beforeend", `<div class="sep">Diğer paneller</div>`); }
      const x = document.createElement("button"); x.type = "button";
      if(b.classList.contains("on") || b.classList.contains("active")) x.className = "on";
      x.innerHTML = `<span class="ic"></span><span></span>`;
      x.firstChild.textContent = icon(b); x.lastChild.textContent = label(b);
      x.onclick = ()=>{ closeSheet(); b.click(); };
      gr.appendChild(x);
    });
    d.onclick = e=>{ if(e.target === d || e.target.closest(".hd button")) closeSheet(); };
    document.body.appendChild(d);
  }

  function fix(nav){
    const btns = [...nav.children].filter(b=>/^(BUTTON|A)$/.test(b.tagName) && !b.dataset.mobMore);
    // değişiklik yoksa dokunma (sayfa başka yerde güncellenince buton yeniden oluşmasın, dokunuş kaçmasın)
    const sig = mq.matches + "|" + btns.length + "|" + btns.map(b=>b.className.replace(/\s*mob-hid/,"")+b.textContent).join(",");
    if(nav.__mobSig === sig && (!mq.matches || btns.length <= MAX || nav.querySelector(":scope > [data-mob-more]"))) return;
    nav.__mobSig = sig;
    nav.querySelectorAll(":scope > [data-mob-more]").forEach(x=>x.remove());
    btns.forEach(b=>{ b.classList.remove("mob-hid"); if(nav.classList.contains("tabs2") || nav.id==="mainTabs") split(b); });
    if(!mq.matches || btns.length <= MAX) return;
    const keep = MAX - 1;
    const onIx = btns.findIndex(b=>b.classList.contains("on") || b.classList.contains("active"));
    btns.forEach((b,i)=>{ if(i >= keep) b.classList.add("mob-hid"); });
    const more = document.createElement("button");
    more.type = "button"; more.dataset.mobMore = 1;
    const act = onIx >= keep ? btns[onIx] : null;
    more.innerHTML = `<span class="ic"></span><span class="lb"></span>`;
    more.firstChild.textContent = act ? icon(act) : "☰";
    more.lastChild.textContent = act ? label(act) : "Daha";
    if(act) more.classList.add(nav.id==="mainTabs" ? "active" : "on");
    more.onclick = e=>{ e.stopPropagation(); openSheet(nav, btns.slice(keep)); };
    nav.appendChild(more);
  }
  function run(){
    obs.disconnect();
    try{ document.querySelectorAll("nav.bottom, .tabs2, #mainTabs").forEach(fix); }
    finally{ watch(); }
  }
  mq.addEventListener ? mq.addEventListener("change", run) : mq.addListener(run);
  addEventListener("keydown", e=>{ if(e.key === "Escape") closeSheet(); });
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
})();
</script>
<!--/MOBJS-->
</body>
