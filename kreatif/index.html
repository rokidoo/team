<style>
  :root{
    --bg:#0d0f14; --card:#151923; --card2:#1b202c; --line:#242b3a;
    --txt:#e8ecf4; --mut:#8b93a7; --dim:#5a6275;
    --brand:#f59e0b; --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
    --amber:#fbbf24; --orange:#fb923c; --purple:#a78bfa; --gray:#6b7280;
    --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    background:var(--bg); color:var(--txt); min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  .hidden{display:none!important}

  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:40; background:rgba(13,15,20,.92);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; gap:10px;
  }
  header .logo{font-weight:800; font-size:1.02rem; letter-spacing:-.02em}
  header .logo span{color:var(--brand)}
  header .sp{flex:1}
  .weekpick{
    background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:7px 10px; font-size:.82rem; font-weight:600;
    appearance:none; -webkit-appearance:none;
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--card2);
    border:1px solid var(--line); display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:.8rem;color:var(--brand); cursor:pointer;
  }

  /* ---------- bottom nav ---------- */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:rgba(13,15,20,.94); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1; background:none; border:none; color:var(--dim); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:.62rem; font-weight:700; padding:6px 0; border-radius:10px;
    font-family:inherit;
  }
  nav button .ic{font-size:1.15rem; line-height:1}
  nav button.on{color:var(--brand)}

  /* ---------- generic ---------- */
  main{padding:16px; max-width:860px; margin:0 auto}
  h2{font-size:1.15rem; letter-spacing:-.02em; margin-bottom:4px}
  .sub{color:var(--mut); font-size:.8rem; margin-bottom:16px}
  .sect{margin-bottom:22px}
  .sect h3{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--mut); margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .sect h3 .cnt{
    background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:99px; padding:1px 8px; font-size:.68rem;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px; margin-bottom:10px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:5px; border-radius:99px;
    padding:3px 9px; font-size:.68rem; font-weight:700; border:1px solid;
  }
  .own{
    width:26px;height:26px;border-radius:8px; display:inline-flex;
    align-items:center;justify-content:center; font-weight:800; font-size:.78rem;
    flex-shrink:0;
  }
  .mrow{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px}
  .m{font-size:.78rem; color:var(--mut)}
  .m b{color:var(--txt); font-weight:700}
  .empty{
    text-align:center; color:var(--dim); font-size:.85rem; padding:28px 12px;
    border:1px dashed var(--line); border-radius:var(--r);
  }

  /* creative card */
  .ccard .top{display:flex; gap:10px; align-items:flex-start}
  .ccard .code{font-size:.78rem; font-weight:700; word-break:break-all; line-height:1.35}
  .ccard .meta{font-size:.7rem; color:var(--mut); margin-top:2px}
  .ccard .thumb{
    width:52px;height:52px;border-radius:10px; background:var(--card2);
    border:1px solid var(--line); flex-shrink:0; object-fit:cover;
    display:flex;align-items:center;justify-content:center; font-size:1.3rem;
  }
  .ccard .hook{
    margin-top:10px; font-size:.82rem; background:var(--card2);
    border-left:3px solid var(--brand); padding:8px 10px; border-radius:0 8px 8px 0;
    color:var(--txt);
  }
  .ccard .reason{margin-top:8px; font-size:.72rem; color:var(--mut); font-style:italic}

  /* filter chips */
  .filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{
    flex-shrink:0; background:var(--card); border:1px solid var(--line); color:var(--mut);
    border-radius:99px; padding:6px 13px; font-size:.75rem; font-weight:700; cursor:pointer;
    font-family:inherit;
  }
  .fchip.on{background:var(--brand); border-color:var(--brand); color:#14100a}

  /* team */
  .trow{display:flex; align-items:center; gap:12px}
  .trow .bar{flex:1; height:8px; background:var(--card2); border-radius:99px; overflow:hidden}
  .trow .bar i{display:block; height:100%; border-radius:99px}
  .tstats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
  .tstat{background:var(--card2); border-radius:10px; padding:8px 6px; text-align:center}
  .tstat b{display:block; font-size:1.05rem}
  .tstat span{font-size:.62rem; color:var(--mut); font-weight:600}

  /* finance table */
  .tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--card)}
  table{border-collapse:collapse; width:100%; font-size:.76rem; min-width:560px}
  th,td{padding:9px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
  th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--card)}
  th{color:var(--mut); font-size:.66rem; text-transform:uppercase; letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px}
  @media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px}
  .kpi b{display:block; font-size:1.25rem; letter-spacing:-.02em}
  .kpi span{font-size:.68rem; color:var(--mut); font-weight:600}

  /* forms / login */
  .auth{max-width:380px; margin:10vh auto 0; padding:0 20px}
  .auth .logo{font-size:1.5rem; font-weight:800; text-align:center; margin-bottom:6px}
  .auth .logo span{color:var(--brand)}
  .auth p{color:var(--mut); text-align:center; font-size:.85rem; margin-bottom:26px}
  input,textarea,select{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:13px 14px; font-size:.95rem; margin-bottom:10px;
    font-family:inherit;
  }
  input:focus,textarea:focus{outline:none; border-color:var(--brand)}
  .btn{
    width:100%; background:var(--brand); color:#14100a; border:none; border-radius:12px;
    padding:14px; font-size:.95rem; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .btn.sec{background:var(--card2); color:var(--txt); border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .authmsg{font-size:.8rem; text-align:center; margin-top:12px; color:var(--mut)}
  .authmsg.err{color:var(--red)}
  .switch{
    text-align:center; margin-top:16px; font-size:.82rem; color:var(--mut);
  }
  .switch a{color:var(--brand); font-weight:700; cursor:pointer; text-decoration:none}

  /* import */
  textarea.json{min-height:220px; font-family:ui-monospace,Menlo,monospace; font-size:.75rem}
  .implog{
    font-family:ui-monospace,Menlo,monospace; font-size:.72rem; color:var(--mut);
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px; margin-top:12px; white-space:pre-wrap; max-height:220px; overflow:auto;
  }

  /* demo banner + role switch */
  .demo{
    background:#2a1f0a; border:1px solid #6b5416; color:#fbd38d; font-size:.72rem;
    padding:8px 12px; border-radius:10px; margin-bottom:14px; display:flex; align-items:center; gap:8px;
    flex-wrap:wrap;
  }
  .demo select{width:auto; margin:0; padding:4px 8px; font-size:.72rem; border-radius:8px}

  /* modal */
  .modal{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6);
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media(min-width:600px){.modal{align-items:center}}
  .modal .box{
    background:var(--card); border:1px solid var(--line); width:100%; max-width:480px;
    border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85dvh; overflow:auto;
  }
  @media(min-width:600px){.modal .box{border-radius:20px}}
</style>

/* ================= SUPABASE VERİ ================= */
async function loadAll(){
  const [w,c,r,h] = await Promise.all([
    sb.from("weeks").select("*").order("week",{ascending:false}),
    sb.from("creatives").select("*").order("created_at",{ascending:false}),
    sb.from("weekly_results").select("*"),
    sb.from("hooks").select("*").order("updated_at",{ascending:false}),
  ]);
  S.weeks=w.data||[]; S.creatives=c.data||[]; S.results=r.data||[]; S.hooks=h.data||[];
  S.fins=[];
  if(canFin()){
    const f = await sb.from("weekly_financials").select("*");
    S.fins=f.data||[];
  }
  if(!S.week && S.weeks.length) S.week=S.weeks[0].week;
}

/* ================= RENDER ================= */
function metricRow(c){
  const r=resFor(c.code), f=finFor(c.code);
  let out=[];
  if(r){
    out.push(`<span class="m">Satış <b>${nf.format(r.sales??0)}</b></span>`);
    if(r.hook_rate!=null) out.push(`<span class="m">Hook <b>${pct(r.hook_rate)}</b></span>`);
    if(r.hold_rate!=null) out.push(`<span class="m">Hold <b>${pct(r.hold_rate)}</b></span>`);
    if(r.ctr!=null) out.push(`<span class="m">CTR <b>${pct(r.ctr)}</b></span>`);
  }
  if(canFin() && f){
    out.push(`<span class="m">Harcama <b>${tl(f.spend)}</b></span>`);
    out.push(`<span class="m">ROAS <b>${f.roas!=null?nf2.format(f.roas):"—"}</b></span>`);
    out.push(`<span class="m">GPT <b>${tl(f.gpt)}</b></span>`);
    out.push(`<span class="m">rGPT <b>${f.rel_gpt!=null?nf2.format(f.rel_gpt):"—"}</b></span>`);
  }
  return out.length?`<div class="mrow">${out.join("")}</div>`:"";
}

function creativeCard(c){
  const st = ST[statusAtWeek(c)]||ST.yeni;
  const fmtIc = c.format==="gorsel"?"🖼":c.format==="carousel"?"🧩":"🎬";
  const thumb = c.thumb_url
    ? `<img class="thumb" src="${esc(c.thumb_url)}" alt="">`
    : `<div class="thumb">${fmtIc}</div>`;
  return `<div class="card ccard" data-code="${esc(c.code)}">
    <div class="top">
      ${thumb}
      <div style="flex:1;min-width:0">
        <div class="code">${esc(c.code)}</div>
        <div class="meta">${ownBadge(c.owner_initial)} &nbsp;${esc(c.family||"")} · ${esc(c.tur||"")}${c.attribution==="belirsiz"?" · <span style='color:var(--purple)'>atıf belirsiz</span>":""}</div>
      </div>
      ${chip(st.l, st.c)}
    </div>
    ${c.hook_text?`<div class="hook">${esc(c.hook_code?c.hook_code+" · ":"")}${esc(c.hook_text)}</div>`:""}
    ${metricRow(c)}
    ${c.status_reason?`<div class="reason">${esc(c.status_reason)}</div>`:""}
  </div>`;
}

function renderBoard(){
  const wk = S.weeks.find(w=>w.week===S.week);
  const act = S.creatives.filter(c=>statusAtWeek(c)!=="arsiv");
  const grp = keys => act.filter(c=>keys.includes(statusAtWeek(c)));
  const sec = (title,arr,emptyTxt)=> `<div class="sect"><h3>${title} <span class="cnt">${arr.length}</span></h3>${arr.length?arr.map(creativeCard).join(""):`<div class="empty">${emptyTxt}</div>`}</div>`;

    <h2>Haftalık Board</h2>
    <div class="sub">${S.week?trDate(S.week)+" haftası":"Henüz veri yok"}${wk?.note?` · ${esc(wk.note)}`:""}</div>
    ${sec("🏆 Kazananlar", grp(["onayli_winner","winner_adayi"]), "Bu hafta kazanan yok")}
    ${sec("⚠️ Yorulma Riski", grp(["yorulma_riski"]), "Yorulma sinyali yok")}
    ${sec("🧪 Testte", grp(["testte","yeni","yetersiz_veri"]), "Testte kreatif yok")}
    ${sec("❌ Kaybedenler", grp(["loser"]), "Bu hafta kaybeden yok")}

}

function renderGallery(){
  const f = S.galFilter;
  let list = S.creatives.slice();
  if(f.owner) list = list.filter(c=>c.owner_initial===f.owner);
  if(f.status) list = list.filter(c=>c.status===f.status);

  const schips = ["",...Object.keys(ST)].map(s=>
    `<button class="fchip ${f.status===s?"on":""}" data-fs="${s}">${s?ST[s].l:"Tüm durumlar"}</button>`).join("");
  $("tabGallery").innerHTML = `

    <div class="sub">${list.length} kreatif</div>

        <div style="font-size:.7rem;color:var(--mut);margin-top:3px">${esc(h.code)}${h.first_week?" · "+trDate(h.first_week):""}</div>
      </div>

function renderTeam(){
  const active = S.creatives;
  const rows = Object.keys(OWNERS).map(o=>{
    const mine = active.filter(c=>c.owner_initial===o);
    const teslim = mine.length;
    const evald = mine.filter(c=>!["yeni","testte","yetersiz_veri"].includes(c.status)).length;
    const win = mine.filter(c=>["onayli_winner","winner_adayi"].includes(c.status)).length;
    const rate = evald ? win/evald : null;
    return {o, teslim, evald, win, rate};
  }).sort((a,b)=>(b.win-a.win)||(b.rate??0)-(a.rate??0));
  const maxWin = Math.max(1,...rows.map(r=>r.win));
  $("tabTeam").innerHTML = `
    <h2>Ekip Skoru</h2>
    <div class="sub">Üretim ve winner sayısı ayrı gösterilir; küçük örneklemde oran "ön sinyal"dir</div>
    ${rows.map(r=>{
      const w=OWNERS[r.o];
      return `<div class="card">
        <div class="trow">
          ${ownBadge(r.o)}
          <b style="font-size:.9rem">${esc(w.name)}</b>
          <div class="bar"><i style="width:${(r.win/maxWin)*100}%;background:${w.c}"></i></div>
          <b style="color:${w.c}">${r.win}</b>
        </div>
        <div class="tstats">
          <div class="tstat"><b>${r.teslim}</b><span>Teslim</span></div>
          <div class="tstat"><b>${r.evald}</b><span>Değerlendirilebilir</span></div>
          <div class="tstat"><b>${r.win}</b><span>Winner</span></div>
          <div class="tstat"><b>${r.rate==null?"—":pct(r.rate)}</b><span>Winner Oranı${r.evald<4?" *":""}</span></div>
        </div>
        ${r.evald<4?`<div class="reason" style="margin-top:8px;font-size:.68rem;color:var(--dim)">* Örneklem küçük (${r.evald} değerlendirilebilir) — ön sinyal.</div>`:""}
      </div>`;
    }).join("")}
  `;
}

function renderFinance(){
  if(!canFin()){ $("tabFinance").innerHTML=""; return; }
  const wf = S.fins.filter(f=>f.week===S.week);
  const tot = wf.reduce((a,f)=>({spend:a.spend+(+f.spend||0), revenue:a.revenue+(+f.revenue||0)}),{spend:0,revenue:0});
  const sales = S.results.filter(r=>r.week===S.week).reduce((a,r)=>a+(+r.sales||0),0);
  const roas = tot.spend? tot.revenue/tot.spend : null;
  const cpr  = sales? tot.spend/sales : null;
  const gpt  = (cpr!=null && roas!=null)? cpr*(roas-1) : null;
  const rows = wf.slice().sort((a,b)=>(+b.spend||0)-(+a.spend||0)).map(f=>{
    const c=S.creatives.find(x=>x.code===f.creative_code);
    const r=S.results.find(x=>x.creative_code===f.creative_code && x.week===S.week);
    return `<tr>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis" title="${esc(f.creative_code)}">${c?ownBadge(c.owner_initial):""} ${esc((f.creative_code||"").split("_").slice(2,5).join("_"))}</td>
      <td>${tl(f.spend)}</td><td>${tl(f.revenue)}</td><td>${nf.format(r?.sales??0)}</td>
      <td>${f.roas!=null?nf2.format(f.roas):"—"}</td><td>${tl(f.gpt)}</td>
      <td>${f.rel_gpt!=null?nf2.format(f.rel_gpt):"—"}</td>
    </tr>`;
  }).join("");
  $("tabFinance").innerHTML = `
    <h2>Finansal Özet</h2>
    <div class="sub">${S.week?trDate(S.week)+" haftası":""} · yalnızca yönetici ve ortak görür</div>
    <div class="kpis">
      <div class="kpi"><b>${tl(tot.spend)}</b><span>Harcama</span></div>
      <div class="kpi"><b>${tl(tot.revenue)}</b><span>Ciro</span></div>
      <div class="kpi"><b>${roas!=null?nf2.format(roas):"—"}</b><span>ROAS</span></div>
      <div class="kpi"><b>${tl(gpt)}</b><span>GPT (hesap)</span></div>
    </div>
    <div class="tblwrap"><table>
      <thead><tr><th>Kreatif</th><th>Harcama</th><th>Ciro</th><th>Satış</th><th>ROAS</th><th>GPT</th><th>rGPT</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="7" style="text-align:center;color:var(--dim)">Bu hafta finansal kayıt yok</td></tr>`}</tbody>
    </table></div>
    <div class="reason" style="margin-top:10px;font-size:.7rem;color:var(--dim)">GPT = CPR × (ROAS − 1). Meta verisinden hesaplanan karar metriğidir; muhasebe kârı değildir.</div>
  `;
}

function renderImport(){
  if(!isAdmin()){ $("tabImport").innerHTML=""; return; }
  $("tabImport").innerHTML = `
    <h2>Haftalık Veri İçe Aktar</h2>
    <div class="sub">Claude'un ürettiği haftalık JSON'u yapıştır → tüm paneller güncellenir</div>
    <textarea id="impJson" class="json" placeholder='{"week":"2026-08-10","note":"...","creatives":[...],"results":[...],"financials":[...]}'></textarea>
    <button class="btn" id="btnImport">İçe Aktar</button>

  `;

function renderNav(){

  ];
  if(canFin()) tabs.push(["finance","💰","Finans"]);
  if(isAdmin()) tabs.push(["import","📥","Aktar"]);

    `<button data-tab="${id}" class="${S.tab===id?"on":""}"><span class="ic">${ic}</span>${l}</button>`).join("");

function renderWeeks(){

function renderAll(){
  renderNav(); renderWeeks();

  if((S.tab==="finance"&&!canFin())||(S.tab==="import"&&!isAdmin())) S.tab="board";
  $("tab"+map[S.tab]).classList.remove("hidden");
  renderBoard(); renderGallery(); renderHooks(); renderTeam(); renderFinance(); renderImport();
  $("avatar").textContent = (S.profile?.initial || S.profile?.name?.[0] || "?").toUpperCase();

/* ================= IMPORT ================= */
async function doImport(){
  const log = $("impLog"); log.classList.remove("hidden"); log.textContent="";
  const say = m => { log.textContent += m+"\n"; };
  let data;
  try{ data = JSON.parse($("impJson").value); }
  catch(e){ say("❌ JSON okunamadı: "+e.message); return; }
  if(!data.week){ say("❌ 'week' alanı zorunlu (haftanın pazartesi tarihi, YYYY-AA-GG)."); return; }
  if(DEMO){ say("⚠️ DEMO modundasın — Supabase ayarları doldurulunca gerçek içe aktarma çalışır."); return; }
  try{
    say("→ Hafta kaydediliyor…");
    await sb.from("weeks").upsert({week:data.week, note:data.note||null, updated_at:new Date().toISOString()});
    if(Array.isArray(data.creatives) && data.creatives.length){
      say(`→ ${data.creatives.length} kreatif upsert…`);
      const rows = data.creatives.map(c=>({...c, updated_at:new Date().toISOString()}));
      const {error} = await sb.from("creatives").upsert(rows,{onConflict:"code"});
      if(error) throw error;
    }
    if(Array.isArray(data.results) && data.results.length){
      say(`→ ${data.results.length} haftalık sonuç upsert…`);
      const rows = data.results.map(r=>{
        const o={...r, week:data.week};
        o.hook_rate = o.hook_rate ?? (o.video_3s&&o.impressions? o.video_3s/o.impressions : null);
        o.hold_rate = o.hold_rate ?? (o.thruplay&&o.video_3s? o.thruplay/o.video_3s : null);
        o.ctr = o.ctr ?? (o.link_clicks&&o.impressions? o.link_clicks/o.impressions : null);
        return o;
      });
      const {error} = await sb.from("weekly_results").upsert(rows,{onConflict:"creative_code,week"});
      if(error) throw error;
      // durumları kreatif kartına da yansıt
      for(const r of rows){
        if(r.status_at_week) await sb.from("creatives").update({status:r.status_at_week, updated_at:new Date().toISOString()}).eq("code", r.creative_code);
      }
    }
    if(Array.isArray(data.financials) && data.financials.length){
      say(`→ ${data.financials.length} finansal kayıt upsert…`);
      let rows = data.financials.map(f=>({...f, week:data.week}));
      rows.forEach(f=>{
        const sales = (data.results||[]).find(r=>r.creative_code===f.creative_code)?.sales;
        f.roas = f.roas ?? (f.spend? f.revenue/f.spend : null);
        f.cpr  = f.cpr  ?? (sales? f.spend/sales : null);
        f.gpt  = f.gpt  ?? ((f.cpr!=null&&f.roas!=null)? f.cpr*(f.roas-1) : null);
      });
      const totSpend = rows.reduce((a,f)=>a+(+f.spend||0),0);
      const wAvg = totSpend? rows.reduce((a,f)=>a+(+f.gpt||0)*(+f.spend||0),0)/totSpend : null;
      rows.forEach(f=>{ f.rel_gpt = f.rel_gpt ?? ((wAvg&&f.gpt!=null)? f.gpt/wAvg : null); });
      const {error} = await sb.from("weekly_financials").upsert(rows,{onConflict:"creative_code,week"});
      if(error) throw error;
    }
    if(Array.isArray(data.hooks) && data.hooks.length){
      say(`→ ${data.hooks.length} hook upsert…`);
      const {error} = await sb.from("hooks").upsert(data.hooks.map(h=>({...h, updated_at:new Date().toISOString()})),{onConflict:"code"});
      if(error) throw error;
    }
    say("✅ Tamamlandı. Veriler yenileniyor…");
    await loadAll(); S.week=data.week; renderAll();
  }catch(e){ say("❌ Hata: "+(e.message||e)); }
}

/* ================= AUTH ================= */
function showAuth(msg,err){
  $("vAuth").classList.remove("hidden"); $("vApp").classList.add("hidden");
  const m=$("authMsg"); m.textContent=msg||""; m.className="authmsg"+(err?" err":"");
}
async function showApp(){
  $("vAuth").classList.add("hidden"); $("vApp").classList.remove("hidden");
  renderAll();
}

async function boot(){
  if(DEMO){
    demoData();
    S.profile={name:"Demo Yönetici", role:"admin", initial:"Y"};
    $("demoBar").classList.remove("hidden");
    $("demoRole").onchange = e=>{
      const r=e.target.value;
      S.profile = r==="admin" ? {name:"Demo Yönetici",role:"admin",initial:"Y"}
        : r==="partner" ? {name:"Demo Ortak",role:"partner",initial:"O"}
        : {name:"Demo Çağdaş",role:"creative",initial:"C"};
      S.tab="board"; renderAll();
    };
    await showApp(); return;
  }
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ showAuth(); return; }
  let {data:prof} = await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(!prof){
    // e-posta doğrulamalı kayıtta profil oluşmamış olabilir — ilk girişte tamamla
    const md = session.user.user_metadata||{};
    const row = {id:session.user.id, name: md.name || session.user.email.split("@")[0], initial: md.initial||null};
    const {data:ins,error} = await sb.from("profiles").insert(row).select().single();
    if(error){ showAuth("Profil oluşturulamadı: "+error.message, true); await sb.auth.signOut(); return; }
    prof = ins;
  }
  S.profile=prof;
  await loadAll();
  await showApp();
}

$("goSignup").onclick=()=>{ $("authLogin").classList.add("hidden"); $("authSignup").classList.remove("hidden"); $("authMsg").textContent=""; };
$("goLogin").onclick =()=>{ $("authSignup").classList.add("hidden"); $("authLogin").classList.remove("hidden"); $("authMsg").textContent=""; };

$("btnLogin").onclick = async ()=>{
  if(DEMO) return;
  $("btnLogin").disabled=true;
  const {error} = await sb.auth.signInWithPassword({email:$("liEmail").value.trim(), password:$("liPass").value});
  $("btnLogin").disabled=false;
  if(error){ showAuth("Giriş başarısız: "+error.message, true); return; }
  boot();
};
$("btnSignup").onclick = async ()=>{
  if(DEMO) return;
  const name=$("suName").value.trim();
  if(!name){ showAuth("Ad Soyad gerekli.",true); return; }
  $("btnSignup").disabled=true;
  const {data,error} = await sb.auth.signUp({email:$("suEmail").value.trim(), password:$("suPass").value,
    options:{data:{name, initial:$("suInitial").value||null}}});
  if(error){ $("btnSignup").disabled=false; showAuth("Kayıt başarısız: "+error.message, true); return; }
  if(data.user){
    await sb.from("profiles").insert({id:data.user.id, name, initial:$("suInitial").value||null});
  }
  $("btnSignup").disabled=false;
  boot();
};
$("avatar").onclick = async ()=>{
  if(DEMO){ alert("Demo modundasın. Supabase bağlanınca burası çıkış butonu olur."); return; }
  if(confirm("Çıkış yapılsın mı?")){ await sb.auth.signOut(); location.reload(); }
};
$("weekPick").onchange = e=>{ S.week=e.target.value; renderAll(); };

boot();
</script>
